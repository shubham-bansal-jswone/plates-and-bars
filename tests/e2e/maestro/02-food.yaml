# Log a food from the list: the Food screen shows it counted.
appId: app.plateandbar.mobile
---
- runFlow: subflows/setup.yaml
- extendedWaitUntil:
    visible: "Food"
    timeout: 15000
- tapOn: "Food"
- scrollUntilVisible:
    element: "\\+ Add to breakfast"
    centerElement: true
- tapOn: "\\+ Add to breakfast"
- tapOn: "Roti / chapati.*"
# Close and Done are pinned above and below the list, so they need no scrolling; the system back button closes the sheet the same way.
- back
# Closing the sheet leaves Food: the sheet's own tabs are gone, the day's summary counts the roti (102 kcal) and the breakfast card lists it.
- assertNotVisible: "Eating out"
- scrollUntilVisible:
    element: "102 of .* kcal eaten"
    direction: UP
- assertVisible: "102 of .* kcal eaten"
- scrollUntilVisible:
    element: "Roti / chapati.*"
    centerElement: true
- assertVisible:
    text: "Roti / chapati.*"
    below: "Breakfast"
