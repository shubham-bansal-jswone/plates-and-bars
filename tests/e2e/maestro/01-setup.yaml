# Fresh install: consent, the setup steps, the health check and the targets, then the app's tabs.
appId: app.plateandbar.mobile
---
- runFlow: subflows/setup.yaml
# Setup ends on Food (first setup toasts nothing); Targets is one tap away.
- extendedWaitUntil:
    visible: "Food"
    timeout: 15000
- tapOn: "Targets"
- scrollUntilVisible:
    element: "Redo setup"
