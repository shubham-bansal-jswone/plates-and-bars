# Shared by the flows: clean install, consent, setup answers, health check (all No), targets accepted. Ends on Food.
appId: app.plateandbar.mobile
---
- launchApp:
    clearState: true
# A system "isn't responding" dialog can cover the app on a slow runner; dismiss it by waiting.
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "I understand and agree to my data being stored as described"
    timeout: 30000
- tapOn: "I understand and agree to my data being stored as described"
- tapOn: "Continue"
- tapOn: "Male"
- tapOn: "Age"
- inputText: "30"
- tapOn: "Use cm"
- tapOn: "Height in cm"
- inputText: "165"
- hideKeyboard
# The weight field's content description did not take focus on Android; its placeholder does.
- tapOn: "kg"
- inputText: "82"
- hideKeyboard
- tapOn: "Continue"
- tapOn: "Mostly sitting.*"
- tapOn: "Continue"
- tapOn: "6"
- tapOn: "At a gym.*"
- tapOn: "Some experience.*"
- tapOn: "60 min"
- tapOn: "Continue"
- tapOn: "Lose fat.*"
- extendedWaitUntil:
    visible: "Quick health check"
    timeout: 20000
# Every health answer is No (the radio groups sit below the fold on a phone).
- repeat:
    while:
      visible: "No"
    commands:
      - tapOn:
          text: "No"
          index: 0
      - scroll
- tapOn: "See my targets"
- tapOn: "Use these targets"
