# Log a food from the list: the Food screen shows it counted.
appId: app.plateandbar.mobile
---
- runFlow: subflows/setup.yaml
- extendedWaitUntil:
    visible: "Food"
    timeout: 15000
- tapOn: "Food"
- scrollUntilVisible:
    element: "\\+ Add to breakfast"
    centerElement: true
- tapOn: "\\+ Add to breakfast"
- tapOn: "Roti / chapati.*"
# The Done button sits at the very end of the long food list; the system back button closes the sheet the same way.
- back
- extendedWaitUntil:
    visible: ".* of .* kcal eaten"
    timeout: 15000
- scrollUntilVisible:
    element: "Roti / chapati.*"
    centerElement: true
