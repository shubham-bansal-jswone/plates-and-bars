<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate & Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--fig-body:#2F3A34;--fig-arm:#6A7A71;--fig-eq:#A9B0AA;--bg:#F5F4EE;--surface:#FFFFFF;--ink:#16201A;--muted:#5D6961;--line:#DEDFD6;--track:#E7E8E0;--brand:#1E5B41;--on-brand:#FFFFFF;--protein:#2E7D59;--carbs:#C98F0C;--fat:#C3533A;--tint:#EAF2EC;--danger:#B3412B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fig-body:#DCE3DE;--fig-arm:#9DAAA2;--fig-eq:#4E5953;--bg:#111613;--surface:#1A211D;--ink:#EAEEE8;--muted:#9AA69E;--line:#2B3530;--track:#27312B;--brand:#7FC9A2;--on-brand:#0F1A14;--protein:#62BC90;--carbs:#E8B53A;--fat:#E27C61;--tint:#1F2D25;--danger:#F08A70}}
:root[data-theme="dark"]{--fig-body:#DCE3DE;--fig-arm:#9DAAA2;--fig-eq:#4E5953;--bg:#111613;--surface:#1A211D;--ink:#EAEEE8;--muted:#9AA69E;--line:#2B3530;--track:#27312B;--brand:#7FC9A2;--on-brand:#0F1A14;--protein:#62BC90;--carbs:#E8B53A;--fat:#E27C61;--tint:#1F2D25;--danger:#F08A70}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 16px 112px}
h1,h2,h3{margin:0;line-height:1.15}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.mark{font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.mark span{color:var(--brand)}
.datenav{display:flex;align-items:center;gap:2px}
.datenav button{width:40px;height:40px;border:0;background:transparent;border-radius:10px;font-size:1.4rem;line-height:1}
.datenav button:disabled{opacity:.3;cursor:default}
.datenav .d{text-align:center;min-width:104px}
.datenav strong{display:block;font-size:1rem}
.datenav small{display:block;color:var(--muted);font-size:.78rem}

/* plate */
.plate{display:grid;grid-template-columns:172px 1fr;gap:18px;align-items:center;padding:8px 0 20px;border-bottom:1px solid var(--line)}
.plate svg{width:172px;height:172px;display:block}
.plate circle.arc{transition:stroke-dasharray .6s ease}
.ctr-num{font-size:30px;font-weight:800;fill:var(--ink);letter-spacing:-.02em}
.ctr-lbl{font-size:12px;fill:var(--muted)}
.ctr-num.over{fill:var(--fat)}
.legend{display:grid;gap:12px}
.lg{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:baseline}
.lg i{width:12px;height:12px;border-radius:50%;align-self:center}
.lg b{font-weight:700}
.lg b small{font-weight:400;color:var(--muted)}
.lg em{grid-column:2/4;font-style:normal;color:var(--muted);font-size:.82rem;margin-top:-8px}
.kc-line{grid-column:1/-1;color:var(--muted);font-size:.88rem}
@media (max-width:370px){.plate{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}

/* meals */
.meal{padding:16px 0 6px;border-bottom:1px solid var(--line)}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.meal-h span{color:var(--muted);font-size:.9rem}
.items{list-style:none;margin:0;padding:0}
.items li{display:grid;grid-template-columns:1fr auto 36px;align-items:center;gap:8px;padding:8px 0}
.items li+li{border-top:1px dashed var(--line)}
.nm{display:block;font-weight:500}
.sub{display:block;color:var(--muted);font-size:.82rem}
.kc{font-weight:600}
.x{width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:8px;font-size:1.25rem;line-height:1}
.x:hover{background:var(--track)}
.add{display:inline-flex;align-items:center;gap:6px;margin:4px 0 10px;padding:8px 12px 8px 10px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--brand);font-weight:600}
.empty{padding:18px 0 4px;color:var(--muted)}
.empty .ghost{margin-top:10px}

/* buttons */
.primary{border:0;background:var(--brand);color:var(--on-brand);padding:12px 18px;border-radius:12px;font-weight:700}
.primary:disabled{opacity:.5;cursor:default}
.ghost{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:12px;font-weight:600}
.ghost.sm{padding:7px 12px;font-size:.9rem;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:500}

/* workout */
.start{padding:22px 0;border-bottom:1px solid var(--line);display:grid;gap:12px}
.start h2{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.start p{color:var(--muted)}
.wsum{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.wsum h2{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.wsum span{color:var(--muted);font-size:.9rem;text-align:right}
.ex{padding:16px 0;border-bottom:1px solid var(--line)}
.ex-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.last{color:var(--muted);font-size:.84rem;margin:2px 0 10px}
.sets{display:grid;gap:6px}
.set,.sh{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:8px;align-items:center}
.sh span{color:var(--muted);font-size:.78rem;text-align:center}
.set>span{text-align:center;color:var(--muted);font-weight:600}
.set input{width:100%;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;text-align:center;font-size:16px;font-weight:600}
.set input::placeholder{color:var(--muted);font-weight:400;opacity:.7}
.set.done input{background:var(--tint);border-color:transparent}
.tick{height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:800;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.block{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.inline{display:flex;gap:8px;align-items:center}
.inline input,.field input,.field textarea,.search{height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;font-size:16px;width:100%}
.inline input{max-width:120px}
.hint{color:var(--muted);font-size:.86rem}

/* progress */
.chart{width:100%;height:auto;display:block;margin:6px 0}
.chart .ln{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--brand)}
.chart text{fill:var(--muted);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.wk{display:grid;gap:10px;margin-top:6px}
.wk-r{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center}
.wk-r .lab{font-size:.85rem;color:var(--muted)}
.wk-r .lab b{display:block;color:var(--ink);font-weight:600}
.bar{position:relative;height:26px;background:var(--track);border-radius:6px;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--carbs);opacity:.85}
.bar .fill.over{background:var(--fat)}
.bar .tgt{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.bar .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:.8rem;font-weight:600}
.avg{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.avg div{font-size:.85rem;color:var(--muted)}
.avg b{display:block;font-size:1.25rem;color:var(--ink)}

/* targets */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:6px}
.field label{font-size:.88rem;color:var(--muted);font-weight:500}
.field textarea{height:96px;padding:10px 12px;resize:vertical}
.myfoods{list-style:none;padding:0;margin:0}
.myfoods li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;margin:0 auto}
.tabs button{border:0;background:transparent;padding:9px 4px 10px;display:grid;justify-items:center;gap:3px;font-size:.76rem;color:var(--muted);font-weight:500}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--brand);font-weight:700}

/* sheet */
dialog#sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink);overflow:hidden}
dialog#sheet::backdrop{background:rgba(8,14,10,.5)}
.sheet-in{padding:14px 16px calc(22px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:88vh;max-height:88dvh;display:grid;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;background:var(--track);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;font-weight:600;color:var(--muted);font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.flist{list-style:none;margin:0;padding:0}
.flist li+li{border-top:1px dashed var(--line)}
.flist button{width:100%;display:grid;grid-template-columns:1fr auto;gap:8px;text-align:left;border:0;background:transparent;padding:10px 2px}
.flist .kc{color:var(--brand)}
.grp{font-size:.82rem;color:var(--muted);font-weight:600;margin:6px 0 0}
.serv{display:flex;align-items:center;gap:10px}
.serv button{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:1.2rem;font-weight:700}
.serv b{min-width:40px;text-align:center;font-size:1.1rem}
.est li{display:grid;grid-template-columns:1fr auto;padding:8px 0;border-top:1px dashed var(--line)}

/* weight guidance */
.ex-tools{display:flex;gap:2px}
.guide{margin:4px 0 12px;padding:12px 14px;border-radius:12px;background:var(--tint);display:grid;gap:8px}
.guide ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:.93rem}
.sug{margin:4px 0 12px;padding:10px 12px;border-left:3px solid var(--brand);background:var(--tint);border-radius:0 10px 10px 0;display:grid;gap:3px}
.sug span{font-size:.88rem;color:var(--muted)}
.rate{display:grid;gap:6px;padding:4px 0 6px}
.rate-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rate-btns button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-size:.84rem;font-weight:600;line-height:1.2}
.rate .rate-btns:has(button:nth-child(2):last-child){grid-template-columns:1fr 1fr}
.rated{padding:0 0 4px 42px}
.rate-pill{border:0;background:var(--track);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.formq{margin-top:8px}
/* habits & second session */
.habit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.habit div{background:var(--tint);border-radius:12px;padding:10px;display:grid;gap:2px}
.habit b{font-size:1.2rem;font-weight:800}
.habit span{font-size:.76rem;color:var(--muted)}
.part2{margin:18px 0 0;padding-top:12px;border-top:2px solid var(--line)}
/* gap fixes */
.syncb{font-size:.7rem;font-weight:600;color:var(--fat);margin-left:6px;vertical-align:2px}
.screen .sq{display:grid;gap:6px;padding:8px 0;border-top:1px dashed var(--line);font-size:.9rem}
.danger{color:var(--danger);border-color:var(--danger)}
/* rest bar, fibre, misc */
.restbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;justify-content:center;padding:0 12px}
.restbar[hidden]{display:none}
.restbar>*{max-width:536px}
.restbar{flex-direction:column;align-items:center}
.rb-in{width:100%;max-width:536px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:12px 12px 0 0}
.rb-in span{display:block;font-size:.8rem;opacity:.8}
.rb-in .ghost{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.35)}
.rb-btns{display:flex;gap:6px}
.rb-bar{width:100%;max-width:536px;height:4px;background:var(--track);border-radius:0 0 4px 4px;overflow:hidden}
.rb-bar i{display:block;height:100%;background:var(--brand)}
.fib-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;padding:10px 0 2px;align-items:center}
.complete{padding:14px 0 4px;font-size:.92rem;align-items:flex-start}
.warm{margin:0 0 10px}
/* muscle map */
.preview{display:grid;grid-template-columns:minmax(150px,46%) 1fr;gap:14px;align-items:start;padding:4px 0}
@media (max-width:380px){.preview{grid-template-columns:1fr}}
.pv-map{display:grid;gap:6px;justify-items:center}
.bodymap{width:100%;max-width:240px;height:auto;display:block}
.pv-map.sm .bodymap{max-width:180px}
.bm-leg{display:flex;gap:12px;font-size:.78rem;color:var(--muted)}
.bm-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.pv-txt{display:grid;gap:6px}
.pv-list{margin:4px 0 0;padding-left:18px;display:grid;gap:4px;font-size:.9rem}
.pv-list b{font-weight:600}
.ex-mus{font-size:.86rem;margin:-6px 0 10px}
.sess-map{margin:8px 0 0}
/* form check, cycle, labs */
.fc-frames{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fc-frames img{width:100%;border-radius:8px;aspect-ratio:3/4;object-fit:cover;background:var(--track)}
.fc-res{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.fc-row{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:.9rem;padding:8px 10px;border-radius:10px;background:var(--tint)}
.fc-row.watch b{color:var(--fat)}.fc-row.good b{color:var(--protein)}.fc-row.unclear b{color:var(--muted)}
.lab-tbl{display:grid;gap:6px;max-height:50vh;overflow:auto}
.lab-h,.lab-r{display:grid;grid-template-columns:1fr 70px 56px 56px;gap:6px;align-items:center;font-size:.85rem}
.lab-h span{color:var(--muted)}
.lab-r input{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px;padding:0 6px;min-width:0}
.lab-card{border-left:3px solid var(--carbs);background:var(--tint);border-radius:0 10px 10px 0;padding:10px 12px;display:grid;gap:4px;margin-top:8px}
.lab-card.red{border-left-color:var(--danger)}
.docsum{white-space:pre-wrap;font-size:.8rem;background:var(--tint);padding:10px;border-radius:10px;max-height:50vh;overflow:auto}
/* plans & cooking */
.mp-day{border-top:1px solid var(--line);padding-top:8px}
.mp-list{list-style:none;padding:0;margin:6px 0;display:grid;gap:6px}
.mp-list li{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.groc li b{white-space:nowrap}
.cook-step{font-size:1.35rem;line-height:1.4;font-weight:600;padding:12px 0}
.imp textarea{height:110px}
/* science */
.why-l{font-size:.86rem;font-weight:600;padding:0 2px}
.learn-read{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px dashed var(--brand)}
.learn-read b{display:block}
.ask{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.ask-a{padding:10px 12px;border-left:3px solid var(--brand);background:var(--tint);border-radius:0 10px 10px 0;font-size:.95rem}
/* weekly check-in */
.ci-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ci-grid div{background:var(--tint);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.ci-grid b{font-size:1.3rem;font-weight:800}
.ci-grid b small{font-size:.8rem;font-weight:500;color:var(--muted)}
.ci-grid span{font-size:.8rem;color:var(--muted)}
#checkin{display:grid;gap:10px}
.burn{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.burnline{margin:-4px 0 8px}
.ci-sum p{font-size:.95rem;padding:10px 12px;border-left:3px solid var(--brand);background:var(--tint);border-radius:0 10px 10px 0}
/* body */
.pp-ctl{display:flex;gap:12px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.pp-ctl select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-left:4px;font-size:16px}
.pp-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pp-two figure,.pp-grid figure{margin:0;display:grid;gap:4px}
.pp-two img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--track)}
.pp-two figcaption,.pp-grid figcaption{font-size:.78rem;color:var(--muted)}
.pp-slide{position:relative;aspect-ratio:3/4;max-width:360px;border-radius:12px;overflow:hidden;background:var(--track)}
.pp-slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pp-slide span{position:absolute;bottom:8px;font-size:.75rem;font-weight:700;background:rgba(0,0,0,.55);color:#fff;padding:2px 8px;border-radius:6px}
.pp-l{left:8px}.pp-r{right:8px}
[data-pp="slider"]{width:100%;max-width:360px;accent-color:var(--brand)}
.pp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pp-grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--track)}
.pp-poses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pp-pose{display:grid;gap:6px;justify-items:center}
.pp-pose img,.pp-empty{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--track);display:grid;place-items:center;color:var(--muted);font-size:.85rem}
.filebtn.sm{padding:6px 10px;font-size:.85rem;border-radius:10px}
/* recipes & guidance */
.rb{display:grid;gap:14px}
.rb-row{display:grid;grid-template-columns:1fr 70px 64px 36px;gap:6px;align-items:center;margin-bottom:6px}
.rb-row select,.rb-row input{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px;padding:0 6px;min-width:0}
.guide-card{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.linkrow{width:100%;border:0;background:transparent;padding:0;text-align:left}
.linkrow b{display:block;font-size:1.05rem}
.combo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.combo b{display:block;font-weight:600;font-size:.95rem}
.dietchips .chip{padding:6px 12px;font-size:.88rem}
.plate-guide{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;margin-top:8px}
.plate-guide svg{width:96px;height:96px}
.upg{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;margin:4px 0 6px;border-radius:10px;background:var(--tint);font-size:.88rem}
/* photos & water */
.snaprow{display:flex;align-items:center;gap:12px;padding:14px 0 4px;flex-wrap:wrap}
.ph{display:grid;gap:12px}
.ph-prev{width:100%;max-height:260px;object-fit:cover;border-radius:12px}
.filebtn{display:inline-block;text-align:center;cursor:pointer;position:relative}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.review{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}

<body>
<div class="app">
  <header class="top">
    <div class="mark">Plate <span>&amp;</span> Bar <small id="syncb" class="syncb" hidden>not synced</small></div>
    <div class="datenav" id="datenav">
      <button id="prev" aria-label="Previous day">‹</button>
      <div class="d"><strong id="dLabel">Today</strong><small id="dSub"></small></div>
      <button id="next" aria-label="Next day">›</button>
    </div>
  </header>
  <main id="view"><p class="loading">Opening your log…</p></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="food"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/></svg>Food</button>
  <button data-tab="workout"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Workout</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3.5 18l5-6 4 3 7.5-9"/><path d="M3.5 21h17"/></svg>Progress</button>
  <button data-tab="targets"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.5l3 2"/></svg>Targets</button>
</div></nav>

<dialog id="sheet" aria-label="Add"></dialog>
<div id="restbar" class="restbar" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const newId = () => Math.random().toString(36).slice(2,10);
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = n => Math.round(n).toLocaleString('en-IN');
const r1 = n => Math.round(n*10)/10;
const TODAY = () => ymd(new Date());
const shortDate = s => parseYmd(s).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const dayName = s => parseYmd(s).toLocaleDateString('en-IN',{weekday:'short'});

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2200); }

/* ---------- data ---------- */
const DEFAULT_SETTINGS = { kcal:1900, protein:150, carbs:190, fat:60, myFoods:[], profile:null };
const MEALS = ['Breakfast','Lunch','Snacks','Dinner'];

// per serving: kcal, protein, carbs, fat (approximate, home-style)
const FOODS = [
  ['Roti / chapati','1 medium (30 g atta)',102,4.0,21.6,0.8],
  ['Rice, cooked','1 cup (50 g raw)',182,3.5,40.0,0.3],
  ['Dal','1 katori (35 g dal)',161,7.8,23.3,4.6],
  ['Rajma / chole','1 katori (40 g dry)',191,9.4,27.2,5.5],
  ['Mixed veg sabzi','1 katori',138,3.7,15.8,7.4],
  ['Paneer','100 g',280,18.0,2.5,22.0],
  ['Paneer bhurji','1 katori',343,19.0,8.7,26.2],
  ['Chicken breast, cooked','100 g',160,29.9,0.0,3.5],
  ['Chicken curry','1 katori',217,20.6,5.0,12.5],
  ['Egg, whole','1 large',72,6.3,0.3,4.8],
  ['Egg white','1 large',17,3.6,0.2,0.1],
  ['Curd / dahi','100 g',58,3.1,4.6,3],
  ['Greek yogurt, plain','100 g',75,9,4,2],
  ['Toned milk','1 glass (250 ml)',145,8,12,7.5],
  ['Whey protein','1 scoop',120,24,3,1.5],
  ['Soya chunks, dry','50 g',164,25.8,16.9,0.6],
  ['Oats, dry','40 g',156,6.8,26.5,2.8],
  ['Poha','1 plate',291,6.3,43.5,10.3],
  ['Upma','1 plate',257,7.6,41.1,6.6],
  ['Idli','1 piece',71,2.6,14.6,0.2],
  ['Dosa, plain','1 medium',178,5.2,29.3,4.4],
  ['Sambar','1 katori',95,4.0,13.1,3.3],
  ['Aloo paratha','1 piece',277,8.0,48.2,7.3],
  ['Brown bread','1 slice',70,3,12,1],
  ['Peanut butter','1 tbsp',95,4,3,8],
  ['Banana','1 medium',105,1.3,26.9,0.4],
  ['Apple','1 medium',95,0.5,25.1,0.4],
  ['Almonds','10 pieces',69,2.5,2.6,6.0],
  ['Roasted chana','30 g',113,6.2,18.9,1.8],
  ['Sprouts salad','1 katori',150,10.0,27.6,0.5],
  ['Ghee','1 tsp',44,0.0,0.0,5.0],
  ['Tea with milk & sugar','1 cup',80,2,11,3],
];

const LIB = {
  Chest:['Barbell Bench Press','Incline Dumbbell Press','Machine Chest Press','Pec Deck Fly','Cable Crossover','Push-ups'],
  Shoulders:['Seated Dumbbell Press','Machine Shoulder Press','Lateral Raise','Cable Lateral Raise','Rear Delt Fly','Face Pull'],
  Triceps:['Rope Pushdown','Overhead Cable Extension','Close-Grip Bench Press','Assisted Dips'],
  Back:['Lat Pulldown','Seated Cable Row','Chest-Supported Row','One-Arm Dumbbell Row','Assisted Pull-up','Straight-Arm Pulldown'],
  Biceps:['Dumbbell Curl','Hammer Curl','Cable Curl','Preacher Curl'],
  Legs:['Hack Squat','Leg Press','Goblet Squat','Walking Lunge','Leg Extension','Lying Leg Curl','Seated Leg Curl','Hip Thrust','Standing Calf Raise','Seated Calf Raise'],
  Core:['Cable Crunch','Hanging Knee Raise','Plank (seconds)','Dead Bug'],
};
const TEMPLATES = {
  'Push A':['Machine Chest Press','Incline Dumbbell Press','Seated Dumbbell Press','Lateral Raise','Rope Pushdown'],
  'Pull A':['Lat Pulldown','Seated Cable Row','Face Pull','Dumbbell Curl','Cable Crunch'],
  'Legs A':['Hack Squat','Lying Leg Curl','Hip Thrust','Leg Extension','Standing Calf Raise','Cable Crunch'],
  'Push B':['Barbell Bench Press','Machine Shoulder Press','Pec Deck Fly','Cable Lateral Raise','Overhead Cable Extension'],
  'Pull B':['Assisted Pull-up','Chest-Supported Row','One-Arm Dumbbell Row','Rear Delt Fly','Hammer Curl'],
  'Legs B':['Leg Press','Seated Leg Curl','Dumbbell Split Squat','Hip Thrust','Seated Calf Raise','Hanging Knee Raise'],
};
const WEEK = {0:null,1:'Push A',2:'Pull A',3:'Legs A',4:'Push B',5:'Pull B',6:'Legs B'};

/* ---------- storage: private cloud rows when available, browser otherwise ---------- */
const mem = {};
const Store = {
  mode:'local', col:null, queues:{},
  async init(){
    try{
      if(!window.claude || typeof claude.use !== 'function') return;
      const both = Promise.all([claude.use('db'), claude.use('user')]);
      const [db, user] = await Promise.race([both, new Promise(r => setTimeout(() => r([null,null]), 9000))]);
      if(!db || !user) return;
      const id = await user.id();
      if(!id) return;
      this.col = db.collection('data/users/' + id);
      this.mode = 'cloud';
    }catch(e){ this.mode = 'local'; }
  },
  async get(key){
    if(this.mode === 'cloud'){
      try{
        if(this.queues[key]) await this.queues[key];
        const s = await this.col.doc(key).get();
        return s.exists ? JSON.parse(JSON.stringify(s.data())) : null;
      }catch(e){ return mem[key] ?? null; }
    }
    try{ const v = localStorage.getItem('pb:' + key); return v ? JSON.parse(v) : (mem[key] ?? null); }
    catch(e){ return mem[key] ?? null; }
  },
  set(key, obj){
    const data = JSON.parse(JSON.stringify(obj));
    mem[key] = data;
    if(this.mode === 'cloud'){
      const prev = this.queues[key] || Promise.resolve();
      const p = prev.then(() => this.col.doc(key).set(data)).catch(e => {
        if(e && e.code === 'invalid_argument'){ toast('This view can’t save changes.'); }
        else if(e && e.code === 'quota_exceeded'){ toast('Storage is full. Remove old entries to keep saving.'); }
        else { toast('Couldn’t save. Check your connection and try again.'); }
      });
      this.queues[key] = p;
      return p;
    }
    try{ localStorage.setItem('pb:' + key, JSON.stringify(data)); }catch(e){}
    return Promise.resolve();
  }
};
const timers = {}, pending = {};
function saveSoon(key, obj, ms = 500){
  pending[key] = obj; clearTimeout(timers[key]);
  timers[key] = setTimeout(() => { delete pending[key]; Store.set(key, obj); }, ms);
}
function flush(){ for(const k of Object.keys(pending)){ clearTimeout(timers[k]); Store.set(k, pending[k]); delete pending[k]; } }
addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if(document.hidden) flush(); });

/* ---------- state ---------- */
const S = { date:TODAY(), tab:'food', ready:false, sessions:{ entries:{} }, measures:{ entries:{} }, ui:{}, settings:{...DEFAULT_SETTINGS}, day:null, lifts:{}, weights:{entries:{}} };
const blankDay = () => ({ meals:[], workout:{ template:null, exercises:[], cardio:'' } });
function normDay(d){ d = d || blankDay(); d.meals = d.meals || []; d.workout = d.workout || blankDay().workout; d.workout.exercises = d.workout.exercises || []; return d; }
async function loadDay(){ flush(); S.day = normDay(await Store.get('day-' + S.date)); }
function saveDay(){
  saveSoon('day-' + S.date, S.day);
  const w = S.day.workout, n = w.exercises.reduce((a, e) => a + e.sets.filter(x => x.done).length, 0), had = S.sessions.entries[S.date];
  if(n > 0) S.sessions.entries[S.date] = { t: w.base || w.template || 'Session', n };
  else if(had) delete S.sessions.entries[S.date];
  if(n > 0 || had) saveSoon('sessions', S.sessions);
}

function totals(meals = S.day.meals){
  return meals.reduce((t,m) => { t.kcal += m.kcal*m.qty; t.p += m.p*m.qty; t.c += m.c*m.qty; t.f += m.f*m.qty; return t; }, {kcal:0,p:0,c:0,f:0});
}

/* ---------- header & tabs ---------- */
function renderHeader(){
  const t = TODAY(), y = addDays(t,-1);
  $('#dLabel').textContent = S.date === t ? 'Today' : S.date === y ? 'Yesterday' : dayName(S.date);
  $('#dSub').textContent = parseYmd(S.date).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'});
  $('#next').disabled = S.date >= t;
  $('#datenav').style.visibility = (S.tab === 'targets' || S.tab === 'setup') ? 'hidden' : 'visible';
  document.querySelector('.tabs').style.display = S.tab === 'setup' ? 'none' : '';
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
}
const view = $('#view');
function render(){
  renderHeader();
  if(!S.ready){ view.innerHTML = '<p class="loading">Opening your log…</p>'; return; }
  if(!S.settings.consent){ document.querySelector('.tabs').style.display = 'none'; $('#datenav').style.visibility = 'hidden'; view.innerHTML = consentHtml(); return; }
  ({food:renderFood, workout:renderWorkout, progress:renderProgress, targets:renderTargets, setup:renderSetup})[S.tab]();
}

/* ---------- food ---------- */
function arc(r, val, tgt, color){
  const C = 2*Math.PI*r, frac = tgt > 0 ? Math.min(val/tgt, 1) : 0;
  const base = `<circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--track)" stroke-width="12"/>`;
  if(frac <= 0) return base;
  return base + `<circle class="arc" cx="90" cy="90" r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(frac*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 90 90)"/>`;
}
function legendRow(name, v, tgt, color){
  const left = tgt - v;
  return `<div class="lg"><i style="background:${color}"></i><span>${name}</span><b>${fmt(v)}<small> / ${fmt(tgt)} g</small></b>
    <em>${left >= 0 ? fmt(left) + ' g to go' : fmt(-left) + ' g over'}</em></div>`;
}
function renderFood(){
  const t = totals(), g = { ...S.settings, kcal: kcalTarget(S.date) }, left = g.kcal - t.kcal;
  let h = `<section class="plate">
    <svg viewBox="0 0 180 180" role="img" aria-label="${fmt(t.kcal)} of ${fmt(g.kcal)} kcal eaten">
      ${arc(80, t.p, g.protein, 'var(--protein)')}${arc(64, t.c, g.carbs, 'var(--carbs)')}${arc(48, t.f, g.fat, 'var(--fat)')}
      <text x="90" y="92" text-anchor="middle" class="ctr-num ${left < 0 ? 'over' : ''}">${fmt(Math.abs(left))}</text>
      <text x="90" y="110" text-anchor="middle" class="ctr-lbl">${left < 0 ? 'kcal over' : 'kcal left'}</text>
    </svg>
    <div class="legend">
      ${legendRow('Protein', t.p, g.protein, 'var(--protein)')}
      ${legendRow('Carbs', t.c, g.carbs, 'var(--carbs)')}
      ${legendRow('Fat', t.f, g.fat, 'var(--fat)')}
      <p class="kc-line">${fmt(t.kcal)} of ${fmt(g.kcal)} kcal eaten</p>
    </div>
  </section>`;
  if(S.ui.stepsTgt === undefined){ S.ui.stepsTgt = 0; stepsTarget().then(v => { S.ui.stepsTgt = v; }); }
  if(sampleFn && SAMPLE_IMG) h += `<div class="snaprow"><button class="primary" data-act="snap">Snap a meal</button><span class="hint">Photo → AI estimates → you check and add</span></div>`;
  h += fibreHtml() + flexNoteHtml() + checkinBanner() + energyHtml() + waterHtml() + guidanceHtml();
  if(!S.day.meals.length){
    h += `<div class="empty"><p>Nothing logged for this day yet. Add food under a meal, or copy the previous day if you ate the same things.</p>
      <button class="ghost sm" data-act="repeat">Copy previous day</button></div>`;
  }
  for(const meal of MEALS){
    const items = S.day.meals.filter(m => m.meal === meal);
    const mt = totals(items);
    h += `<section class="meal"><div class="meal-h"><h2>${meal}</h2><span>${items.length ? fmt(mt.kcal) + ' kcal' : ''}</span></div>`;
    if(items.length){
      h += '<ul class="items">' + items.map(m => `<li><div><span class="nm">${esc(m.name)}${m.qty !== 1 ? ` <small>×${r1(m.qty)}</small>` : ''}</span>

async function estimate(){
  const txt = ($('#dsTxt')?.value || '').trim();
  FS.txt = txt;
  if(!txt){ FS.err = 'Describe the meal first, with rough amounts if you know them.'; renderFoodSheet(); return; }
  FS.busy = true; FS.err = ''; FS.est = null; renderFoodSheet();
  try{
    const prompt = `Estimate the nutrition of this meal, eaten in India. Assume typical home-cooked portions when amounts are not given.\n\nMeal: """${txt}"""\n\nReply with ONLY a JSON object, no other text: {"items":[{"name":string,"qty":string,"kcal":number,"protein":number,"carbs":number,"fat":number}]} where protein, carbs and fat are grams for the whole quantity eaten.`;
    const res = await sampleFn.json(prompt, { modelTier:'quick' });
    const items = (res && Array.isArray(res.items) ? res.items : []).map(i => ({ name:String(i.name || 'Item'), qty:String(i.qty || ''), kcal:num(i.kcal), protein:num(i.protein), carbs:num(i.carbs), fat:num(i.fat) }));
    if(!items.length) FS.err = 'Couldn’t read that meal. Try listing items with amounts.';
    FS.est = items.length ? items : null;
  }catch(e){
    const c = e && e.code;
    if(c === 'not_granted'){ FS.err = 'Estimating needs you to turn on AI features. Use Custom or the food list instead.'; }
    else if(c === 'rate_limited'){ FS.err = 'Too many requests right now. Wait a minute and try again.'; }
    else { FS.err = 'Couldn’t get an estimate. Try again, or enter it under Custom.'; }
  }
  FS.busy = false;
  if(sheet.open) renderFoodSheet();
}

/* ---------- code-built exercise animations ---------- */
const AN = (() => {
  const SEG = { torso:70, head:11, neck:15, ua:36, fa:32, th:50, sh:48, foot:15 };
  const W = { torso:26, th:17, sh:12, ua:11, fa:9, foot:7 };
  const rad = a => a * Math.PI / 180;
  const pt = (p, a, l) => [p[0] + l * Math.cos(rad(a)), p[1] + l * Math.sin(rad(a))];
  const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
  const lerp = (a, b, k) => a + (b - a) * k;
  function mix(a, b, k){
    const o = {};
    for(const key in a){
      const x = a[key], y = b[key] === undefined ? x : b[key];
      o[key] = Array.isArray(x) ? x.map((v, i) => lerp(v, y[i], k)) : typeof x === 'number' ? lerp(x, y, k) : x;
    }
    return o;
  }
  function ik(A, B, l1, l2, sign){
    const dx = B[0] - A[0], dy = B[1] - A[1];
    let d = Math.hypot(dx, dy); d = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(l1 + l2 - 0.01, d));
    const base = Math.atan2(dy, dx), a = Math.acos((l1*l1 + d*d - l2*l2) / (2*l1*d));
    const ang = base + sign * a;
    return [A[0] + l1 * Math.cos(ang), A[1] + l1 * Math.sin(ang)];
  }
  const ln = (p, q, w, c, extra = '') => `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${extra}/>`;
  const circ = (p, r, fill, extra = '') => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${fill}"${extra}/>`;
  // side of a segment: front = +1, back = -1. Limbs: rotate(dir, -90); torso: rotate(dir, +90)
  function band(p, q, w, side, isTorso, from, to, c){
    const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1, u = [dx/L, dy/L];
    let n = isTorso ? [-u[1], u[0]] : [u[1], -u[0]];
    n = [n[0]*side, n[1]*side];
    const off = w * 0.22, a = [p[0] + dx*from + n[0]*off, p[1] + dy*from + n[1]*off], b = [p[0] + dx*to + n[0]*off, p[1] + dy*to + n[1]*off];
    return ln(a, b, Math.max(4, w * 0.5), c);
  }

  function sideJoints(E, P){
    const J = {};
    if(E.root === 'toe'){
      J.toe = P.toe || E.toe; J.ankle = pt(J.toe, P.foot, SEG.foot); J.knee = pt(J.ankle, P.shin, SEG.sh); J.hip = pt(J.knee, P.thigh, SEG.th);
    } else if(E.root === 'ankle' && P.shin !== undefined){
      J.ankle = P.ankle || E.ankle; J.knee = pt(J.ankle, P.shin, SEG.sh); J.hip = pt(J.knee, P.thigh, SEG.th);
    } else {
      J.hip = P.hip || E.hip;
      if(P.ankle){ J.ankle = P.ankle; J.knee = ik(J.hip, J.ankle, SEG.th, SEG.sh, E.kb || -1); }
      else { J.knee = pt(J.hip, P.thigh, SEG.th); J.ankle = pt(J.knee, P.shinD, SEG.sh); }
    }
    J.toe = J.toe || pt(J.ankle, P.footA === undefined ? 0 : P.footA, SEG.foot);
    J.sh = pt(J.hip, P.torso, SEG.torso);
    J.head = pt(J.sh, P.torso + (P.neck || 0), SEG.neck + SEG.head);
    if(P.wrist || P.wristR){
      J.wr = P.wrist || add(J.sh, P.wristR);
      J.el = ik(J.sh, J.wr, SEG.ua * (P.uaS || 1), SEG.fa, E.eb || 1);
    } else {
      const ua = P.uaR !== undefined ? P.torso + P.uaR : P.ua;
      const fa = P.faR !== undefined ? ua + P.faR : P.fa;
      J.el = pt(J.sh, ua, SEG.ua * (P.uaS || 1)); J.wr = pt(J.el, fa, SEG.fa);
    }
    return J;
  }
  function drawSide(E, P, C){
    const J = sideJoints(E, P), H = new Set(E.hl || []);
    let s = '';
    if(E.props) s += E.props(J, P, C, { ln, circ, pt });
    const body = C.body, hl = C.hl;
    s += ln(J.ankle, J.toe, W.foot, body) + ln(J.ankle, J.knee, W.sh, body) + ln(J.knee, J.hip, W.th, body) + ln(J.hip, J.sh, W.torso, body);
    if(H.has('calves')) s += band(J.knee, J.ankle, W.sh, -1, false, .15, .55, hl);
    if(H.has('quads')) s += band(J.hip, J.knee, W.th, 1, false, .15, .85, hl);
    if(H.has('hams')) s += band(J.hip, J.knee, W.th, -1, false, .15, .85, hl);
    if(H.has('glutes')) { const g = band(J.hip, J.sh, W.torso, -1, true, 0, .12, hl); s += g; }
    if(H.has('abs')) s += band(J.hip, J.sh, W.torso, 1, true, .2, .55, hl);
    if(H.has('chest')) s += band(J.hip, J.sh, W.torso, 1, true, .66, .9, hl);
    if(H.has('back')) s += band(J.hip, J.sh, W.torso, -1, true, .45, .9, hl);
    if(H.has('shoulders')) s += circ(J.sh, 8, hl);
    if(H.has('rear')) { const d = [J.sh[0]-J.hip[0], J.sh[1]-J.hip[1]], L = Math.hypot(...d); s += circ([J.sh[0] + d[1]/L*7, J.sh[1] - d[0]/L*7], 7, hl); }
    s += circ(J.head, SEG.head, C.bg, ` stroke="${body}" stroke-width="5"`);

    if(H.has('biceps')) s += band(J.sh, J.el, W.ua, 1, false, .2, .8, hl);

    if(E.hand) s += E.hand(J, P, C, { ln, circ, pt });
    return s;
  }

  // front view
  function drawFront(E, P, C){
    const H = new Set(E.hl || []), body = C.body, hl = C.hl;
    const cx = 160, top = P.shY || 82, hipY = 150, seated = E.seated;

      let el, wr;

        el = [S[0] + m * SEG.ua * Math.cos(rad(A.hz)), S[1] + 4];

    };

    s += arm(sL, -1, P.left || P);

  function frame(name, k, C){
    const E = D[name]; if(!E) return '';
    const P = mix(E.a, E.b, k);
    if(P.left && E.a.left) P.left = mix(E.a.left, E.b.left || E.a.left, k);
    return E.front ? drawFront(E, P, C) : drawSide(E, P, C);
  }
  return { frame, has: n => !!D[n], names: Object.keys(D) };
})();

const ANIM_C = { body:'var(--fig-body)', arm:'var(--fig-arm)', hl:'var(--fat)', eq:'var(--fig-eq)', bg:'var(--tint)' };
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function animHtml(name, small){
  if(!AN.has(name)) return '';
  const svg = k => `<svg viewBox="0 0 320 240" aria-hidden="true">${AN.frame(name, k, ANIM_C)}</svg>`;
  return `<div class="anim${small ? ' sm' : ''}${REDUCED ? ' still' : ''}" data-ex="${esc(name)}" role="img" aria-label="Animation of ${esc(name)}">${REDUCED ? svg(0) + svg(1) : svg(0)}</div>`;
}
(function animLoop(){
  const T = 2800;
  function tick(now){
    if(!REDUCED) document.querySelectorAll('.anim:not(.still)').forEach(el => {
      const t = (now % T) / T, k = (1 - Math.cos(2 * Math.PI * t)) / 2;
      const svg = el.firstElementChild; if(svg) svg.innerHTML = AN.frame(el.dataset.ex, k, ANIM_C);
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

function workoutAction(a, b){
  const w = S.day.workout, i = +b.dataset.i, j = +b.dataset.j, ex = w.exercises[i];
  switch(a){
    case 'tick': {
      const s = ex.sets[j], info = exInfo(ex.name), sug = suggestFor(ex), t = setTarget(ex, j, sug);
      if(!s.done){
        if(s.w === '' && t.w !== '' && t.w !== undefined) s.w = String(r1(t.w));
        if(s.r === '' && t.r) s.r = String(t.r);
        if(s.r === '' || (s.w === '' && !noLoad(info.type))){ toast(`Enter the ${noLoad(info.type) ? '' : 'weight and '}${repWord(info.type)} first.`); return; }
        s.done = true; s.t = Date.now();
        { const nj = ex.sets.findIndex(x => !x.done), nx = S.day.workout.exercises.slice(i + 1).find(e => e.sets.some(x => !x.done));
          if(nj >= 0) startRest(ex.name, `Next: set ${nj + 1} of ${ex.name}`); else if(nx) startRest(ex.name, `Next: ${nx.name}`); }
      } else { s.done = false; s.rate = null; ex.form = null; }
      updateLift(ex); saveDay(); render(); return;
    }
    case 'rate': case 'rerate': {
      const s = (b.dataset.ramp ? ex.ramp : ex.sets)[j];
      s.rate = a === 'rate' ? b.dataset.v : null;
      if(b.dataset.ramp){
        const info = exInfo(ex.name);
        if(a === 'rate'){
          const wv = num(s.w), prior = ex.ramp.slice(0, j).reverse().find(x => x.done);
          if(s.rate === 'right') ex.found = wv;
          else if(s.rate === 'hard') ex.found = Math.max(0, easier(wv, info, 0)); // one step lighter
          else if(s.rate === 'fail') ex.found = prior ? num(prior.w) : Math.max(0, easier(wv, info, 0.1));
          else ex.found = null;
          if(s.rate === 'easy' && !ex.ramp.some((x, k) => k > j)) ex.ramp.push({ w:'', r:'', done:false });
        } else ex.found = null;
      } else updateLift(ex);

    }

      saveDay(); render(); return;
    }
    case 'form': ex.form = b.dataset.v || null; updateLift(ex); saveDay(); render(); return;
    case 'exset': openExSettings(i); return;
    case 'es-type': ES.v.type = b.dataset.v; ES.v.step = DEFAULT_STEP[ES.v.type]; renderExSettings(); return;
    case 'es-step': ES.v.step = num(b.dataset.v); renderExSettings(); return;
    case 'es-save': case 'es-reset': {

      }

    }
  }
}

const mondayOf = d => { const x = parseYmd(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return ymd(x); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const sessionDates = before => Object.keys(S.sessions.entries).filter(d => d < before && S.sessions.entries[d].n > 0).sort();
function lastSession(before){ const ds = sessionDates(before); if(!ds.length) return null; const d = ds[ds.length-1]; return { date:d, ...S.sessions.entries[d] }; }
const inRange = r => r && r.until >= S.date && (!r.from || r.from <= S.date);

function planned(date){
  const A = adjState();
  if(A.weekPlan && A.weekPlan.start === mondayOf(date)){
    const done = sessionDates(date).filter(d => d >= A.weekPlan.start).length;
    return A.weekPlan.list[done] || null;
  }
  if(parseYmd(date).getDay() === 0) return null;
  if(A.mode === 'sequence'){ const L = lastSession(date), PL = planList(); if(!PL.length) return null; const i = L ? PL.indexOf(L.t) : -1; return PL[(i + 1) % PL.length]; }
  return dayTemplate(date);
}
function missed(date){
  const A = adjState();
  if(A.mode === 'sequence' || (A.weekPlan && A.weekPlan.start === mondayOf(date))) return null;
  const L = lastSession(date); if(!L) return null;
  const gap = daysBetween(L.date, date); if(gap < 2 || gap > 6) return null;
  for(let i = 1; i < gap; i++){
    const d = addDays(L.date, i), t = dayTemplate(d);
    if(t && !(S.sessions.entries[d] && S.sessions.entries[d].n)) return { date:d, t };

function sessionScore(sets, type, bw){ // bw: profile weight, for assisted machines (0 = unknown)
  if(noLoad(type)) return sets.reduce((n, s) => n + s.r, 0);
  if(type === 'assisted') return Math.max(...sets.map(s => bw ? s.r * Math.max(0, bw - s.w) : s.r * 2 - s.w));
  return Math.max(...sets.map(s => s.w * (1 + s.r/30)));
}
function stalled(name){
  const h = (S.lifts[name] || {}).hist || [];
  if(h.length < 4) return false;
  const prior = Math.max(...h.slice(0, -3).map(x => x.e));
  return h.slice(-3).every(x => x.e <= prior * 1.01);
}

// adjust a session suggestion for today's modifiers
function applyMods(sug, ex){
  const m = S.day.workout.mods || {}; if(sug.w === undefined || sug.w === '') return sug;
  const info = exInfo(ex.name); if(noLoad(info.type)) return sug;
  const last = lastFor(ex.name); if(!last) return sug;
  const top = last.sets.reduce((a, s) => info.type === 'assisted' ? Math.min(a, s.w) : Math.max(a, s.w), last.sets[0].w);
  let w = sug.w, note = '';

  if(ret && ret.until >= S.date){ w = info.type === 'assisted' ? (bw ? snap(bw - 0.55*(bw - top), info.step || 1) : w + snap(w*0.45, info.step || 1)) : Math.max(0, snap(top*0.55, info.step || 1)); note = ' Coming back to this exercise: about 55% of your old weight for 2 weeks.'; }
  else if(ex.bridge){ w = info.type === 'assisted' ? top + info.step : Math.max(0, snap(top*0.85, info.step || 1)); note = ' Bridge set: lighter, after your new exercise.'; }

const ruleState = () => { const X = S.settings; X.excl = X.excl || []; X.repl = X.repl || {}; X.returning = X.returning || {}; X.ladderStay = X.ladderStay || {}; return X; };
function ruleMatches(r, name){

function candidates(name, o = {}){

    const prim = ct.m.filter(x => t.m.includes(x)); if(!prim.length) continue;

function homeName(n, where){

const SCOPE_RANK = { exercise:0, family:1, pattern:2, joint:3 }; // most specific rule first
// taken: names already in the session, left out of the candidates; null: return undefined where a candidate is needed
// A swap target or stored pick that ends on a name in taken is passed over: a swapped exercise that isn't excluded takes its
// best candidate, an excluded one goes on to its pick, then its best candidate. A swap whose bridge is still running is kept.
// Returns null for a skip the user chose, false when no candidate is left.
function resolveName(name, where, depth = 0, taken){
  const X = ruleState(); if(depth > 3) return name;
  const inSession = r => !!taken && !!r && taken.includes(r);
  const rp = X.repl[name], to = rp && rp.to ? homeName(rp.to, where) : null;
  let passed = false;
  if(to && !isExcluded(to)){
    const q = resolveName(to, where, depth + 1, taken);
    if(!inSession(q) || (rp.bridgeUntil && rp.bridgeUntil >= S.date && q === rp.to && !isExcluded(name))) return q;
    passed = true;
  }
  const rs = isExcluded(name) ? activeRules().filter(x => ruleMatches(x, name)) : [], r = rs[0];
  if(rs.length){
    const pr = rs.sort((a, b) => SCOPE_RANK[a.scope] - SCOPE_RANK[b.scope]).find(x => x.to && x.to[name] !== undefined), pick = pr ? pr.to[name] : undefined;
    if(pick === null) return null;
    const p = pick && homeName(pick, where);

  const c = candidates(name, { where, joint: r && r.scope === 'joint' ? r.key : null, pain: r && r.reason === 'pain', ignoreSession: true, taken });

}
// lost (optional array): names left out because no replacement outside the session was found: excluded names, and names

function resolveSession(names, where, lost){
  const X = ruleState(), out = [], seen = new Set();
  const bridged = (n, r) => { const rp = X.repl[n]; return rp && rp.bridgeUntil && rp.bridgeUntil >= S.date && r === rp.to && !isExcluded(n); };
  const first = names.map(n => resolveName(n, where, 0, null)), taken = [];
  // names the template holds as they are come first; then, slot by slot, a swap or pick already taken is passed over
  names.forEach((n, i) => { if(first[i] === n) taken.push(n); });

    case 'rule-back': { const r = X.excl.find(x => x.id === b.dataset.v); if(r){ r.done = true; Object.keys(S.lifts).filter(n => ruleMatches(r, n)).forEach(n => X.returning[n] = { until: addDays(S.date, 13) }); } saveSettings(); render(); toast('Welcome back to it. Start light.'); return; }
    case 'rule-later': { const r = X.excl.find(x => x.id === b.dataset.v); if(r) r.until = addDays(S.date, 14); saveSettings(); render(); return; }
    case 'rule-keep': { const r = X.excl.find(x => x.id === b.dataset.v); if(r) r.until = null; saveSettings(); render(); return; }
    case 'ladder-up': X.repl[name] = { to: b.dataset.v, bridgeUntil: addDays(S.date, 13), since: S.date }; done(); toast(`${b.dataset.v} starts next session`); return;
    case 'ladder-down': X.repl[name] = { to: b.dataset.v, since: S.date }; done(); toast(`Switched to ${b.dataset.v}`); return;
    case 'ladder-stay': X.ladderStay[name] = addDays(S.date, 42); done(); return;
    case 'swap-side': X.repl[name] = { to: b.dataset.v, since: S.date }; done(); toast(`Switched to ${b.dataset.v}`); return;
  }
}

async function shrinkImage(file, maxBytes){
  // a small preview for the sheet, and a downsized copy if the file is over the limit
  const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const i = new Image(); const t = setTimeout(() => rej(new Error('timeout')), 5000); i.onload = () => { clearTimeout(t); res(i); }; i.onerror = e => { clearTimeout(t); rej(e); }; i.src = url; });

  const thumb = draw(480, .7).toDataURL('image/jpeg', .7);
  let send = file;
  if(maxBytes && file.size > maxBytes) send = await new Promise(res => draw(1600, .85).toBlob(res, 'image/jpeg', .85));
  return { thumb, send };
}

const KCAL_PER_KG = 7700;
async function loadDays(end, n){

}
function weightSlope(end, span){

  if(e.length < 6) return { n:e.length };
  const xs = e.map(([d]) => daysBetween(addDays(end, -span), d)), ys = e.map(([, v]) => v);

  progression:{ t:'How the suggested weight is chosen', s:'Add reps first, then weight: the simplest reliable way to keep getting stronger.', ev:'Moderate',
    b:() => 'This is called double progression. Each exercise has a rep range, like 8–12. You stay at a weight until you can do the top of the range on every set with good form, then add the smallest step your equipment allows and start again near the bottom of the range. Muscles grow when they’re asked to do a little more over time (progressive overload). Steady small increases beat big jumps that break your form, which is why jumps over about 10% come with a fallback.',
    src:'General resistance-training principle; ACSM position stand on progression models, 2009' },
  rir:{ t:'Why rate how each set felt?', s:'Stopping with 1–3 reps left builds muscle about as well as going to failure, with less fatigue.', ev:'Moderate',
    b:() => '“Just right” means you could have done about 2–3 more reps. Research suggests sets taken close to failure, but not always all the way, build muscle about as well while being easier to recover from. Your ratings tell the app whether the weight is right: “Easy” means it can go up, “Couldn’t finish” means it should come down a little. Beginners tend to underestimate how many reps they have left, so the ratings become more accurate with practice.',
    src:'Zourdos et al., 2016 (reps-in-reserve scale)' },
  ramp:{ t:'Why ramp up to find your weight?', s:'Guessing a starting weight is how beginners get hurt or waste weeks lifting too light.', ev:'Moderate',
    b:() => 'Ramping starts light to rehearse the movement, then adds a step at a time until the target reps feel hard but doable. It doubles as a warm-up and as technique practice. Strength numbers vary hugely between people and between machines in different gyms, so a few minutes of ramping beats any formula for a first session.',
    src:'Common coaching practice; no single study' },
  overload:{ t:'Progressive overload', s:'Doing a little more over time is the main driver of results.', ev:'Strong',
    b:() => 'Your body adapts only to the work it’s asked to do. If you lift the same weight for the same reps forever, progress stops. Adding reps, weight or sets over weeks keeps the signal going. Training with lighter weights for more reps or heavier weights for fewer reps both build muscle when sets are taken close to failure, so the rep range matters less than steadily doing more.',
    src:'Schoenfeld et al., 2017, Journal of Strength and Conditioning Research (low vs high load)' },
  volume:{ t:'How many sets per muscle?', s:'Around 10 or more hard sets a week per muscle works well for most people.', ev:'Moderate',
    b:() => 'Studies comparing different numbers of weekly sets found more sets generally produce more muscle growth, up to a point, with around 10+ hard sets per muscle per week being a good target. Beginners grow on less, which is why plans start with a 2-week ramp. The coverage meter on the Targets tab shows your plan’s weekly sets per muscle.',
    src:'Schoenfeld, Ogborn & Krieger, 2017, Journal of Sports Sciences (dose-response meta-analysis)' },
  deload:{ t:'Why a recovery week?', s:'Fatigue can hide fitness. A lighter week lets it show again.', ev:'Emerging',
    b:() => 'When several lifts stall at once, accumulated fatigue is a common cause. A week with fewer sets and slightly lighter weights reduces that fatigue while keeping the skill and the habit. Coaches widely use these “deloads”, but research on exactly when and how is still limited, which is why the app suggests one only when the signs point to it.',
    src:'Bell et al., 2023 (expert consensus on deloading)' },
  stall:{ t:'Why change the rep range after a stall?', s:'A new rep range is a fresh stimulus without changing the exercise.', ev:'Moderate',
    b:() => 'Muscles grow across a wide range of reps when sets are hard enough. Moving from 8–12 to 6–8, or the other way, lets you progress again by a different route. Stalls during a calorie deficit are also normal; sleep and protein are worth checking first.',
    src:'Schoenfeld et al., 2017 (load and hypertrophy)' },
  ladder:{ t:'Why move up the ladder?', s:'Harder variations let you keep progressing once a simpler one stops challenging you.', ev:'Moderate',
    b:() => 'Machines and dumbbells are easier to learn and safer to bail out of, so they’re a good start. Once you’ve mastered one with solid form, a variation that demands more balance or lets you load more keeps progress going. The 2-week bridge keeps the old exercise in lightly so you don’t lose what you built. Staying on a step is always fine if it’s still working for you.',
    src:'Common coaching practice' },
  scale:{ t:'Why did the scale jump?', s:'Overnight jumps are water, not fat.', ev:'Moderate',
    b:() => 'Gaining 1 kg of fat takes eating roughly 7,700 kcal more than you burn, which is very hard to do in a day. Overnight jumps usually come from water: a salty or carb-heavy meal (each gram of stored carbohydrate holds about 3 g of water), hard training, poor sleep, or for women, the menstrual cycle. That’s why the app uses weekly averages, not single weigh-ins.',
    src:'Physiology textbooks; Hall, 2008 (energy content of weight change)' },
  spot:{ t:'Can I burn belly fat with ab exercises?', s:'No. Fat comes off the whole body, in an order set mostly by genetics.', ev:'Strong',
    b:() => 'A study that had people do abdominal exercises for 6 weeks found no extra loss of belly fat compared with people who didn’t. Fat loss comes from a calorie deficit; where it leaves first isn’t something you can choose. Ab training still strengthens your core, and belly fat does come down with overall fat loss. That’s why your plan relies on a deficit plus full-body training, and why your waist measurement is worth tracking.',
    src:'Vispute et al., 2011, Journal of Strength and Conditioning Research' },
  sleep:{ t:'Why a lighter session after poor sleep?', s:'Short sleep hurts training quality and makes a diet cost more muscle.', ev:'Moderate',
    b:() => 'In one controlled study, people dieting on 5.5 hours of sleep lost noticeably more muscle and less fat than when they slept 8.5 hours on the same diet. A single bad night mainly reduces strength and focus, so keeping the session but dropping a set and holding the weights is a good trade. A few nights in a row matter more than one.',
    src:'Nedeltcheva et al., 2010, Annals of Internal Medicine' },
  soreness:{ t:'Is soreness a sign of a good workout?', s:'No. Soreness mostly means the work was new, not that it was effective.', ev:'Moderate',
    b:() => 'Muscle soreness is highest after new exercises or a long break, and fades as you adapt, even while you keep growing. Chasing soreness leads to too much fatigue. Better signs of progress: more reps or weight over weeks, and your measurements.',
    src:'Schoenfeld & Contreras, 2013, Strength and Conditioning Journal' },
  formfirst:{ t:'Why form comes before weight', s:'Good form keeps the work on the right muscles and keeps you training without injuries.', ev:'Moderate',
    b:() => 'In the first weeks, much of your strength gain comes from your nervous system learning the movement, not from new muscle. That’s the best time to groove good technique with manageable weights. The app holds weight increases for the first 2 weeks on an exercise and when you report your form slipping, so the habit sticks.',
    src:'General motor-learning and strength research' },
  bulky:{ t:'Will lifting make women bulky?', s:'No. Building noticeable muscle takes years of deliberate effort for anyone.', ev:'Moderate',
    b:() => 'Women gain muscle at a similar relative rate to men when training, but from a smaller starting point and with lower testosterone, so absolute size gains are smaller. What most people see is a firmer, more defined shape, especially alongside fat loss. Strength training also supports bone density.',
    src:'Roberts et al., 2020, Journal of Strength and Conditioning Research (sex differences review)' },
  adaptive:{ t:'How your real burn is calculated', s:'Your food log plus your weight trend reveal your actual burn.', ev:'Moderate',
    b:() => 'If you eat an average of 2,000 kcal a day and your weight trend drops 0.5 kg a week, you’re burning about 2,000 + (0.5 × 7,700 ÷ 7) ≈ 2,550 kcal a day. The 7,700 kcal per kg figure is an approximation, and logging is never perfect, so the estimate is smoothed week to week and only suggests a change when the difference is 100+ kcal.',
    src:'Hall, 2008 (energy density of weight change)' },
  split:{ t:'How your sessions are built', s:'Your split follows your available days; big lifts come first and every muscle gets roughly even weekly work.', ev:'Moderate',
    b:() => { const p = S.settings.profile, sp = splitFor(), names = { 2:'two full-body sessions', 3:'three full-body sessions', 4:'an upper/lower split', 5:'a push/pull/legs plus upper/lower hybrid', 6:'push/pull/legs twice' }[sp.list.length];
      return `You train ${sp.list.length} days a week, so your plan uses ${names}, which trains each muscle about twice a week; that works at least as well as once. Sessions are trimmed to fit ${p && p.minutes ? `about ${p.minutes} minutes` : 'your time'}, keeping the big compound lifts first while you’re fresh and smaller exercises after. One exercise does each job, so you won’t see two curl variations back to back. Across the week the plan aims for roughly 10 hard sets per muscle${p && p.exp === 'new' ? ', starting with 2 sets per exercise for your first 2 weeks while you learn the movements' : ''}.`; },
    src:'Schoenfeld, Ogborn & Krieger, 2016 and 2017 (training frequency and volume meta-analyses)' },
  workoutburn:{ t:'How workout calories are estimated', s:'Lifting burns less than most people think, and trackers usually overestimate.', ev:'Moderate',
    b:() => 'The app times your session from your first to your last ticked set and uses a standard value for weight training of about 5 METs including rest between sets (1 MET is roughly what you burn sitting still). An hour of lifting at 80 kg works out to around 350–400 kcal in total, of which roughly 300 is extra over resting. Studies of fitness trackers have found calorie estimates often off by 20% or more, so treat any workout number as rough. Your calorie target already counts your usual training, which is why the app doesn’t add workout calories back to your food budget.',
    src:'Ainsworth et al., Compendium of Physical Activities (MET values)' },
  creatine:{ t:'Is creatine worth taking?', s:'It’s the best-researched supplement for strength and muscle.', ev:'Strong',
    b:() => 'Creatine monohydrate, typically 3–5 g a day, helps you do slightly more work in each session, which adds up over months. It’s cheap and well studied in healthy adults. It can slightly raise creatinine on blood tests, so tell your doctor if you take it. If you have kidney problems, ask your doctor first. Protein powder is optional; it’s just convenient food.',
    src:'Kreider et al., 2017, International Society of Sports Nutrition position stand' },
};

${cards}

The person was reading: "${KB[WHY.id].t}".
Question: ${q}`, { modelTier:'quick' });

function combosFast(info){
  const K = Math.max(info.kcal, 150), P = Math.max(info.p, 8), out = [];
  const mk = items => { const t = items.reduce((a, [f, q]) => ({ kcal:a.kcal + f[2]*q, p:a.p + f[3]*q }), { kcal:0, p:0 });
    return { items, ...t, score: 3*Math.max(0, P - t.p)/P + Math.abs(t.kcal - K)/K + 2*Math.max(0, t.kcal - K*1.1)/K }; };
  const prot = [['Paneer',[1,1.5]],['Greek yogurt, plain',[1,2]],['Curd / dahi',[1,2]],['Toned milk',[1,1.5]],['Peanuts, roasted',[1]]];
  const carbs = info.meal === 'Snacks' ? [['Makhana, roasted',[1,2]],['Fruit bowl',[1]]] : info.meal === 'Breakfast' ? [['Fruit bowl',[1]],['Sweet potato, boiled',[1,1.5]],['Sabudana khichdi',[0.5]]] : [['Kuttu atta roti',[1,2,3]],['Sabudana khichdi',[0.5,1]],['Sweet potato, boiled',[1,1.5,2]]];
  prot.forEach(([pn, pqs]) => carbs.forEach(([cn, cqs]) => pqs.forEach(pq => cqs.forEach(cq => {
    const items = [[F(pn), pq], [F(cn), cq]]; if(info.meal === 'Lunch' || info.meal === 'Dinner') items.push([F('Buttermilk (chaas)'), 1]); out.push(mk(items));
  }))));
  const seen = new Set();
  return out.sort((a, b) => a.score - b.score).filter(c => { const k = c.items[0][0][0] + c.items[1][0][0]; if(seen.has(k)) return false; seen.add(k); return true; });
}

function kcalTarget(date){ if(labHoldOn() && S.settings.profile) return Math.max(S.settings.kcal, Math.round(calcTargets(S.settings.profile).tdee/10)*10); return S.settings.kcal + ((S.settings.flex || []).filter(x => x.date === date).reduce((a, x) => a + x.d, 0)); }
function planFlex(extra){
  const floor = S.settings.profile ? calcTargets(S.settings.profile).floor : 1200, id = newId(), f10 = x => Math.floor(x/10)*10;
  S.settings.flex = (S.settings.flex || []).filter(x => x.date >= addDays(TODAY(), -7));
  const days = [1, 2, 3, 4, 5, 6].map(i => addDays(S.date, i));
  const room = days.map(d => { const flexed = S.settings.kcal + S.settings.flex.filter(x => x.date === d).reduce((a, x) => a + x.d, 0); return Math.max(0, f10(Math.min(kcalTarget(d), flexed) - floor)); });
  let spread = 3, cuts = null, left = 0;
  for(; spread <= 6 && !cuts; spread++){ const per = f10(extra/spread); if(room.slice(0, spread).every(r => r >= per)) cuts = room.slice(0, spread).map(() => per); }
  spread--;
  if(!cuts){ const top = Math.max(...room), fill = l => room.reduce((a, r) => a + Math.min(r, l), 0); let lvl = 0; while(lvl < top && fill(lvl + 10) <= extra) lvl += 10; cuts = room.map(r => Math.min(r, lvl)); left = Math.max(0, extra - fill(top)); }
  const per = Math.max(...cuts), even = cuts.every(c => c === per);
  S.settings.flex.push({ id, date:S.date, d:extra });
  cuts.forEach((c, i) => { if(c > 0) S.settings.flex.push({ id, date:days[i], d:-c }); });
  saveSoon('settings', S.settings);
  toast(`Today +${extra} kcal${per > 0 ? `; the next ${spread} days ${even ? '' : 'up to '}${per} lower` : ''}${left ? `; ${left} kcal could not be spread without going below your minimum` : ''}`);
}
function flexPlanFor(date){ const p = (S.settings.flex || []).filter(x => x.date === date && x.d > 0); return p.length ? p[p.length - 1] : null; }
function undoFlex(id){
  const floor = S.settings.profile ? calcTargets(S.settings.profile).floor : 1200, c10 = x => Math.ceil(x/10)*10, all = S.settings.flex || [], trim = {};
  S.settings.flex = all.filter(x => x.id !== id);
  all.filter(x => x.id === id).forEach(({ date:d }) => { const flexed = S.settings.kcal + S.settings.flex.filter(x => x.date === d).reduce((a, x) => a + x.d, 0); trim[d] = Math.max(0, c10(floor - Math.min(kcalTarget(d), flexed))); });
  S.settings.flex = S.settings.flex.reduceRight((out, x) => { const t = x.d < 0 ? Math.min(trim[x.date] || 0, -x.d) : 0; if(t) trim[x.date] -= t; if(!t || t < -x.d) out.unshift(t ? { ...x, d:x.d + t } : x); return out; }, []);
}
function flexNoteHtml(){
  const f = (S.settings.flex || []).filter(x => x.date === S.date); if(!f.length) return '';
  const p = flexPlanFor(S.date), d = f.reduce((a, x) => a + x.d, 0);
  return `<p class="note">${p ? `Today’s target includes +${p.d} kcal for a bigger meal, balanced over the next few days. <button class="linkbtn inl" data-act="flex-undo" data-v="${p.id}">Undo</button>` : `Today’s target is ${-d} kcal lower to balance an earlier bigger day.`}</p>`;
}

const FC = { i:null, frames:[], busy:false, res:null, err:'' };
async function videoFrames(file, n){
  const tryLoad = src => new Promise((res, rej) => { const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto';
    const t = setTimeout(() => rej(new Error('timeout')), 15000); v.onloadedmetadata = () => { clearTimeout(t); res(v); }; v.onerror = () => { clearTimeout(t); rej(new Error('load')); }; v.src = src; });
  let v;
  try{ v = await tryLoad(URL.createObjectURL(file)); }
  catch(e){ const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); v = await tryLoad(url); }
  const dur = v.duration && isFinite(v.duration) ? v.duration : 5, out = [];
  for(let k = 0; k < n; k++){
    const at = dur * (0.12 + 0.76 * k / Math.max(1, n - 1));
    await new Promise((res, rej) => { const t = setTimeout(() => rej(new Error('seek')), 8000); v.onseeked = () => { clearTimeout(t); res(); }; v.currentTime = at; });
    const sc = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth*sc); c.height = Math.round(v.videoHeight*sc); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    out.push({ url: c.toDataURL('image/jpeg', 0.75), blob: await new Promise(r => c.toBlob(r, 'image/jpeg', 0.75)) });
  }
  return out;
}

const CYC_KEY = 'pb-cycle';
function cycData(){ try{ return JSON.parse(localStorage.getItem(CYC_KEY) || 'null') || { on:false, starts:[], len:28 }; }catch(e){ return S.ui.cyc || { on:false, starts:[], len:28 }; } }
function cycSave(d){ S.ui.cyc = d; try{ localStorage.setItem(CYC_KEY, JSON.stringify(d)); }catch(e){} }
function cycInfo(date){
  const d = cycData(); if(!d.on || !d.starts.length) return null;
  const starts = d.starts.filter(x => x <= date).sort(); if(!starts.length) return null;
  const last = starts[starts.length-1], gaps = d.starts.slice().sort().map((x, i, a) => i ? daysBetween(a[i-1], x) : null).filter(x => x && x >= 18 && x <= 45);
  const len = gaps.length ? Math.round(gaps.slice(-3).reduce((a, b) => a + b, 0) / Math.min(3, gaps.length)) : d.len;
  const day = daysBetween(last, date) + 1;
  const phase = day <= 5 ? 'period' : day < len - 16 ? 'follicular' : day <= len - 12 ? 'around ovulation' : 'luteal (before your period)';
  return { day, len, phase, last, late: day > len + 7 };
}

  const d = cycData(), p = S.settings.profile;
  if(!d.on) return (p && p.sex === 'female') ? `<section class="block"><h2>Cycle log</h2><p class="hint">Optional. Water retention around your period can move the scale by a kilo or more; tracking it lets the app compare like with like. Kept only on this device.</p><div><button class="ghost sm" data-act="cyc-on">Turn on</button></div></section>` : '';
  const c = cycInfo(S.date);
  let same = '';
  if(c){ const prevDay = addDays(c.last, -c.len + c.day - 1), w = (S.weights.entries || {})[prevDay]; if(w) same = `<p class="hint">Same day last cycle (${shortDate(prevDay)}): ${r1(w)} kg.</p>`; }
  return `<section class="block"><h2>Cycle log</h2>

const MARKERS = [
  [/vit(amin)?\s*d|25.?oh/i,'Vitamin D', { low:'Low vitamin D is common in India. Sunlight on arms and face for 15–20 minutes most days, and foods like eggs, fortified milk and fish help. Discuss whether to supplement, and how much, with your doctor.' }],

  [/ferritin|serum iron|^iron/i,'Iron / ferritin', { low:'Iron-rich foods (dal, rajma, chana, spinach, eggs, meat) with vitamin C (lemon, amla) improve absorption; tea and coffee with meals reduce it. Low iron can make training feel harder. Your doctor can check why it’s low.' }],
  [/ha?emoglobin|^hb\b/i,'Haemoglobin', { low:'Low haemoglobin can cause tiredness and poorer training. Your doctor should look at the cause before any change.' }],
  [/ldl/i,'LDL cholesterol', { high:'More fibre (oats, dal, vegetables), fewer fried foods and less saturated fat (ghee, butter, cream) help, as does regular exercise and fat loss. Your doctor will judge the overall risk.' }],
  [/hdl/i,'HDL cholesterol', { low:'Regular exercise, fat loss and not smoking tend to raise HDL.' }],
  [/triglycer/i,'Triglycerides', { high:'Cutting sugar, sweet drinks, refined carbs and alcohol, plus fat loss and exercise, usually bring triglycerides down.' }],
  [/hba1c|glycated/i,'HbA1c', { high:'Higher-fibre carbs, fewer sweets and sugary drinks, regular training and fat loss help blood sugar. Please see your doctor about this result.' }],
  [/glucose|fbs|blood sugar/i,'Fasting glucose', { high:'Higher-fibre carbs, fewer sweets and sugary drinks, regular training and fat loss help blood sugar. Please see your doctor about this result.' }],
  [/tsh/i,'TSH (thyroid)', { high:'Thyroid levels can slow weight loss and affect energy. Please see your doctor.', low:'Please see your doctor about this thyroid result.' }],
  [/creatinine/i,'Creatinine', { high:'Creatine supplements and hard training can raise creatinine a little. Tell your doctor if you take creatine, and let them interpret it.' }],
  [/sgpt|alt\b|alanine/i,'ALT (liver)', { high:'Fat loss, less alcohol and fewer sugary foods often help liver enzymes. Hard training the day before a test can raise them too. Please discuss with your doctor.' }],
  [/sgot|ast\b|aspartate/i,'AST (liver)', { high:'Hard training in the days before a test can raise AST. Please discuss with your doctor.' }],
  [/uric/i,'Uric acid', { high:'Fewer sugary drinks and less alcohol and red meat can help. Please discuss with your doctor.' }],
];
function markerOf(name){ const m = MARKERS.find(([re]) => re.test(name)); return m ? { key:m[1], tips:m[2] } : null; }
// results that should go to a doctor soon, by marker; anything else only if far outside the range
const RED = { 'HbA1c':v => v >= 9, 'Fasting glucose':v => v >= 200 || v < 55, 'Haemoglobin':v => v < 8, 'TSH (thyroid)':v => v > 10 || v < 0.1,
  'Creatinine':(v, lo, hi) => hi != null && v > hi*2, 'ALT (liver)':(v, lo, hi) => hi != null && v > hi*3, 'AST (liver)':(v, lo, hi) => hi != null && v > hi*3,
  'Vitamin D':() => false, 'Vitamin B12':() => false, 'Iron / ferritin':() => false, 'HDL cholesterol':() => false, 'LDL cholesterol':v => v >= 190, 'Triglycerides':v => v >= 500, 'Uric acid':(v, lo, hi) => hi != null && v > hi*1.5 };
function labFlag(t){
  const v = num(t.value), lo = t.low === '' || t.low == null ? null : num(t.low), hi = t.high === '' || t.high == null ? null : num(t.high);
  const m = markerOf(t.name), rule = m && RED[m.key];
  const red = rule ? rule(v, lo, hi) : ((hi != null && v > hi*2) || (lo != null && v < lo*0.5));
  if(red && ((hi != null && v > hi) || (lo != null && v < lo) || rule)) return 'red';
  if(hi != null && v > hi) return 'high';
  if(lo != null && v < lo) return 'low';

async function loadPdfJs(){
  if(PDFJS) return PDFJS;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });

  return (PDFJS = window.pdfjsLib);
}
async function reportImages(file){
  if(file.type !== 'application/pdf') return [file];
  const lib = await loadPdfJs(), doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise, out = [];
  const max = Math.min(doc.numPages, (SAMPLE_IMG && SAMPLE_IMG.maxCount) || 3, 4);
  for(let i = 1; i <= max; i++){
    const pg = await doc.getPage(i), vp = pg.getViewport({ scale: 1.6 }), c = document.createElement('canvas');
    c.width = vp.width; c.height = vp.height; await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;

  }
  return out;
}
