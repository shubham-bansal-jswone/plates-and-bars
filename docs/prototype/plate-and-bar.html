const MAP_FRONT = { chest:['CHEST'], 'front-delt':['FRONT_DELTOIDS'], 'side-delt':['FRONT_DELTOIDS'], biceps:['BICEPS'], triceps:['TRICEPS'], forearms:['FOREARM'], abs:['ABS','OBLIQUES'], quads:['QUADRICEPS'], calves:['CALVES'] };
const MAP_BACK = { 'upper-back':['TRAPEZIUS'], lats:['UPPER_BACK'], 'rear-delt':['BACK_DELTOIDS'], 'side-delt':['BACK_DELTOIDS'], triceps:['TRICEPS'], forearms:['FOREARM'], 'lower-back':['LOWER_BACK'], glutes:['GLUTEAL','ABDUCTOR'], hams:['HAMSTRING'], calves:['CALVES','LEFT_SOLEUS','RIGHT_SOLEUS'] };
function bodyMapSvg(prim, sec, cls = ''){
  const fig = (view, map, dx, label) => {
    const state = {};
    Object.entries(map).forEach(([m, regs]) => regs.forEach(r => { const v = prim.has(m) ? 2 : sec.has(m) ? 1 : 0; state[r] = Math.max(state[r] || 0, v); }));
    return `<g transform="translate(${dx} 0)">${RBH[view].map(([r, pts]) => { const v = state[r] || 0, fill = v === 2 ? 'var(--fat)' : v === 1 ? 'var(--carbs)' : 'var(--line)';
      return pts.map(pt => `<polygon points="${pt}" fill="${fill}"/>`).join(''); }).join('')}<text x="50" y="216" text-anchor="middle" font-size="9" fill="var(--muted)">${label}</text></g>`;
  };
  return `<svg class="bodymap ${cls}" viewBox="0 0 210 222" role="img" aria-label="Muscles worked: ${[...prim].map(m => MUSCLE[m]).join(', ') || 'none'}">${fig('front', MAP_FRONT, 0, 'Front')}${fig('back', MAP_BACK, 110, 'Back')}</svg>`;
}
function musclesOf(names){
  const p = {}, s = {};
  names.forEach(n => { const t = TAGS[n]; if(!t) return; t.m.forEach(m => p[m] = (p[m] || 0) + 1); t.s.forEach(m => s[m] = (s[m] || 0) + 1); });
  const prim = new Set(Object.keys(p)), sec = new Set(Object.keys(s).filter(m => !prim.has(m)));
  return { prim, sec, p };
}
const mList = set => [...set].map(m => MUSCLE[m]);
function legendHtml(){ return `<div class="bm-leg"><span><i style="background:var(--fat)"></i>Main focus</span><span><i style="background:var(--carbs)"></i>Also working</span></div>`; }
function sessionPreviewHtml(t){
  const lost = [], all = sessionItems(t, whereNow(), lost), kept = applyFocus(trimSession(all, t), t, whereNow());
  const ci = S.day.workout.checkin || {}, short = ci.time && ci.time !== 'usual';
  const items = short ? kept.filter(x => !x.bridge).slice(0, ci.time === '30' ? 3 : 4) : kept, names = items.map(x => x.name);
  const left = all.filter(x => !names.includes(x.name)).map(x => x.name);
  const p = S.settings.profile, sets = p && p.exp === 'new' && p.created && daysBetween(p.created, S.date) < 14 ? 2 : 3;
  const { prim, sec } = musclesOf(names);
  return `<div class="preview"><div class="pv-map">${bodyMapSvg(prim, sec)}${legendHtml()}</div>
    <div class="pv-txt"><p><b>Main focus:</b> ${esc(listJoin(mList(prim)))}</p>${sec.size ? `<p class="hint">Also working: ${esc(listJoin(mList(sec)))}</p>` : ''}
    <ol class="pv-list">${names.map(n => { const tg = TAGS[n]; return `<li><b>${esc(n)}</b>${tg ? `<span class="hint"> ${esc(listJoin(tg.m.map(m => MUSCLE[m])))}</span>` : ''}</li>`; }).join('')}</ol>
    <p class="hint">${names.length} exercises, ${sets} sets each${sets === 2 ? ' for your first 2 weeks' : ''}${names.some(isFocus) ? ', plus 1 on focus muscles' : ''}, sized to your ${p && p.minutes ? p.minutes : 60}-minute sessions.${left.length ? ` ${esc(listJoin(left))} rotate in on other ${esc(t)} days.` : ''}</p>
    ${lost.map(n => { const tg = TAGS[n]; return `<p class="hint">${esc(n)} is left out with no replacement${tg ? `, so your ${esc(listJoin(tg.m.map(m => MUSCLE[m])))} get fewer sets each week` : ''}.</p>`; }).join('')}
    <div><button class="primary" data-act="tpl" data-t="${esc(t)}">Start ${esc(t)}</button></div></div></div>`;
}
function sessionMapHtml(){
  const names = S.day.workout.exercises.map(e => e.name), { prim, sec } = musclesOf(names);
  if(!prim.size) return '';
  return `<details class="why sess-map"${S.ui.mapOpen || !S.day.workout.exercises.some(e => e.sets.some(x => x.done)) ? ' open' : ''}><summary>Muscles today: ${esc(listJoin(mList(prim)))}</summary><div class="pv-map">${bodyMapSvg(prim, sec)}${legendHtml()}</div></details>`;
}
function exMusclesLine(name){ const t = TAGS[name]; if(!t) return ''; return `<p class="ex-mus">${isFocus(name) ? '<span class="ev">Focus</span> ' : ''}<b>Works:</b> ${esc(listJoin(t.m.map(m => MUSCLE[m])))}${t.s.length ? `<span class="hint">, plus ${esc(listJoin(t.s.map(m => MUSCLE[m])))}</span>` : ''}</p>`; }
function exMapHtml(name, cls){ const t = TAGS[name]; if(!t) return ''; return `<div class="pv-map ${cls || ''}">${bodyMapSvg(new Set(t.m), new Set(t.s))}${legendHtml()}</div>`; }

/* ---------- plan engine: split from training days, length and experience ---------- */
const SPLITS = {
  2:{ list:['Full body A','Full body B'], days:[1,4] },
  3:{ list:['Full body A','Full body B','Full body C'], days:[1,3,5] },
  4:{ list:['Upper A','Lower A','Upper B','Lower B'], days:[1,2,4,5] },
  5:{ list:['Push A','Pull A','Legs A','Upper B','Lower B'], days:[1,2,3,5,6] },
  6:{ list:ORDER, days:[1,2,3,4,5,6] },
};
function splitFor(){
  const p = S.settings.profile;
  if(p && p.days === 0) return { list:[], days:[] }; // no regular training yet: no plan, sessions picked by hand
  const d = p && p.days ? Math.min(6, Math.max(2, p.days)) : 6;
  return SPLITS[d];
}
const planList = () => splitFor().list;
function dayTemplate(date){
  const sp = splitFor(), dow = parseYmd(date).getDay(), i = sp.days.indexOf(dow);
  return i >= 0 ? sp.list[i] : null;
}
const nextInList = t => { const L = planList(); if(!L.length) return null; const i = L.indexOf(t); return L[(i + 1) % L.length]; };
function exerciseCap(){ const p = S.settings.profile, m = p && p.minutes ? p.minutes : 60; return m <= 30 ? 3 : m <= 45 ? 4 : m <= 60 ? 5 : m <= 75 ? 6 : 7; }
function setsFor(name, base){
  const p = S.settings.profile, t = TAGS[name];
  let n = base;
  if(p && p.exp === 'new' && p.created && daysBetween(p.created, S.date) < 14) n = 2;   // beginner ramp: 2 sets for the first 2 weeks
  else if(t && t.p === 'calf') n = Math.max(n, 4);                                      // calves get a 4th set to reach ~10 weekly sets
  return n;
}

/* ---------- rest between sets ---------- */
const COMPOUND = new Set(['h-press','v-press','squat','lunge','hinge','h-pull','v-pull','hip-ext','dip']);
function restFor(name){ const t = TAGS[name]; return t && COMPOUND.has(t.p) ? 150 : 75; }
const restLabel = name => restFor(name) >= 150 ? '2–3 min' : '60–90 sec';
let REST = { end:0, total:0, label:'', timer:null };
function startRest(name, nextLabel){
  if(S.settings.restOff) return;
  clearInterval(REST.timer);
  const sec = restFor(name); REST = { end: Date.now() + sec*1000, total: sec, label: nextLabel, timer: setInterval(tickRest, 500) };
  tickRest();
}
function tickRest(){
  const el = $('#restbar'); if(!el) return;
  const left = Math.max(0, Math.round((REST.end - Date.now())/1000));
  if(!REST.end){ el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<div class="rb-in"><div><b>${left ? `Rest ${Math.floor(left/60)}:${String(left % 60).padStart(2, '0')}` : 'Rest done, go!'}</b><span>${esc(REST.label)}</span></div>
    <div class="rb-btns"><button class="ghost sm" data-act="rest-add">+30 s</button><button class="ghost sm" data-act="rest-skip">${left ? 'Skip' : 'Close'}</button></div></div><div class="rb-bar"><i style="width:${Math.min(100, (1 - left/REST.total)*100)}%"></i></div>`;
  if(!left && !REST.buzzed){ REST.buzzed = true; try{ navigator.vibrate && navigator.vibrate([250,120,250]); }catch(e){} }
}
function stopRest(){ clearInterval(REST.timer); REST = { end:0, total:0, label:'', timer:null }; tickRest(); }

/* ---------- warm-up sets ---------- */
function warmupHtml(ex, i, sug){
  const info = exInfo(ex.name), t = TAGS[ex.name];
  if(noLoad(info.type) || info.type === 'assisted' || !t || !COMPOUND.has(t.p) || ex.sets.some(s => s.done)) return '';
  const firstCompound = S.day.workout.exercises.findIndex(e => TAGS[e.name] && COMPOUND.has(TAGS[e.name].p));
  if(firstCompound !== i || !(sug.w > 0)) return '';
  const w1 = Math.max(0, snap(sug.w*0.5, info.step || 2.5)), w2 = Math.max(0, snap(sug.w*0.75, info.step || 2.5));
  return `<p class="hint warm"><b>Warm up first:</b> 8 reps at ${kgLabel(w1, info)}, then 4 at ${kgLabel(w2, info)}. Not logged. ${whyLink('warmup')}</p>`;
}

function fibOf(m){
  if(FIB[m.name]) return FIB[m.name];
  const my = (S.settings.myFoods || []).find(x => x.name === m.name);
  return my && my.fib !== undefined ? [my.fib, my.sug || 0] : null;
}
function produceOf(m){ const my = (S.settings.myFoods || []).find(x => x.name === m.name); return PRODUCE[m.name] || (my && my.veg) || 0; }
function fibreTotals(meals){
  let fib = 0, sug = 0, known = 0, veg = 0;
  meals.forEach(m => { const f = fibOf(m); if(f){ fib += f[0]*m.qty; sug += f[1]*m.qty; known++; } veg += produceOf(m)*m.qty; });
  return { fib, sug, veg, unknown: meals.length - known };
}

function dayComplete(d, date){

  if(d.complete === false) return false;

  const t = totals(d.meals); return d.meals.length >= 3 && t.kcal >= S.settings.kcal*0.75; // older days: only fairly full logs count

/* ---------- steps target ---------- */
async function stepsTarget(){
  const days = await loadDays(addDays(S.date, -1), 7), st = days.map(d => num(d.day.steps)).filter(x => x > 0);
  if(st.length < 3) return 7000;
  const avg = st.reduce((a, b) => a + b, 0)/st.length;
  return Math.min(12000, Math.max(5000, Math.round((avg + 1000)/500)*500));
}

function ktCalc(d){
  const t = { kcal:0, p:0, c:0, f:0, fib:0, oil:0, g:0 };
  d.rows.forEach(r => { const v = RAW[r.ing]; if(!v) return; const g = num(r.amt)*(UNIT_G[r.unit] || 1); t.g += g;
    t.kcal += v[0]*g/100; t.p += v[1]*g/100; t.c += v[2]*g/100; t.f += v[3]*g/100; t.fib += (RAW_FIB[r.ing] || 0)*g/100; if(FATTY.has(r.ing)) t.oil += g; });
  const potWeighed = isFinite(parseFloat(String(d.pot).replace(',', '.'))); // 0 g counts (a tared scale); blank does not
  const cooked = num(d.cooked) || (num(d.potFull) && potWeighed ? num(d.potFull) - num(d.pot) : 0), sv = num(d.serving);
  if(!cooked || cooked <= 0) return { t, ready:false };
  const k = 100/cooked, s = sv ? sv/cooked : 0;
  return { t, cooked, ready:true, per100:{ kcal:t.kcal*k, p:t.p*k, c:t.c*k, f:t.f*k, fib:t.fib*k }, perServ: sv ? { kcal:t.kcal*s, p:t.p*s, c:t.c*s, f:t.f*s, fib:t.fib*s, oil:t.oil*s, g:sv } : null, servings: sv ? cooked/sv : null };
}

/* ---------- 1. save on the device first, sync when back online ---------- */
const PEND = 'pb-pend:';
const pendGet = k => { try{ const v = localStorage.getItem(PEND + k); return v ? JSON.parse(v) : null; }catch(e){ return null; } };
const pendSet = (k, v) => { try{ localStorage.setItem(PEND + k, JSON.stringify(v)); }catch(e){} };
const pendDel = k => { try{ localStorage.removeItem(PEND + k); }catch(e){} };
const pendKeys = () => { try{ return Object.keys(localStorage).filter(k => k.startsWith(PEND)).map(k => k.slice(PEND.length)); }catch(e){ return []; } };
let OFFLINE_TOLD = false;
(function patchStore(){
  const origGet = Store.get.bind(Store);
  Store.get = async function(key){ if(this.mode === 'cloud'){ const p = pendGet(key); if(p) return JSON.parse(JSON.stringify(p)); } return origGet(key); };
  Store.set = function(key, obj){
    const data = JSON.parse(JSON.stringify(obj));
    mem[key] = data;
    if(this.mode !== 'cloud'){ try{ localStorage.setItem('pb:' + key, JSON.stringify(data)); }catch(e){} return Promise.resolve(); }
    pendSet(key, data);
    const prev = this.queues[key] || Promise.resolve();
    const p = prev.then(() => this.col.doc(key).set(data)).then(() => { const cur = pendGet(key); if(cur && JSON.stringify(cur) === JSON.stringify(data)) pendDel(key); syncBadge(); })
      .catch(e => {
        if(e && e.code === 'quota_exceeded') toast('Storage is full. Remove old entries to keep saving.');
        else if(!OFFLINE_TOLD){ OFFLINE_TOLD = true; toast('Saved on this device. It will sync when you’re back online.'); }
        syncBadge();
      });
    this.queues[key] = p; return p;
  };
})();
async function syncPending(){
  if(Store.mode !== 'cloud') return;
  for(const k of pendKeys()){ const v = pendGet(k); if(!v) continue; try{ await Store.col.doc(k).set(v); const cur = pendGet(k); if(cur && JSON.stringify(cur) === JSON.stringify(v)) pendDel(k); }catch(e){ break; } }
  if(!pendKeys().length && OFFLINE_TOLD){ OFFLINE_TOLD = false; toast('All changes synced'); }
  syncBadge();
}
function syncBadge(){ const b = $('#syncb'); if(b) b.hidden = !(Store.mode === 'cloud' && pendKeys().length); }
addEventListener('online', syncPending);
setInterval(syncPending, 30000);

/* ---------- 9. rotate which extras a short session keeps ---------- */
function trimSession(items, t){
  const cap = exerciseCap(), main = items.filter(x => !x.bridge);
  if(main.length <= cap) return items;
  const keep = Math.min(2, cap), head = main.slice(0, keep), rest = main.slice(keep), slots = cap - keep;
  const n = Object.values(S.sessions.entries).filter(e => e.t === t).length, off = rest.length ? (n * slots) % rest.length : 0;
  const pick = Array.from({ length: slots }, (_, i) => rest[(off + i) % rest.length]);
  const chosen = new Set([...head, ...pick].map(x => x.name));
  return items.filter(x => chosen.has(x.name) || (x.bridge && chosen.has((ruleState().repl[x.name] || {}).to)));
}

function latestWeight(upTo){
  const e = Object.entries(S.weights.entries || {}).filter(([d]) => !upTo || d <= upTo).sort((a,b) => a[0] < b[0] ? -1 : 1);
  return e.length ? e[e.length-1][1] : null;
}
const bmrOf = (p, w) => 10*w + 6.25*p.height - 5*p.age + (p.sex === 'male' ? 5 : -161);

function calcTargets(p){
  const w = num(p.weight), hM = p.height/100;
  const bmr = bmrOf(p, w), movement = bmr * ACTIVITY[p.activity].m;
  const training = num(p.days) * (num(p.minutes)/60) * TRAIN_NET_MET * w / 7;
  const base = bmr + movement + training, tdee = base / 0.9, digestion = tdee - base;
  const special = p.sex === 'female' && p.special && p.special !== 'none';
  let adj = p.goal === 'lose' ? PACE[p.pace || 'moderate'].adj : p.goal === 'recomp' ? -0.10 : p.goal === 'gain' ? 0.07 : 0;
  if(special && adj < 0) adj = 0;
  let kcal = tdee * (1 + adj), capped = false, floored = false;
  if(adj < 0 && tdee - kcal > 750){ kcal = tdee - 750; capped = true; }
  const floor = p.sex === 'male' ? 1500 : 1200;
  if(adj < 0 && kcal < floor){ kcal = Math.min(floor, tdee); floored = true; }
  kcal = Math.round(kcal/10)*10;
  const bmi = w/(hM*hM), refW = bmi > 30 ? Math.round(27*hM*hM) : w;
  const perKg = (p.goal === 'lose' || p.goal === 'recomp') && !special ? 2.0 : 1.8;
  const protein = Math.round(refW*perKg/5)*5;
  const fat = Math.max(Math.round(kcal*0.25/9), Math.round(0.6*w));
  const carbs = Math.max(0, Math.round((kcal - protein*4 - fat*9)/4));
  const weekly = (kcal - tdee) * 7 / 7700;
  return { w, bmr, movement, training, digestion, tdee, kcal, adj, capped, floor, floored, special, bmi, refW, perKg, protein, fat, carbs, weekly };
}

// rough workout burn: session time from first to last ticked set (or ~3 min per set), ~5 METs for lifting incl. rest, ~5 METs for moderate cardio
function workoutBurn(w, kg){
  const done = w.exercises.flatMap(e => e.sets.filter(x => x.done)), ts = done.map(x => x.t).filter(Boolean);
  let min = ts.length >= 2 ? (Math.max(...ts) - Math.min(...ts)) / 60000 + 3 : done.length * 3;
  min = Math.min(min, Math.max(done.length * 6, 10));
  const cardio = num(w.cardio), liftH = done.length ? min / 60 : 0;
  const gross = Math.round((5 * kg * liftH + 5 * kg * cardio / 60) / 5) * 5, extra = Math.round((4 * kg * liftH + 4 * kg * cardio / 60) / 5) * 5;
  return { sets: done.length, min: Math.round(min), cardio, gross, extra, timed: ts.length >= 2 };
}
function burnToday(){
  const p = S.settings.profile; if(!p) return null;
  const w = latestWeight(S.date) || p.weight;
  const bmr = bmrOf(p, w);
  const steps = Math.round(num(S.day.steps));
  const move = steps > 0 ? steps * 0.04 * w / 70 : bmr * ACTIVITY[p.activity].m;
  const wb = workoutBurn(S.day.workout, w), sets = wb.sets, cardio = wb.cardio, train = wb.extra;
  const dig = totals().kcal * 0.1;
  return { bmr, move, steps, sets, cardio, train, dig, total: bmr + move + train + dig };
}

function setupSummaryHtml(){
  const p = S.settings.profile;
  if(!p) return `<section class="block"><h2>Your setup</h2><p class="hint">Answer a few questions and the app works out your calorie burn and targets.</p><div><button class="primary" data-act="su-start">Start setup</button></div></section>`;
  const r = calcTargets(p), lw = latestWeight();
  const drift = lw && Math.round(Math.abs(lw - p.weight)*10)/10 >= 2; // the gap as shown, to 0.1 kg, so 64.1 vs 62.1 counts (#209)
  return `<section class="block"><h2>Your setup</h2>
    <p>${p.sex === 'male' ? 'Male' : 'Female'}, ${p.age}, ${heightText(p.height)}, ${r1(p.weight)} kg. ${ACTIVITY[p.activity].label}; ${p.days ? `${p.days} sessions a week of about ${p.minutes} min` : 'no regular training yet'}. Goal: ${GOALS[p.goal].label.toLowerCase()}.</p>
    <p class="hint">Estimated burn: about ${fmt(r.tdee)} kcal a day.</p>
    ${drift ? `<div class="note">Your latest weight is ${r1(lw)} kg, ${r1(Math.abs(lw - p.weight))} kg ${lw < p.weight ? 'lower' : 'higher'} than at setup. Recalculate your targets?<div class="row"><button class="primary" data-act="su-recalc">Recalculate</button></div></div>` : ''}
    <div><button class="ghost sm" data-act="su-start">Redo setup</button></div></section>`;
}
function heightText(cm){ const tin = cm/2.54; let ft = Math.floor(tin/12), inch = Math.round(tin - ft*12); if(inch === 12){ ft++; inch = 0; } return `${ft}′${inch}″`; }

/* setup flow state */
const SU = { step:0, p:null, v:{}, unit:'ft', err:'', from:'food' };
function startSetup(stepTo){
  const old = S.settings.profile, lw = latestWeight();
  SU.p = old ? { ...old } : { sex:'', age:'', height:0, weight:0, activity:'', days:null, minutes:null, goal:'', pace:'moderate', special:'none' };
  if(lw) SU.p.weight = lw;
  SU.v = { age: SU.p.age ? String(SU.p.age) : '', weight: SU.p.weight ? String(SU.p.weight) : '', cm: SU.p.height ? String(Math.round(SU.p.height)) : '' };
  if(SU.p.height){ const tin = SU.p.height/2.54; let ft = Math.floor(tin/12), inch = Math.round(tin - ft*12); if(inch === 12){ ft++; inch = 0; } SU.v.ft = String(ft); SU.v.inch = String(inch); }
  SU.step = stepTo || 0; SU.err = '';
  SU.from = S.tab === 'setup' ? 'food' : S.tab;
  S.tab = 'setup'; render(); scrollTo(0,0);
}
function opt(k, v, label, sub){
  return `<button class="opt" data-act="su-pick" data-k="${k}" data-v="${v}" aria-pressed="${String(SU.p[k]) === String(v)}">${label}${sub ? `<small>${sub}</small>` : ''}</button>`;
}
function chip(k, v, label){ return `<button class="chip" data-act="su-pick" data-k="${k}" data-v="${v}" aria-pressed="${String(SU.p[k]) === String(v)}">${label}</button>`; }

          : `<div class="hrow"><input data-su="cm" inputmode="numeric" value="${esc(SU.v.cm || '')}" placeholder="cm" aria-label="Height in cm"><button class="linkbtn" data-act="su-unit">Use feet and inches</button></div>`}</div>
      <div class="field"><label for="suW">Weight (kg)</label><input id="suW" data-su="weight" inputmode="decimal" value="${esc(SU.v.weight || '')}" placeholder="kg" style="max-width:140px"></div>`;

  } else if(SU.step === 2){

      <div class="field"><span class="lbl">Where do you train?</span><div class="opts">${opt('where','gym','At a gym','Machines, cables, barbells and dumbbells')}${opt('where','dumbbells','At home with dumbbells','Adjustable dumbbells or a few pairs')}${opt('where','bodyweight','At home, no equipment','Bodyweight, plus a backpack for rows')}</div></div>
      <div class="field"><span class="lbl">Sessions per week</span><div class="chips">${chip('days',0,'None yet')}${[1,2,3,4,5,6,7].map(d => chip('days', d, String(d))).join('')}</div></div>
      ${p.days ? `<div class="field"><span class="lbl">Training experience</span><div class="opts">${opt('exp','new','New to lifting','Less than 6 months, or a long break')}${opt('exp','some','Some experience','6 months to 2 years of regular training')}${opt('exp','exp','Experienced','More than 2 years')}</div></div>` : ''}
      ${p.days ? `<div class="field"><span class="lbl">Typical session length</span><div class="chips">${[30,45,60,75,90].map(m => chip('minutes', m, m + ' min')).join('')}</div></div>` : ''}`;
  } else if(SU.step === 3){
    h += `<h1 class="su-h">What’s your main goal?</h1>
      <div class="opts">${Object.entries(GOALS).map(([k,g]) => opt('goal', k, g.label, g.sub)).join('')}</div>

  view.innerHTML = h + '</div>';
}

function setupResultHtml(){
  const p = SU.p, r = calcTargets(p), lo = r.tdee*0.9, hi = r.tdee*1.1;
  const seg = [['Resting', r.bmr, SEG.rest], ['Daily movement', r.movement, SEG.move], ['Training, weekly average', r.training, SEG.train], ['Digestion', r.digestion, SEG.dig]];
  const pct = Math.round((r.tdee - r.kcal)/r.tdee*100);
  let pace = r.kcal < r.tdee - 20 ? `That’s ${pct}% below your burn, about ${r1(-r.weekly)} kg of weight loss a week on average.` : r.kcal > r.tdee + 20 ? `That’s a small surplus, about ${r1(r.weekly)} kg of gain a week.` : 'That matches your burn, so your weight should hold steady.';
  let notes = '';
  if(r.special) notes += `<p class="note">During pregnancy or breastfeeding the app doesn’t set a calorie deficit. Please check these targets with your doctor.</p>`;
  if(r.floored) notes += `<p class="note">Your target stops at ${fmt(r.floor)} kcal, the lowest this app suggests for ${p.sex === 'male' ? 'men' : 'women'} (a common rule of thumb, not a strict medical limit). Going lower makes it hard to keep muscle and energy.</p>`;
  if(screenFlag(p)) notes += `<p class="note">You answered yes to a health check question. Please check with a doctor before starting; until you confirm, sessions stay light with no weight increases.</p>`;
  if(p.where && p.where !== 'gym') notes += `<p class="note">Home plan: ${p.where === 'dumbbells' ? 'dumbbell versions with higher rep ranges (10–20)' : 'bodyweight exercises that progress to harder versions, plus backpack rows for your back'}. ${whyLink('home')}</p>`;
  if(p.age >= 60) notes += `<p class="note">For 60 and over, your plan adds a short balance exercise to each session, uses smaller weight jumps, and gives every main meal at least 25 g of protein. ${whyLink('older')}</p>`;
  if(r.capped) notes += `<p class="note">The deficit is capped at 750 kcal a day to protect muscle and training energy.</p>`;
  return `<h1 class="su-h">You burn about ${fmt(r.tdee)} kcal a day</h1>
    <p class="hint">Likely range ${fmt(lo)}–${fmt(hi)}. After a few weeks of logging, your real weight trend will sharpen this.</p>
    <div class="stack" aria-hidden="true">${seg.map(x => `<i style="width:${(x[1]/r.tdee*100).toFixed(1)}%;background:${x[2]}"></i>`).join('')}</div>
    <ul class="brk">${seg.map(x => `<li><i style="background:${x[2]}"></i><span>${x[0]}</span><b>${fmt(x[1])}</b></li>`).join('')}</ul>
    <section class="block" style="border:0;padding:4px 0 0"><h2>Your daily targets</h2>
      <div class="tgrid"><div><b>${fmt(r.kcal)}</b><small>kcal</small></div><div><b>${r.protein}</b><small>g protein</small></div><div><b>${r.carbs}</b><small>g carbs</small></div><div><b>${r.fat}</b><small>g fat</small></div></div>
      <p class="hint">${pace}</p>${notes}</section>
    <details class="why"><summary>Why these numbers?</summary>
      <p><b>Resting, ${fmt(r.bmr)} kcal.</b> What your body burns at rest, from the Mifflin-St Jeor equation using your weight, height, age and sex. <span class="ev">Moderate</span> It’s the best-tested formula, but individuals can differ by around 10%.</p>
      <p><b>Daily movement, ${fmt(r.movement)} kcal.</b> Walking, standing and everyday activity for “${ACTIVITY[p.activity].label.toLowerCase()}”. This part varies the most between people, which is why step counts help.</p>
      <p><b>Training, ${fmt(r.training)} kcal a day.</b> ${p.days ? `${p.days} sessions of about ${p.minutes} min at a moderate-to-hard effort, spread across the week.` : 'No regular training yet.'} <span class="ev">Rough estimate</span> Lifting burns less than most people expect, often 200–300 kcal an hour.</p>
      <p><b>Digestion, ${fmt(r.digestion)} kcal.</b> About 10% of your calories go into digesting food.</p>
      <p><b>Calories, ${fmt(r.kcal)}.</b> ${r.adj < 0 ? `A ${pct}% deficit loses fat steadily while leaving enough energy to train and keep muscle.` : r.adj > 0 ? 'A small surplus supports muscle gain without much extra fat.' : 'Set to match your burn.'}</p>
      <p><b>Protein, ${r.protein} g.</b> ${r.perKg} g per kg of ${r.refW === r.w ? 'your bodyweight' : `a reference weight of ${r.refW} kg (used when BMI is above 30, so protein isn’t set unrealistically high)`}. <span class="ev">Strong</span> Muscle-building benefits level off around 1.6 g per kg; the extra margin helps keep muscle during a deficit.</p>
      <p><b>Fat, ${r.fat} g.</b> About 25% of calories and never below 0.6 g per kg, for hormones and vitamin absorption. <span class="ev">Moderate</span></p>
      <p><b>Carbs, ${r.carbs} g.</b> The rest of your calories. Carbs fuel your training.</p>
    </details>
    <div class="row"><button class="primary" data-act="su-apply">Use these targets</button>${S.hadSettings || S.settings.profile ? '<button class="ghost" data-act="su-keep">Keep my current targets</button>' : ''}</div>`;
}

function validateStep(){
  const p = SU.p, v = SU.v;
  if(SU.step === 0){
    if(!p.sex) return 'Choose male or female for the calorie formula.';
    const age = Math.round(num(v.age));
    if(!age) return 'Enter your age.';
    if(age < 18) return 'Plate & Bar is built for adults 18 and over.';
    if(age > 90) return 'Check your age.';
    const cm = SU.unit === 'ft' ? (num(v.ft)*12 + num(v.inch)) * 2.54 : num(v.cm);
    if(cm < 120 || cm > 230) return SU.unit === 'ft' ? 'Enter your height in feet and inches, like 5 and 7.' : 'Enter your height in cm, like 170.';
    const w = num(v.weight);
    if(w < 30 || w > 300) return 'Enter your weight in kg, like 72.5.';
    p.age = age; p.height = Math.round(cm*10)/10; p.weight = r1(w);
    if(p.sex !== 'female') p.special = 'none';
  }
  if(SU.step === 1 && !p.activity) return 'Pick the option closest to a typical weekday.';
  if(SU.step === 2){
    if(p.days === null || p.days === undefined) return 'Choose how many sessions you do a week.';
    if(p.days > 0 && !p.where) return 'Choose where you train.';
    if(p.days > 0 && !p.exp) return 'Choose your training experience.';
    if(p.days > 0 && !p.minutes) return 'Choose a typical session length.';
    if(p.days === 0){ p.exp = null; p.minutes = null; if(!p.where) p.where = 'gym'; }
  }
  if(SU.step === 3 && !p.goal) return 'Choose your main goal.';
  if(SU.step === 3 && Object.keys(p.screen || {}).length < SCREEN_Q.length) return 'Answer the health check questions.';
  return '';
}

function setupAction(a, b){
  if(a === 'en-toggle'){ enOpen = !enOpen; renderFood(); return; }
  if(a === 'su-start'){ startSetup(); return; }
  if(a === 'su-recalc'){ startSetup(4); return; }
  if(a === 'su-pick'){
    const k = b.dataset.k, raw = b.dataset.v;
    SU.p[k] = (k === 'days' || k === 'minutes') ? Number(raw) : raw;
    if(k === 'sex' && raw !== 'female') SU.p.special = 'none';
    SU.err = ''; renderSetup(); return;
  }
  if(a === 'su-unit'){ SU.unit = SU.unit === 'ft' ? 'cm' : 'ft'; renderSetup(); return; }
  if(a === 'su-next'){ SU.err = validateStep(); if(!SU.err) SU.step++; renderSetup(); scrollTo(0,0); return; }
  if(a === 'su-back'){ SU.err = ''; SU.step = Math.max(0, SU.step-1); renderSetup(); scrollTo(0,0); return; }
  if(a === 'su-cancel' || a === 'su-skip'){ S.tab = SU.from === 'setup' ? 'food' : SU.from; render(); scrollTo(0,0); return; }
  if(a === 'su-apply' || a === 'su-keep'){
    const p = { ...SU.p };
    if(a === 'su-apply'){ const r = calcTargets(p); Object.assign(S.settings, { kcal:r.kcal, protein:r.protein, carbs:r.carbs, fat:r.fat }); }
    p.created = (S.settings.profile && S.settings.profile.created) || TODAY();
    S.settings.profile = p;
    flush(); Store.set('settings', S.settings);
    if(!Object.keys(S.weights.entries || {}).length){ S.weights.entries = { [TODAY()]: p.weight }; Store.set('weights', S.weights); }
    S.hadSettings = true;
    S.tab = 'food'; render(); scrollTo(0,0);
    toast(a === 'su-apply' ? 'Targets updated' : 'Setup saved, targets unchanged');
  }
}

    case 'serv': FS.serv = Math.max(0.5, Math.min(10, FS.serv + num(b.dataset.d))); $('#servV').textContent = r1(FS.serv); break;
    case 'pick': {
      const f = allFoods().find(x => x[0] === b.dataset.name); if(!f) break;
      const ug = unitGrams(f), g = num(FS.g), qty = g > 0 && ug ? r1(g/ug) : FS.serv;
      if(g > 0 && !ug){ toast(`${f[0]} is measured in ${f[1]}, not grams. Use servings.`); break; }
      if(g > 0 && !qty){ toast('That amount is too small to log. Enter more grams or use servings.'); break; }
      addMeal({ name:f[0], qty, kcal:f[2], p:f[3], c:f[4], f:f[5] });
      toast(`Added ${f[0]}${g > 0 && ug ? ` (${fmt(g)} g)` : qty !== 1 ? ' ×' + r1(qty) : ''}`); render(); break;
    }
    case 'addcustom': {
      const name = $('#cfName').value.trim(); const p = num($('#cfP').value), c = num($('#cfC').value), f = num($('#cfF').value);
      let k = num($('#cfK').value); if(!k) k = Math.round(p*4 + c*4 + f*9);
      if(!name){ toast('Give the food a name.'); $('#cfName').focus(); break; }
      if(name.length > 200){ toast('That name is too long. Shorten it.'); $('#cfName').focus(); break; }
      const qty = num($('#cfQ').value) || 1;
      if(k < 0 || p < 0 || c < 0 || f < 0 || qty <= 0){ toast('Calories, macros and servings can’t be negative, and servings must be more than 0.'); break; }
      if(!k){ toast('Enter calories or at least one macro.'); break; }
      addMeal({ name, qty, kcal:k, p, c, f });
      if($('#cfSave').checked){ S.settings.myFoods = [{ name, unit:$('#cfU').value.trim() || '1 serving', kcal:k, p, c, f }, ...(S.settings.myFoods || []).filter(x => x.name !== name)].slice(0,60); saveSoon('settings', S.settings); }
      sheet.close(); toast(`Added ${name}`); render(); break;
    }
    case 'estimate': if(!FS.busy) estimate(); break;
    case 'addest':
      (FS.est || []).forEach(it => addMeal({ name:it.name + (it.qty ? ` (${it.qty})` : ''), qty:1, kcal:Math.round(it.kcal), p:r1(it.protein), c:r1(it.carbs), f:r1(it.fat) }));
      sheet.close(); toast('Added the estimate'); render(); break;
    case 'delmeal': S.day.meals = S.day.meals.filter(m => m.id !== b.dataset.id); saveDay(); render(); break;
    case 'repeat': {
      const prev = normDay(await Store.get('day-' + addDays(S.date,-1)));
      if(!prev.meals.length){ toast('Nothing was logged the day before.'); break; }
      S.day.meals.push(...prev.meals.map(m => ({...m, id:newId()}))); saveDay(); toast('Copied the previous day’s meals'); render(); break;
    }
    case 'tpl': buildSession(b.dataset.t); saveDay(); render(); break;
    case 'addex': openExerciseSheet(); break;
    case 'exPick': case 'exCustom': {
      const name = a === 'exPick' ? b.dataset.name : ($('#exCustom').value || '').trim();
      if(!name){ toast('Type an exercise name.'); break; }
      if(a === 'exCustom' && !TAGS[name]){ suggestTags(name); break; }
      if(!w.template) w.template = 'Session';
      w.exercises.push(newExercise(name)); saveDay(); sheet.close(); render();
      requestAnimationFrame(() => scrollTo({ top:document.body.scrollHeight, behavior:'smooth' })); break;
    }
    case 'delex': w.exercises.splice(i,1); if(!w.exercises.length) w.template = null; saveDay(); render(); break;
    case 'addset': { const ex = w.exercises[i], ls = ex.sets[ex.sets.length-1]; ex.sets.push({ w:ls ? ls.w : '', r:'', done:false }); saveDay(); render(); break; }
    case 'rmset': w.exercises[i].sets.pop(); saveDay(); render(); break;
    case 'saveW': {
      const kg = r1(num($('#wIn').value));
      S.weights.entries = S.weights.entries || {};
      if(kg > 20 && kg < 400){ const pv = Object.entries(S.weights.entries).filter(([d]) => d < S.date && d >= addDays(S.date, -3)).sort().pop(), rise = pv ? r1(kg - pv[1]) : 0; if(rise >= 0.8) S.ui.scaleJump = { date:S.date, kg: rise }; S.weights.entries[S.date] = kg; toast('Weight saved'); }
      else if(!$('#wIn').value.trim()){ delete S.weights.entries[S.date]; toast('Weight cleared'); }
      else { toast('Enter your weight in kg, like 81.6'); break; }
      Store.set('weights', S.weights); renderProgress(); break;
    }
    case 'fitcarbs': { const g = S.settings; g.carbs = Math.max(0, Math.round((g.kcal - g.protein*4 - g.fat*9)/4)); saveSoon('settings', g); renderTargets(); break; }
    case 'delfood': S.settings.myFoods.splice(i,1); saveSoon('settings', S.settings); renderTargets(); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.su){ SU.v[t.dataset.su] = t.value; return; }
  if(t.dataset.ph){ photoInput(t); return; }
  if(bodyInput(t)) return;
  if(t.dataset.rb){ recipeInput(t); return; }
  if(t.id === 'impTxt'){ S.ui.impTxt = t.value; return; }
  if(extraInput(t)) return;
  if(kitchenInput(t)) return;
  if(t.dataset.wt){ S.settings.water = S.settings.water || { glass:250, bottle:1000 }; const v = Math.round(num(t.value)); if(v >= 50 && v <= 3000){ S.settings.water[t.dataset.wt] = v; saveSoon('settings', S.settings, 700); } return; }
  if(t.id === 'enSteps'){ S.day.steps = t.value.trim(); saveDay(); return; }
  if(t.id === 'enSleep'){ const s = t.value.trim(), h = num(s); if(!s) S.day.sleep = ''; else if(isFinite(parseFloat(s.replace(',', '.'))) && h >= 0 && h <= 24) S.day.sleep = h; else return; saveDay(); return; }
  if(t.id === 'fsQ'){ FS.q = t.value; $('#fsList').innerHTML = foodListHtml(); return; }
  if(t.id === 'fsG'){ FS.g = t.value; return; }
  if(t.dataset.f && S.day){ const ex = S.day.workout.exercises[+t.dataset.i]; const s = (t.dataset.ramp ? ex.ramp : ex.sets)[+t.dataset.j]; s[t.dataset.f] = t.value.trim(); saveDay(); return; }
  if(t.id === 'cardio'){ S.day.workout.cardio = t.value.trim(); saveDay(); return; }
  if(t.dataset.t){
    S.settings[t.dataset.t] = Math.max(0, Math.round(num(t.value)));
    saveSoon('settings', S.settings, 700);
    const g = S.settings, mk = g.protein*4 + g.carbs*4 + g.fat*9;
    $('#tCheck').textContent = `Your macros add up to ${fmt(mk)} kcal.` + (Math.abs(mk - g.kcal) > 50 ? ' That doesn’t match your calorie target.' : '');
  }
});
document.addEventListener('change', e => {
  // when a done set's numbers change, keep "last time" in sync
  const t = e.target;
  if(t.id === 'enSteps' && S.tab === 'food'){ renderFood(); return; }
  if(extraChange(t)) return;
  if(kitchenChange(t)) return;
  if(t.id === 'impFile'){ S.ui.impFile = t.files && t.files[0]; renderFoodSheet(); return; }
  if(bodyChange(t)) return;
  if(photoChange(t)) return;
  if(t.dataset.f && S.day && !t.dataset.ramp){ const ex = S.day.workout.exercises[+t.dataset.i]; if(ex.sets[+t.dataset.j].done) updateLift(ex); }
  if(t.dataset.t && S.tab === 'targets') renderTargets();
});


/* keep the tapped set in place when the workout re-renders (content above it can grow or shrink) */
let ANCHOR = null;
function anchorTarget(b){
  if(!b || S.tab !== 'workout') return null;
  const i = b.dataset.i, j = b.dataset.j, ramp = b.dataset.ramp;
  if(i !== undefined && j !== undefined) return `[data-act="${ramp ? 'ramp-tick' : 'tick'}"][data-i="${i}"][data-j="${j}"]`;
  const card = b.closest('article.ex'); if(card){ const k = [...document.querySelectorAll('article.ex')].indexOf(card); return k >= 0 ? `article.ex:nth-of-type(${k + 1})` : null; }
  return null;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); const sel = anchorTarget(b); if(!sel){ ANCHOR = null; return; }
  const el = document.querySelector(sel); ANCHOR = el ? { sel, y: el.getBoundingClientRect().top } : null;
}, true);
window.addEventListener('click', () => {
  if(!ANCHOR) return; const a = ANCHOR; ANCHOR = null;
  const el = document.querySelector(a.sel) || document.querySelector(a.sel.replace('ramp-tick', 'tick'));
  if(el){ const dy = el.getBoundingClientRect().top - a.y; if(Math.abs(dy) > 1) window.scrollBy(0, dy); }
});

/* ---------- boot ---------- */
(async function boot(){
  render();
  await Store.init();
  const [st, lifts, weights] = await Promise.all([Store.get('settings'), Store.get('lifts'), Store.get('weights')]);
  S.settings = { ...DEFAULT_SETTINGS, ...(st || {}) };
  S.lifts = lifts || {};
  S.weights = weights || { entries:{} };
  S.hadSettings = !!st;
  let ses = await Store.get('sessions');
  if(!ses){ // build the index once from recent days
    ses = { entries:{} };
    const keys = Array.from({length:28}, (_, k) => addDays(TODAY(), -k));
    const docs = await Promise.all(keys.map(k => Store.get('day-' + k)));
    docs.forEach((d, i) => { if(!d || !d.workout) return; const n = (d.workout.exercises || []).reduce((a, e) => a + (e.sets || []).filter(x => x.done).length, 0); if(n) ses.entries[keys[i]] = { t: d.workout.base || d.workout.template || 'Session', n }; });
    if(Object.keys(ses.entries).length) Store.set('sessions', ses);
  }
  S.sessions = ses;
  S.measures = (await Store.get('measures')) || { entries:{} };
  applyCustomTags();
  await loadDay();
  S.ready = true;
  if(!S.settings.profile && !st) startSetup();
  else render();
  getSample().then(() => { if(S.tab === 'food') renderFood(); });
  syncPending();
})();
