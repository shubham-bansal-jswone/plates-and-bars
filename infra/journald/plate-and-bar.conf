# journald drop-in for the VM (docker-compose.yml sends mysql, api and caddy logs to journald). Install once per VM:
#   sudo infra/journald/install.sh        (see infra/OBSERVABILITY.md, "Container logs")
# Age: journald deletes whole journal files that are older than MaxRetentionSec, judged by the file's newest entry or
# by its first entry depending on the version. Files are closed every MaxFileSec (1 day), so a file spans at most one
# day, and the check runs at most a day late: with 12 days of retention no entry is older than 14 days under either
# reading (12 + 1 day span + 1 day late).
# Size: SystemMaxUse can delete files sooner than that, never later.
[Journal]
Storage=persistent
MaxFileSec=1day
MaxRetentionSec=12day
SystemMaxUse=200M
RuntimeMaxUse=200M
