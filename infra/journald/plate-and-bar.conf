# journald drop-in for the VM (docker-compose.yml sends mysql, api and caddy logs to journald). Install once per VM:
#   sudo infra/journald/install.sh        (see infra/OBSERVABILITY.md, "Container logs")
# Age: journald deletes whole journal files whose newest entry is older than MaxRetentionSec. Files are closed every
# MaxFileSec (1 day), so a file holds at most one day, and 13 days of retention means no entry is older than 14 days
# (13 + the 1-day span of the oldest file).
# Size: SystemMaxUse can delete files sooner than that, never later.
[Journal]
Storage=persistent
MaxFileSec=1day
MaxRetentionSec=13day
SystemMaxUse=200M
RuntimeMaxUse=200M
