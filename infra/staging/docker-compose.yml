# Staging stack: API + MySQL + Caddy (HTTPS). Open-source images pinned by version; all have linux/arm64 builds
# (checked 2026-10-12), so this runs on an Oracle Cloud Always Free ARM (Ampere A1) VM. Run from this directory:
#   cp .env.example .env   # fill in; never commit .env
#   CONTENT_UPDATED_AT="$(../../backend/scripts/content-updated-at.sh)" docker compose build api   # API_TAG from .env
#   docker compose up -d
# Secrets come from the environment (.env on the VM, or exported variables), never from this file.
# Nothing here deploys anything: see RUNBOOK.md.
name: plateandbar-staging

# Container logs go to journald (the VM's age and size bounds are the drop-in infra/journald/plate-and-bar.conf,
# installed once per VM with infra/journald/install.sh). `docker compose logs` still works with this driver.
x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}"
    labels: com.docker.compose.service

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: plateandbar
      MYSQL_USER: ${DB_USER:-plateandbar}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]
    # No published ports: only the API (same network) and backup.sh (docker compose exec) reach it.

  api:
    # Rollback = set the previous tag as API_TAG in .env, then `docker compose up -d api` (RUNBOOK.md)
    image: plateandbar-api:${API_TAG:?set API_TAG, e.g. the git sha}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        # Required by the Dockerfile, which fails the build when it is empty; compute on a full-history checkout
        # (backend/README.md). Not `:?` here: that would make every compose command (exec, stop, backup.sh) need it.
        CONTENT_UPDATED_AT: ${CONTENT_UPDATED_AT:-}
      labels:
        # The image reads ERASURE_LEDGER_DIR (#887). deploy.sh rolls back automatically only to an image with this
        # label: an older one cannot start with this file (RUNBOOK.md section 3a).
        app.plateandbar.erasure-ledger-dir: "1"
    restart: unless-stopped
    logging: *logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/plateandbar
      DB_USER: ${DB_USER:-plateandbar}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY (at least 32 bytes)}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Exact origins of the web app that may use the refresh cookie (#644); empty refuses cookie mode
      AUTH_COOKIE_ORIGINS: ${AUTH_COOKIE_ORIGINS:-}
      # Per-account record cap on POST /sync (413 account_full). Unset or empty = no cap; leave unset until the app handles account_full.
      SYNC_MAX_RECORDS_PER_ACCOUNT: ${SYNC_MAX_RECORDS_PER_ACCOUNT:-}
      # Error tracking (Sentry SDK to GlitchTip). Empty = off, nothing is sent.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-staging}
      # Maps events to the deployed image (#827). deploy.sh writes API_RELEASE (the v* tag without its v, or the sha) next to
      # API_TAG; without it (a hand edit) the tag is used verbatim. Backend reads it as sentry.release.
      SENTRY_RELEASE: plateandbar-api@${API_RELEASE:-${API_TAG}}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      # The proxy directly in front of the API is Caddy, which the API sees at an address in this network's subnet.
      APP_RATELIMIT_TRUSTEDPROXIES: 172.28.0.0/24
      ERASURE_LEDGER_DIR: /var/lib/plateandbar/erasure
      JAVA_TOOL_OPTIONS: -Xmx640m
    # Memory (#990, RUNBOOK.md "API memory"): the container is capped and the JVM heap is set explicitly (-Xmx wins over the
    # image's MaxRAMPercentage=75). Heap 640m = 2 concurrent image decodes (the API's cap, 4096x4096x4 B = 64 MiB each,
    # 128 MiB) + 2 re-encoded copies and in-flight bodies (about 64 MiB) + the normal working set (about 256 MiB) + slack.
    # The cap adds metaspace, code cache, thread stacks and native buffers (about 360 MiB). test-compose-memory.sh checks the sums.
    mem_limit: 1g
    memswap_limit: 1g # no swap: an out-of-memory stays inside this container and the restart policy brings it back
    # No published ports: Caddy reaches api:8080 over the network.
    networks: [backend]
    volumes:
      # Erasure ledger (#850, #887): the API refuses to start outside the dev profile without ERASURE_LEDGER_DIR (it
      # replaced ERASURE_LEDGER_PATH, a single file) and writes one file per UTC day there, which must survive recreating
      # the container, so it is a named volume. ledger-upload.sh copies the days to the bucket and keeps 45 days.
      - erasure_ledger:/var/lib/plateandbar/erasure

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    logging: *logging
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_HOST: ${API_HOST:?set API_HOST}
      API_UPSTREAM: api:8080
      # Web app host (same site as API_HOST). Unset: plain HTTP on port 8081 inside the container, which is not published, so nothing is reachable.
      WEB_HOST: ${WEB_HOST:-http://127.0.0.1:8081}
      # Origin of the app's error-tracking ingest (the host of EXPO_PUBLIC_SENTRY_DSN, for example https://errors.example.com): added to the web CSP connect-src. Empty = app has no DSN.
      # A bare https origin only: check it with infra/scripts/check-sentry-origin.sh "$WEB_SENTRY_ORIGIN" "$EXPO_PUBLIC_SENTRY_DSN" (a scheme-only or wildcard value would open connect-src to any host).
      SENTRY_ORIGIN: ${WEB_SENTRY_ORIGIN:-}
    # Caddyfile.stack imports Caddyfile.api and Caddyfile.web from the mounted directory.
    command: caddy run --config /etc/caddy/sites/Caddyfile.stack --adapter caddyfile
    volumes:
      - ../caddy:/etc/caddy/sites:ro
      # Expo web export, written by web-deploy.yml (rsync). Create it as the deploy user first: RUNBOOK.md section 7.
      - ${WEB_DIR:-./web}:/srv/web:ro
      - caddy_data:/data # certificates: keep, or Let's Encrypt rate limits bite after a rebuild
      - caddy_config:/config
    networks: [backend]

networks:
  backend:
    ipam:
      config:
        - subnet: 172.28.0.0/24 # keep in step with APP_RATELIMIT_TRUSTEDPROXIES above

volumes:
  mysql_data:
  erasure_ledger:
  caddy_data:
  caddy_config:
