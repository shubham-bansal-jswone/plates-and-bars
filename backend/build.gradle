plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'app.plateandbar'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Docker 29 needs Testcontainers >= 1.21.4 (older clients get "client version too old").
ext['testcontainers.version'] = '1.21.4'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // JWT signing/verification and Google JWKS verification (brings nimbus-jose-jwt, Apache-2.0).
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    // In-memory token-bucket rate limits (Apache-2.0).
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.21.0'
    // Bounded cache for the rate-limit buckets (Apache-2.0).
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // Validates sync requests against the schemas in openapi.yaml (Apache-2.0), and reads that YAML (Apache-2.0).
    implementation 'com.networknt:json-schema-validator:3.0.8'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    // SMTP delivery of sign-in codes (Spring Boot starter Apache-2.0; Jakarta Mail via Eclipse Angus, EPL-2.0).
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // In-process SMTP server for delivery tests (Apache-2.0).
    testImplementation 'com.icegreen:greenmail-junit5:2.1.14'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The sync request validator reads the contract itself: the one openapi.yaml, never a copy.
tasks.named('processResources') {
    doFirst {
        if (!file('../content/cards.json').exists() || !file('../content/exercises.json').exists()) {
            throw new GradleException('../content/cards.json or exercises.json is missing: build from a full checkout (see Dockerfile)')
        }
        if (!file('../packages/api/openapi.yaml').exists()) {
            throw new GradleException('../packages/api/openapi.yaml is missing: build from a full checkout (see Dockerfile)')
        }
    }
    from('../packages/api') {
        include 'openapi.yaml'
    }
    // The AI proxy grounds Ask why on the cards and checks exercise names against the catalogue: the content
    // agent's files, copied (never edited) into the jar under /content at build time.
    from('../content') {
        include 'cards.json', 'exercises.json'
        into 'content'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // The signing key is environment-only; tests use a throwaway one.
    environment 'JWT_SIGNING_KEY', 'test-only-signing-key-0123456789-abcdefghij'
    environment 'GOOGLE_CLIENT_IDS', 'test-client-id.apps.googleusercontent.com'
    // Full-context tests start outside the dev profile, which needs an SMTP host; nothing connects to it.
    environment 'SMTP_HOST', 'localhost'
    environment 'SMTP_FROM', 'noreply@example.invalid'
}

// Only the executable jar is produced (the Dockerfile copies build/libs/*.jar).
tasks.named('jar') {
    enabled = false
}
