plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'app.plateandbar'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // JWT signing/verification and Google JWKS verification (brings nimbus-jose-jwt, Apache-2.0).
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    // In-memory token-bucket rate limits (Apache-2.0).
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.21.0'
    // Bounded cache for the rate-limit buckets (Apache-2.0).
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // Validates sync requests against the schemas in openapi.yaml (Apache-2.0), and reads that YAML (Apache-2.0).
    implementation 'com.networknt:json-schema-validator:3.0.8'
    implementation 'tools.jackson.dataformat:jackson-dataformat-yaml'
    // SMTP delivery of sign-in codes (Spring Boot starter Apache-2.0; Jakarta Mail via Eclipse Angus, EPL-2.0).
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // Error tracking (MIT; sentry-spring-boot-4 targets Spring Boot 4 / Spring 7 / Jakarta). Off unless SENTRY_DSN is set (#687).
    implementation 'io.sentry:sentry-spring-boot-4:8.61.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    // TestRestTemplate (the Testcontainers ITs) moved out of spring-boot-test in Boot 4.
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    // In-process SMTP server for delivery tests (Apache-2.0).
    testImplementation 'com.icegreen:greenmail-junit5:2.1.14'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The sync request validator reads the contract itself: the one openapi.yaml, never a copy.
tasks.named('processResources') {
    doFirst {
        if (!file('../content/cards.json').exists() || !file('../content/exercises.json').exists()) {
            throw new GradleException('../content/cards.json or exercises.json is missing: build from a full checkout (see Dockerfile)')
        }
        if (!file('../packages/api/openapi.yaml').exists()) {
            throw new GradleException('../packages/api/openapi.yaml is missing: build from a full checkout (see Dockerfile)')
        }
    }
    from('../packages/api') {
        include 'openapi.yaml'
    }
    // Every content file is served as a bundle (GET /content/*), and the AI proxy grounds Ask why on the cards and
    // checks exercise names against the catalogue: the content agent's files, copied (never edited) into the jar
    // under /content at build time.
    from('../content') {
        include '*.json'
        into 'content'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // The blank-text vectors are read by BlankTextVectorsTest: editing them must rerun the tests.
    inputs.dir('../packages/api/test-vectors')
    // The signing key is environment-only; tests use a throwaway one.
    environment 'JWT_SIGNING_KEY', 'test-only-signing-key-0123456789-abcdefghij'
    environment 'GOOGLE_CLIENT_IDS', 'test-client-id.apps.googleusercontent.com'
    // Full-context tests start outside the dev profile, which needs an SMTP host; nothing connects to it.
    environment 'SMTP_HOST', 'localhost'
    environment 'SMTP_FROM', 'noreply@example.invalid'
    // The erasure ledger is required outside the dev profile; full-context tests append to a throwaway directory.
    environment 'ERASURE_LEDGER_DIR', layout.buildDirectory.dir('tmp/erasure-ledger').get().asFile.path
    // Every content file needs an updated_at or the app refuses to start; tests use a fixed one for each file.
    environment 'CONTENT_UPDATED_AT', fileTree('../content') { include '*.json' }.files
            .collect { it.name.replace('.json', '') + '=2026-01-02T03:04:05Z' }.sort().join(',')
    // ContractCoverageTest enforces what ran only when nothing was filtered out: no --tests or include/exclude filter.
    // It also needs every test class in one JVM (its record of validations is a static set), so parallel forks and
    // forkEvery are refused rather than letting the guard fail with a partial view.
    doFirst {
        if (maxParallelForks > 1 || forkEvery != 0) {
            throw new GradleException('ContractCoverageTest needs all test classes in one JVM: ' +
                    'do not set maxParallelForks > 1 or forkEvery on the test task')
        }
        boolean filtered = !(filter.includePatterns.isEmpty() && filter.excludePatterns.isEmpty()
                && filter.commandLineIncludePatterns.isEmpty())
        systemProperty 'contract.coverage.enforce', (!filtered).toString()
    }
}

// Only the executable jar is produced (the Dockerfile copies build/libs/*.jar).
tasks.named('jar') {
    enabled = false
}
