spring:
  application:
    name: plate-and-bar-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/plateandbar}
    username: ${DB_USER:plateandbar}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

app:
  version: ${APP_VERSION:0.1.0}
