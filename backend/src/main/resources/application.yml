spring:
  mvc:
    async:
      # GET /me/export streams its body (#349); Tomcat's 30 s default would cut every export, download time included.
      # Bounded in time by this and in number by app.export.max-concurrent.
      request-timeout: 10m
  application:
    name: plate-and-bar-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/plateandbar}
    username: ${DB_USER:plateandbar}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  # No endpoint takes multipart; off, so an upload is never spooled to disk or parsed.
  servlet:
    multipart:
      enabled: false
  # Request parsing is strict on every endpoint (#720, contract 0.1.18): content after the JSON value and a key
  # repeated in one object (compared after unescaping) are refused as a body that is not valid JSON, so 400
  # invalid_request. The nesting limit stays at Jackson 2's 1000 (Jackson 3's default is 500; #81).
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
    read:
      strict-duplicate-detection: true
    factory:
      constraints:
        read:
          max-nesting-depth: 1000
        write:
          max-nesting-depth: 1000

logging:
  pattern:
    # requestId comes from RequestIdFilter (the X-Request-Id header or a generated UUID); never request content.
    level: "%5p [%X{requestId:-}]"
  level:
    # These print "rejected value [...]" (user input such as an email) when validation fails.
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: INFO
    # TRACE here prints exception-handler arguments, including validation exceptions with the rejected value.
    org.springframework.web.method.HandlerMethod: INFO
    # These print whole request and response bodies (sync records: food, weight, health answers) at DEBUG or TRACE.
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO
    # Prints every bound SQL parameter at TRACE, which includes the stored record JSON.
    org.springframework.jdbc.core.StatementCreatorUtils: INFO
    # These print the request line ("GET /api/v1/foods/barcode/<digits>") at DEBUG: the barcode is food data and is never logged (#944).
    org.springframework.web.servlet.DispatcherServlet: INFO
    org.springframework.security.web.FilterChainProxy: INFO
    org.springframework.web.filter.CommonsRequestLoggingFilter: INFO
    # Prints "Authorizing GET /api/v1/foods/barcode/<digits>" at TRACE.
    org.springframework.security.web.access.intercept.RequestMatcherDelegatingAuthorizationManager: INFO
    # Tomcat's HTTP/1.1 processor can print raw request bytes at DEBUG or TRACE.
    org.apache.coyote.http11: INFO

# Error tracking (#687). Off, with no network use, unless SENTRY_DSN is set. SentryScrubber runs on every event.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:${spring.profiles.active:dev}}
  send-default-pii: false
  max-request-body-size: none
  max-breadcrumbs: 0
  attach-server-name: false
  enable-external-configuration: false

server:
  port: ${PORT:8080}
  # Deliberately off (#352). Forwarded headers are not trusted by the servlet container: the client IP comes from
  # ClientIpResolver (app.rate-limit.trusted-proxies) and HSTS is set by the TLS-terminating proxy (Caddy), not here.
  # Turning it on (native) would bypass the trusted-proxies list: the container would trust private-range proxies.
  forward-headers-strategy: none

app:
  export:
    # Exports streaming at once (each holds a database connection and a thread for the whole download); more is 429.
    max-concurrent: ${EXPORT_MAX_CONCURRENT:2}
  sync:
    # Largest accepted POST /sync body in bytes; bigger is 400 invalid_request.
    max-body-bytes: ${SYNC_MAX_BODY_BYTES:2097152}
    # The conflict log keeps at most this many entries per user and none older than this many days.
    conflict-log-max-per-user: ${SYNC_CONFLICT_LOG_MAX_PER_USER:1000}
    conflict-log-retention-days: ${SYNC_CONFLICT_LOG_RETENTION_DAYS:90}
    # Most records one account may store across the 16 synced tables, tombstones included; a push with new records that
    # would go over it is 413 account_full. Unset, empty or 0 means no cap. Off until the app handles account_full (#349).
    max-records-per-account: ${SYNC_MAX_RECORDS_PER_ACCOUNT:}
  auth:
    # Environment only. No default: the app refuses to start without a key of at least 32 bytes.
    jwt-signing-key: ${JWT_SIGNING_KEY:}
    # Comma-separated OAuth client ids (audiences) accepted in Google ID tokens.
    google-client-ids: ${GOOGLE_CLIENT_IDS:}
    # Comma-separated exact origins of the web app itself, the only ones allowed to use cookie mode for the refresh token
    # (X-Auth-Transport: cookie, ADR 006). Separate from CORS_ALLOWED_ORIGINS on purpose; empty refuses cookie mode.
    cookie-origins: ${AUTH_COOKIE_ORIGINS:}
  mail:
    # Environment only. Host and from are required unless the dev profile (LoggingMailSender) is active.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}
    starttls: ${SMTP_STARTTLS:true}
  content:
    # Environment only, from the build argument of the same name: name=timestamp pairs, one per content/*.json
    # (backend/scripts/content-updated-at.sh prints it). The app refuses to start if a bundle has no value.
    updated-at: ${CONTENT_UPDATED_AT:}
  cors:
    # Comma-separated exact web app origins, e.g. https://app.example.com. Empty refuses every cross-origin call.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  ai:
    # Every feature is off until a provider and a monthly budget are chosen (#200, decision 7).
    # The budget is a cap on input plus output tokens per UTC month; 0 keeps every feature off.
    daily-limit: ${AI_DAILY_LIMIT:10}
    monthly-budget-tokens: ${AI_MONTHLY_BUDGET_TOKENS:0}
    describe-meal-enabled: ${AI_DESCRIBE_MEAL_ENABLED:false}
    ask-why-enabled: ${AI_ASK_WHY_ENABLED:false}
    weekly-summary-enabled: ${AI_WEEKLY_SUMMARY_ENABLED:false}
    suggest-tags-enabled: ${AI_SUGGEST_TAGS_ENABLED:false}
    meal-photo-enabled: ${AI_MEAL_PHOTO_ENABLED:false}
    import-recipe-enabled: ${AI_IMPORT_RECIPE_ENABLED:false}
    form-check-enabled: ${AI_FORM_CHECK_ENABLED:false}
  off:
    # Barcode lookup through Open Food Facts (#944, ADR 009). Off until the owner has filled in OFF's API usage form and chosen the
    # contact address; while off, GET /foods/barcode/{code} answers 503 upstream_unavailable and calls nothing.
    enabled: ${OFF_ENABLED:false}
    # Goes into the User-Agent (PlateAndBar/<version> (<contact>)); required while enabled. Environment only.
    contact: ${OFF_CONTACT_EMAIL:}
    base-url: ${OFF_BASE_URL:https://world.openfoodfacts.org}
  # Erasure ledger (#850, #887): DELETE /me appends the user id and time to erasures-<UTC day>.log in this directory
  # before it deletes, so a backup restore can replay the erasures. Empty = off (dev only). The staging stack sets it
  # to a dedicated volume.
  erasure-ledger:
    dir: ${ERASURE_LEDGER_DIR:}
