  /ai/form-check:
    post:
      tags: [ai]
      operationId: formCheck
      summary: Second opinion on exercise form from a few still frames
      description: |
        Judges 2 to 4 still frames, in order, from the user's own video of one set of a
        catalogue exercise. Mirrors the prototype's film-and-check form review
        (`onFormVideo()`). The video never leaves the phone: the app cuts the frames on the
        device and sends only those, only when the user has turned AI features on.

        **Grounding.** The server looks up the exercise in `content/exercises.json`
        `cards` (the version it deploys) and sends the model that card's `key_cues` and
        `common_mistakes` and the frames. For each key cue the model judges only what is
        clearly visible, answers `unclear` when the angle or quality does not show it, and
        is told to be specific and kind and never to diagnose an injury. A request
        `exercise` that is not a key of `cards` (a custom exercise has no cues) is 400
        `invalid_request` with `details[].field` = `exercise`; the app does not offer the
        check for it.

        `visible` is false when the user's body was not clearly in frame; the app then asks
        for a side view with the whole body in frame. Each `checks[].cue` is one of the
        card's `key_cues` verbatim (the server drops any other). The app always shows
        the "second opinion, not a coach" note; nothing is stored by this call.

        Image rules are in the `ai` tag, Images. Non-AI fallback: the cue checklist on the
        exercise card.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormCheckRequest'
            examples:
              default:
                value:
                  exercise: Goblet Squat
                  frames:
                    - media_type: image/png
                      data: iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAEUlEQVR4nGM4MS0AK2IYWhIAHz5rgeChJEMAAAAASUVORK5CYII=
                    - media_type: image/png
                      data: iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAEUlEQVR4nGM4MS0AK2IYWhIAHz5rgeChJEMAAAAASUVORK5CYII=
      responses:
        '200':
          description: The cue checks and the user's remaining quota.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormCheckResponse'
              examples:
                default:
                  value:
                    visible: true
                    checks:
                      - cue: Sit down between your heels with your chest up
                        status: good
                        note: ''
                      - cue: Push your knees out in line with your toes
                        status: watch
                        note: Your knees drift in a little on the way up.
                    summary: Depth and chest position look solid. Focus on pushing your knees out as you stand.
                    quota:
                      limit: 10
                      remaining: 5
                      resets_at: '2026-10-10T00:00:00Z'
                not_visible:
                  value:
                    visible: false
                    checks: []
                    summary: ''
                    quota:
                      limit: 10
                      remaining: 4
                      resets_at: '2026-10-10T00:00:00Z'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/AiLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/AiImageUnavailable'

  /content/manifest:
    get:
      tags: [content]
      operationId: getContentManifest
      summary: List the content bundles the server serves, with their hashes
      security: []
      description: |
        One entry per bundle, sorted by `name`. The app compares each entry with the copy
        it holds (see the `content` tag) and fetches only bundles that changed.

        **Caching.** `Cache-Control: public, max-age=300`: this is a hint to caches, so a
        cached manifest is at most five minutes stale. When the app checks is set by the
        refresh rule in the `content` tag. The `ETag` is the quoted lowercase hex SHA-256
        of the uncompressed response body. A request whose `If-None-Match` matches it gets
        304 with no body. An over-long or unparseable `If-None-Match` is ignored, giving 200
        with the body; it is never rejected. The server may compress the body under the
        same rules as `GET /content/{bundle}`.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The manifest.
          headers:
            ETag:
              $ref: '#/components/headers/ContentETag'
            Cache-Control:
              description: Always `public, max-age=300`.
              schema:
                type: string
                const: public, max-age=300
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentManifest'
              examples:
                default:
                  value:
                    bundles:
                      - name: cards
                        schema_version: 1
                        sha256: a2ccbf40d3e72ac60aaf08167ebea7df4f62bc88069a0fac778c14a4b872a337
                        size_bytes: 16095
                        updated_at: '2026-10-09T08:54:10Z'
                      - name: exercises
                        schema_version: 1
                        sha256: 266b72969634c59a493b27f56f67af9f33972031e2201a9e2db05535c5905934
                        size_bytes: 87778
                        updated_at: '2026-10-08T14:57:42Z'
                      - name: foods
                        schema_version: 1
                        sha256: f5f8e78fc2503b188d7f85747b30eee016cfc03b00a560c32fa5c95b6cbb7459
                        size_bytes: 29139
                        updated_at: '2026-10-08T10:49:05Z'
                      - name: measures
                        schema_version: 1
                        sha256: 0d02e9ec905f62923446eb4f9f0ce3832f7ac4d784872257fe37abc207c3647b
                        size_bytes: 699
                        updated_at: '2026-10-09T08:54:10Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /content/{bundle}:
    get:
      tags: [content]
      operationId: getContentBundle
      summary: Download one content bundle
      security: []
      description: |
        The exact bytes of `content/<bundle>.json` in the server's deployed build, as
        `application/json; charset=utf-8`. The body's SHA-256 and length equal the
        manifest entry's `sha256` and `size_bytes`.

        **Compression.** The server may compress the body when the request allows it
        (`Accept-Encoding`). It then must send `Vary: Accept-Encoding`. The hash and size
        are always of the uncompressed body. Proxies that compress may weaken the tag to
        `W/"<sha256>"`, so clients must accept a `W/` prefix on a received `ETag`. The real
        integrity check is the app comparing the body's SHA-256 with the manifest, not the
        `ETag`.

        **Caching.** `Cache-Control: public, no-cache`: caches may store the bundle but
        revalidate it every time, so a cached copy never lags the manifest. The `ETag` is
        the manifest's `sha256` in double quotes; a request whose `If-None-Match` matches
        it gets 304 with no body. An over-long or unparseable `If-None-Match` is ignored
        (200 with the body).

        A well-formed name that is not in the manifest is 404 `not_found`.
      parameters:
        - name: bundle
          in: path
          required: true
          description: Bundle name, the manifest entry's `name`.
          schema:
            $ref: '#/components/schemas/ContentBundleName'
          example: measures
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The bundle, byte for byte.
          headers:
            ETag:
              $ref: '#/components/headers/ContentETag'
            Cache-Control:
              description: Always `public, no-cache`.
              schema:
                type: string
                const: public, no-cache
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentBundle'
              examples:
                default:
                  summary: content/measures.json (ETag "0d02e9ec905f62923446eb4f9f0ce3832f7ac4d784872257fe37abc207c3647b")
                  value:
                    schema_version: 1
                    origin: docs/prototype/plate-and-bar.html (MEASURES, measuresHtml)
                    unit: cm
                    measures:
                      - key: waist
                        label: Waist (at navel)
                        show: always
                      - key: neck
                        label: Neck
                        show: always
                      - key: chest
                        label: Chest
                        show: always
                      - key: arm
                        label: Upper arm
                        show: always
                      - key: thigh
                        label: Thigh
                        show: always
                      - key: hips
                        label: Hips
                        show:
                          sex: female
                          or_entered_that_day: true
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: No bundle with this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    code: not_found
                    message: No content bundle with this name.
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived JWT access token from an `/auth/*` endpoint.

  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |
        An `ETag` from an earlier response. When it matches the current one, the server
        answers 304 with no body. Compared as RFC 9110 requires for `If-None-Match` (weak
        comparison, so a `W/` prefix added by a proxy still matches); a list of tags and
        `*` are accepted. A value longer than 1024 characters, or one that cannot be
        parsed, is ignored: the server answers as if the header were absent, never 400.
      schema:
        type: string
      example: '"0d02e9ec905f62923446eb4f9f0ce3832f7ac4d784872257fe37abc207c3647b"'
    AuthTransport:
      name: X-Auth-Transport
      in: header
      required: false
      description: |
        `cookie` (exact, case-sensitive) selects cookie mode, which the web app uses: the
        refresh token travels only in the `__Secure-pb_refresh` cookie, never in a body.
        Requires a cookie-mode `Origin` (else 403 `forbidden`). Absent, or any other
        value (ignored): body mode, which native apps use and which is unchanged. See the
        `auth` tag.
      schema:
        type: string
        maxLength: 64
      example: cookie
    RefreshCookie:
      name: __Secure-pb_refresh
      in: cookie
      required: false
      description: |
        The refresh token in cookie mode, set by the server and sent by the browser
        (`HttpOnly`, so the web app's script never sees it). Read only when
        `X-Auth-Transport: cookie` is present, and ignored otherwise.
      schema:
        type: string
      example: rt_9f2c1e6b7a8d4c3b9e0f1a2b3c4d5e6f

  headers:
    SetRefreshCookie:
      description: |
        Cookie mode only: sets or rotates the refresh token cookie. Absent in body mode.
      schema:
        type: string
      example: __Secure-pb_refresh=rt_1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d; Path=/api/v1/auth/refresh; Max-Age=7776000; HttpOnly; Secure; SameSite=Strict
    ClearRefreshCookie:
      description: |
        Cookie mode only: clears the refresh token cookie. Absent in body mode.
      schema:
        type: string
      example: __Secure-pb_refresh=; Path=/api/v1/auth/refresh; Max-Age=0; HttpOnly; Secure; SameSite=Strict
    NoStore:
      description: Always `no-store`.
      schema:
        type: string
        const: no-store
    ContentETag:
      description: |
        Entity tag: the lowercase hex SHA-256 of the uncompressed body in double quotes.
        The server sends it strong. A compressing proxy may weaken it to `W/"<sha256>"`, so
        clients accept either form. The app checks integrity against the body's SHA-256,
        not the `ETag`.
      schema:
        type: string
        pattern: '^(W/)?"[0-9a-f]{64}"$'
      example: '"0d02e9ec905f62923446eb4f9f0ce3832f7ac4d784872257fe37abc207c3647b"'
    VaryAcceptEncoding:
      description: Includes `Accept-Encoding`. Required whenever the server may compress the body.
      schema:
        type: string
      example: Accept-Encoding

  responses:
    NotModified:
      description: |
        Not modified: `If-None-Match` matched the current `ETag`. No body; keep the cached
        copy.
      headers:
        ETag:
          $ref: '#/components/headers/ContentETag'
        Cache-Control:
          description: The same value the 200 response would carry.
          schema:
            type: string
        Vary:
          $ref: '#/components/headers/VaryAcceptEncoding'
    TokenPair:
      description: Signed in; a new token pair. In cookie mode the refresh token is in the cookie and the body's `refresh_token` is empty.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/SetRefreshCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenPair'
          examples:
            default:
              summary: Native app (body mode)
              value:
                token_type: Bearer
                access_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhMWIyIn0.c2ln
                access_token_expires_at: '2026-10-08T06:45:00Z'
                refresh_token: rt_1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
                refresh_token_expires_at: '2027-01-06T06:30:00Z'
                user:
                  id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                  email: asha@example.com
                  created_at: '2026-10-08T06:30:00Z'
                new_user: true
            cookie:
              summary: Web app (cookie mode); the refresh token is only in Set-Cookie
              value:
                token_type: Bearer
                access_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhMWIyIn0.c2ln
                access_token_expires_at: '2026-10-08T06:45:00Z'
                refresh_token: ''
                refresh_token_expires_at: '2027-01-06T06:30:00Z'
                user:
                  id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                  email: asha@example.com
                  created_at: '2026-10-08T06:30:00Z'
                new_user: false
    InvalidRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                code: invalid_request
                message: Some fields are invalid.
                details:
                  - field: changes.food_logs[0].kcal
                    issue: must be greater than or equal to 0
            too_large:
              summary: Body over the size limit
              description: The request body is over 2 MB (16 KB on the text `POST /ai/*` calls); see the wire conventions.
              value:
                code: invalid_request
                message: The request is not valid.
                details:
                  - field: ''
                    issue: too_large
            image_unreadable:
              summary: An image the AI image calls cannot use
              description: |
                `issue` is one of `too_large`, `invalid_base64`, `unsupported_type`, `type_mismatch`,
                `unreadable_image` or `dimensions` (see the `ai` tag, Images). `field` names the image.
              value:
                code: invalid_request
                message: That photo couldn't be read. Try a JPEG or PNG.
                details:
                  - field: image.data
                    issue: unreadable_image
    Unauthorized:
      description: Missing, invalid or expired credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            expired:
              value:
                code: token_expired
                message: Access token expired. Refresh and retry.
            invalid:
              value:
                code: unauthorized
                message: Sign in to continue.
    RateLimited:
      description: Too many requests. Retry after the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                code: rate_limited
                message: Too many requests. Try again in a minute.
    AccountFull:
      description: |
        The push would take the account over its record cap (see `POST /sync`, Account
        record cap). The whole request was refused: nothing applied, nothing pulled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                code: account_full
                message: Your account is full. New entries stay on this device and are not backed up.
                record_cap:
                  limit: 200000
                  stored: 199950
                  new_records: 120
    Forbidden:
      description: |
        Cookie mode (`X-Auth-Transport: cookie`) without an allowed `Origin`: the header
        is missing or not one of the cookie-mode origins (the web app's own origins, a
        list separate from the CORS allow-list). Nothing was read or changed (no cookie,
        session or sign-in). See the `auth` tag, CSRF.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                code: forbidden
                message: This request is not allowed from here.
    Internal:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                code: internal
                message: Something went wrong on our side.
    AiLimited:
      description: |
        Too many AI requests. `rate_limited`: the per-minute limit; retry after
        `Retry-After`. `quota_exceeded`: the daily quota is used up; `quota.resets_at` says
        when it resets and `Retry-After` is the seconds until then.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            quota_exceeded:
              value:
                code: quota_exceeded
                message: You've used today's AI requests. You can still add it yourself.
                quota:
                  limit: 10
                  remaining: 0
                  resets_at: '2026-10-10T00:00:00Z'
            rate_limited:
              value:
                code: rate_limited
                message: Too many requests right now. Wait a minute and try again.
    AiUnavailable:
      description: |
        `feature_disabled`: the feature is switched off on the server (kill switch, budget
        cap, or not yet launched); show the non-AI fallback. `unavailable`: no usable
        answer; the user may try again. Either the provider failed or timed out before any
        billed reply (the quota unit is released), or the provider's reply could not be
        parsed or failed the output checks (the provider billed it, so the unit is kept).
        The body is the same in both cases and carries no `quota`; the app reads
        `GET /ai/status` for the remaining quota.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            feature_disabled:
              value:
                code: feature_disabled
                message: This feature isn't available right now. You can enter it yourself instead.
            unavailable:
              summary: Provider failed or timed out; the quota unit is released
              value:
                code: unavailable
                message: Couldn't get an answer just now. Try again.
            unavailable_unusable_reply:
              summary: Billed reply could not be used; the quota unit is kept
              description: |
                The provider answered (and billed the call) but the reply did not parse or
                failed the output checks. Same body as a provider failure; the call still
                counts against the daily quota, so `GET /ai/status` shows one fewer remaining.
              value:
                code: unavailable
                message: Couldn't get an answer just now. Try again.
    AiImageUnavailable:
      description: |
        `feature_disabled`: the feature is switched off on the server (kill switch, budget
        cap, or not yet launched); show the non-AI fallback. `unavailable`: no usable
        answer; the user may try again. Either the provider failed or timed out before any
        billed reply (the quota unit is released), or the provider's reply could not be
        parsed or failed the output checks (the provider billed it, so the unit is kept).
        The body is the same in both cases and carries no `quota`; the app reads
        `GET /ai/status` for the remaining quota.

        The image calls have one more `unavailable` case: the server is busy decoding other
        images (it decodes a few at a time and waits a moment for a turn). The quota unit is
        not taken (the refusal comes before it is reserved), so the call costs nothing, and
        `Retry-After` says how long to wait before retrying. `Retry-After` is set only in
        that busy case.
      headers:
        Retry-After:
          description: How long to wait, in seconds, before retrying because the server is busy decoding images.
          required: false
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            feature_disabled:
              value:
                code: feature_disabled
                message: This feature isn't available right now. You can enter it yourself instead.
            unavailable:
              summary: Provider failed or timed out; the quota unit is released
              value:
                code: unavailable
                message: Couldn't get an answer just now. Try again.
            unavailable_unusable_reply:
              summary: Billed reply could not be used; the quota unit is kept
              description: |
                The provider answered (and billed the call) but the reply did not parse or
                failed the output checks. Same body as a provider failure; the call still
                counts against the daily quota, so `GET /ai/status` shows one fewer remaining.
              value:
                code: unavailable
                message: Couldn't get an answer just now. Try again.
            unavailable_busy:
              summary: Server busy decoding images; the quota unit is not taken; Retry-After is set
              value:
                code: unavailable
                message: Couldn't get an answer just now. Try again.

  schemas:
    # ---------- shared ----------
    Error:
      type: object
      description: The one error shape for every 4xx and 5xx response.
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - token_expired
            - invalid_code
            - not_found
            - rate_limited
            - internal
            - unavailable
            - quota_exceeded
            - feature_disabled
            - account_full
            - forbidden
            - invalid_barcode
            - upstream_unavailable
            - upstream_busy
          description: |
            Stable machine-readable code. `token_expired`: refresh the access token and
            retry. `unauthorized`: sign in again. `invalid_code`: the emailed code is wrong
            or expired. `not_found` (404): the named resource does not exist; today only
            `GET /content/{bundle}` for a bundle not in the manifest, and
            `GET /foods/barcode/{code}` for a barcode Open Food Facts has no usable product
            for. `invalid_barcode` (400, `GET /foods/barcode/{code}` only): the code fails
            the length or GS1 check digit. `upstream_unavailable` and `upstream_busy` (503,
            `GET /foods/barcode/{code}` only): Open Food Facts failed, or the server's own
            limit on calls to it is used up (`Retry-After` is set). `quota_exceeded` (429): the daily AI quota is used up until
            `quota.resets_at`. `feature_disabled` (503): the AI feature is switched off on
            the server; use the non-AI fallback. `account_full` (413, `POST /sync` only):
            the push would take the account over its record cap; nothing was applied (see
            `record_cap`). `forbidden` (403, `/auth/*` cookie mode only): the request's
            `Origin` is missing or not a cookie-mode origin. Clients treat an unknown code
            like `internal`.
        message:
          type: string
          description: Plain-language message safe to show the user. Never contains health data.
        details:
          type: array
          description: Per-field problems, for `invalid_request`.
          items:
            type: object
            required: [field, issue]
            properties:
              field:
                type: string
                description: JSON path of the offending field; empty when the problem is the whole body (`too_large`).
              issue:
                type: string
        quota:
          $ref: '#/components/schemas/AiQuota'
          description: The daily AI quota, present only with `quota_exceeded`.
        record_cap:
          $ref: '#/components/schemas/RecordCap'
          description: The account's record cap, present only with `account_full`.

    RecordCap:
      type: object
      description: |
        Why a push was refused with `account_full`: `stored + new_records` is over
        `limit`. See `POST /sync`, Account record cap.
      required: [limit, stored, new_records]
      properties:
        limit:
          type: integer
          minimum: 1
          description: |
            The most records one account may store, across all synced tables, tombstones
            included. Server configuration; the app never hard-codes it.
        stored:
          type: integer
          minimum: 0
          description: Records the account stores now, tombstones included.
        new_records:
          type: integer
          minimum: 1
          description: |
            New records in the refused push: ids the server does not store in that table
            for this account (see `POST /sync`, Account record cap).

    LocalDate:
      type: string
      format: date
      description: Calendar day in the user's local time, `YYYY-MM-DD`.
      examples: ['2026-10-08']

    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 date-time in UTC with a `Z` suffix.
      examples: ['2026-10-08T06:30:00Z']

    # ---------- auth ----------
    GoogleSignInRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: Google ID token from Google Sign-In on the device.

    EmailStartRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    EmailStartResponse:
      type: object
      required: [code_expires_at, resend_after_seconds]
      properties:
        code_expires_at:
          $ref: '#/components/schemas/Timestamp'
        resend_after_seconds:
          type: integer
          minimum: 0
          description: Seconds before another code can be requested for this address.

    EmailVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          pattern: '^[0-9]{6}$'

    RefreshRequest:
      type: object
      description: |
        Body mode (native apps): `refresh_token` is required, and a request without it
        is 400 `invalid_request`. Cookie mode (`X-Auth-Transport: cookie`, the web app):
        send `{}`. The token comes from the cookie, and a body that carries
        `refresh_token` is 400 `invalid_request`.
      properties:
        refresh_token:
          type: string
          description: The current refresh token. Body mode only.

    TokenPair:
      type: object
      required:
        - token_type
        - access_token
        - access_token_expires_at
        - refresh_token
        - refresh_token_expires_at
        - user
        - new_user
      properties:
        token_type:
          type: string
          const: Bearer
        access_token:
          type: string
          description: "JWT, short-lived (target 15 minutes). Send as `Authorization: Bearer <token>`."
        access_token_expires_at:
          $ref: '#/components/schemas/Timestamp'
        refresh_token:
          type: string
          description: |
            Opaque, single-use. Store in secure storage; replace on every refresh.
            Cookie mode (`X-Auth-Transport: cookie`, the web app): always the empty
            string. The token is only in the httpOnly `__Secure-pb_refresh` cookie (see
            the `auth` tag). The field stays required so both modes share one shape.
            Lifetime 90 days, extended on rotation: every `/auth/refresh` returns a new
            refresh token valid for 90 days from that refresh, so a device that opens the
            app at least once every 90 days stays signed in. Presenting an already-rotated
            token revokes the whole session, except for a retry within 60 seconds of the
            rotation while the newer token has never been presented (see `/auth/refresh`).
        refresh_token_expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the refresh token expires (in body or cookie), 90 days after it was issued.
        user:
          $ref: '#/components/schemas/User'
        new_user:
          type: boolean
          description: True when this sign-in created the account.

    User:
      type: object
      required: [id, email, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Also the UUIDv5 namespace for deterministic sync record ids.
        email:
          type: [string, 'null']
          format: email
        created_at:
          $ref: '#/components/schemas/Timestamp'

    # ---------- health ----------
    Health:
      type: object
      required: [status]
      description: |
        Liveness only. The body does not carry the deployed build version (or any other
        build or host detail), so an unauthenticated caller cannot fingerprint the build.
      properties:
        status:
          type: string
          const: ok

    # ---------- content ----------
    ContentBundleName:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,63}$'
      description: |
        A bundle name: the file name of `content/<name>.json` without `.json`, such as
        `exercises`, `cards`, `recipes`, `foods` or `meal-planning`. New bundles may appear;
        the app ignores names it does not know.
      examples: [measures]

    ContentManifest:
      type: object
      required: [bundles]
      properties:
        bundles:
          type: array
          description: Every bundle the server serves, sorted by `name`, each name once.
          items:
            $ref: '#/components/schemas/ContentBundleInfo'

    ContentBundleInfo:
      type: object
      required: [name, schema_version, sha256, size_bytes, updated_at]
      properties:
        name:
          $ref: '#/components/schemas/ContentBundleName'
        schema_version:
          type: integer
          minimum: 1
          description: |
            The bundle's top-level `schema_version`. It changes only when the bundle's shape
            changes. The app applies a bundle only when it supports this version.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            Lowercase hex SHA-256 of the bundle's exact bytes. This is the bundle's version
            and its `ETag` (in double quotes).
        size_bytes:
          type: integer
          minimum: 1
          description: Length of the uncompressed bundle body in bytes.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: |
            When the bundle's content last changed. It is the committer date from
            `git log -1 --format=%cI -- content/<name>.json` on a full-history checkout of
            `main`, in UTC. The backend gets it as a build argument. A build without it
            fails, and there is no fallback to build time. See "`updated_at` derivation"
            in the `content` tag. An app build and a server deploy of the same content
            agree on it, and it changes only when `sha256` changes.

    ContentBundle:
      type: object
      required: [schema_version]
      additionalProperties: true
      description: |
        A content bundle, exactly as `content/<name>.json` holds it. The shape of each
        bundle is owned by `content/` and checked by the validators in `tools/`, not by this
        contract; every bundle has a top-level `schema_version`.
      properties:
        schema_version:
          type: integer
          minimum: 1

    # ---------- foods ----------
    FoodPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Food'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page; null on the last page.

    Food:
      type: object
      description: |
        A shared food. Values are per serving, as in the prototype; carbs include fibre.
      required:
        - id
        - name
        - name_hi
        - aliases
        - serving
        - per_serving
        - fruit_veg_servings
        - source
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Rice, cooked]
        name_hi:
          type: [string, 'null']
          description: Everyday Hindi name, when it differs from `name`.
        aliases:
          type: array
          description: Other names matched by search (Hindi, regional and common spellings).
          items:
            type: string
        serving:
          $ref: '#/components/schemas/Serving'
        per_serving:
          $ref: '#/components/schemas/Nutrients'
        fruit_veg_servings:
          type: number
          minimum: 0
          description: Fruit and vegetable servings (80 g each) in one serving.
        source:
          $ref: '#/components/schemas/FoodSource'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    Serving:
      type: object
      required: [label, grams]
      properties:
        label:
          type: string
          description: 'Serving as shown to the user. Prototype: `unit`.'
          examples: ['1 katori (35 g dal)', '100 g', '1 glass (250 ml)']
        grams:
          type: [number, 'null']
          exclusiveMinimum: 0
          description: |
            Grams in the serving label, enabling grams logging (qty = grams / this value).
            Null when the label has no gram weight.

    Nutrients:
      type: object
      required: [kcal, protein_g, carbs_g, fibre_g, added_sugar_g, fat_g]
      properties:
        kcal:
          type: number
          minimum: 0
        protein_g:
          type: number
          minimum: 0
        carbs_g:
          type: number
          minimum: 0
          description: Total carbohydrate including fibre.
        fibre_g:
          type: [number, 'null']
          minimum: 0
          description: Null when unknown.
        added_sugar_g:
          type: [number, 'null']
          minimum: 0
          description: Null when unknown.
        fat_g:
          type: number
          minimum: 0

    FoodSource:
      type: object
      description: |
        Where a row's values come from. Only the sources listed in ADR 005
        (`docs/adr/005-food-data-sources-own-estimates.md`) are allowed, plus Open Food
        Facts for barcode lookups only (ADR 009).
      required: [code, name, licence, url, reference]
      properties:
        code:
          type: string
          enum: [usda_fdc, fssai, own_recipe, kitchen_test, label_typical, own_estimate, open_food_facts]
          description: |
            `usda_fdc`: USDA FoodData Central. `fssai`: values derived from FSSAI standards
            (paneer, curd, milk). `own_recipe`: calculated from our recipes. `kitchen_test`:
            weighed in our kitchen tests. `label_typical`: packaged foods using typical
            nutrition-label values across common brands; in the prototype these are whey
            protein, Greek yogurt and makhana. `own_estimate`: our own rough estimate, not
            weighed or cooked to a recipe (for example restaurant dishes). `open_food_facts`:
            a community-contributed product from Open Food Facts (ODbL 1.0 / DbCL 1.0, ADR
            009); only `GET /foods/barcode/{code}` returns it, never `/foods` or `content/`.
        name:
          type: string
          examples: [USDA FoodData Central (SR Legacy), Typical label values (packaged food)]
        licence:
          type: string
          examples: [Public domain (CC0 1.0), Nutrition facts read from product labels; no label database copied]
        url:
          type: [string, 'null']
          format: uri
        reference:
          type: [string, 'null']
          description: Identifier in the source, such as a USDA FDC id.

    Barcode:
      type: string
      description: |
        Digits of a barcode: 8 (EAN-8), 12 (UPC-A) or 13 (EAN-13) with a valid
        GS1 mod-10 check digit. The pattern checks length and digits only; the check digit
        is checked separately (`test-vectors/barcode-gs1.json`).
      pattern: '^([0-9]{8}|[0-9]{12,13})$'
      examples: ['8901491101837']

    OffNutriments:
      type: object
      description: |
        The only nutriment keys the server returns, numbers as Open Food Facts gives them
        (the key names are Open Food Facts', so hyphens stay). Energy `-kcal_` is kilocalories
        and `-kj_` is kilojoules; the rest are grams, and `_100g` is per 100 g (or 100 ml)
        while `_serving` is per serving. A key is absent when Open Food Facts has no value,
        so absence is not zero. `sugars` (total sugars) and bare `energy` (kilojoules) are
        deliberately not here.
      additionalProperties: false
      properties:
        energy-kcal_100g: { type: number, minimum: 0 }
        energy-kj_100g: { type: number, minimum: 0 }
        proteins_100g: { type: number, minimum: 0 }
        carbohydrates_100g: { type: number, minimum: 0 }
        fat_100g: { type: number, minimum: 0 }
        fiber_100g: { type: number, minimum: 0 }
        added-sugars_100g: { type: number, minimum: 0 }
        energy-kcal_serving: { type: number, minimum: 0 }
        energy-kj_serving: { type: number, minimum: 0 }
        proteins_serving: { type: number, minimum: 0 }
        carbohydrates_serving: { type: number, minimum: 0 }
        fat_serving: { type: number, minimum: 0 }
        fiber_serving: { type: number, minimum: 0 }
        added-sugars_serving: { type: number, minimum: 0 }

    OffProduct:
      type: object
      description: |
        A trimmed subset of an Open Food Facts product (ADR 009). Community data, unchecked.
        Text is untrusted: show it as text, never interpret it.

        `code` is always the code from the request path, unchanged (Open Food Facts may
        store a UPC-A as 13 digits with a leading 0; the server does not pass that
        through), so the app can save it as `UserFood.barcode` and find it again locally.

        Field names are this contract's, not Open Food Facts': `name` (OFF `product_name`),
        `brands`, `quantity`, `serving_size`, `serving_quantity` (grams or millilitres),
        `nutrition_data_per`, `nutriments`, `completeness`, `states_tags`,
        `data_quality_errors_tags`, `countries_tags`, and `last_modified_at` (OFF
        `last_modified_t` converted to ISO 8601 UTC). Only the `nutriments` keys keep OFF's
        own names.
      additionalProperties: false
      required:
        - code
        - name
        - brands
        - quantity
        - serving_size
        - serving_quantity
        - nutrition_data_per
        - nutriments
        - completeness
        - states_tags
        - data_quality_errors_tags
        - countries_tags
        - last_modified_at
        - source
      properties:
        code:
          $ref: '#/components/schemas/Barcode'
        name:
          type: [string, 'null']
          maxLength: 200
          description: Product name; null or empty when Open Food Facts has none (the user types one).
        brands:
          type: [string, 'null']
          maxLength: 200
          description: Comma-separated brands as Open Food Facts gives them.
        quantity:
          type: [string, 'null']
          maxLength: 100
          description: Pack size as printed, e.g. "50g" or "1 l".
        serving_size:
          type: [string, 'null']
          maxLength: 100
          description: Serving as printed, e.g. "1 bar (45 g)".
        serving_quantity:
          type: [number, 'null']
          exclusiveMinimum: 0
          description: Serving size in grams (or millilitres for drinks); null when unknown.
        nutrition_data_per:
          type: [string, 'null']
          enum: [100g, serving, null]
          description: What the pack's own nutrition table is printed per. The `_100g` values are present either way.
        nutriments:
          $ref: '#/components/schemas/OffNutriments'
        completeness:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Open Food Facts' own completeness score of the entry.
        states_tags:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 100 }
          description: Open Food Facts state tags, e.g. `en:nutrition-facts-completed`.
        data_quality_errors_tags:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 100 }
          description: Open Food Facts data quality error tags; non-empty means the entry has known problems.
        countries_tags:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 100 }
          description: Countries the product is sold in, e.g. `en:india`.
        last_modified_at:
          type: [string, 'null']
          format: date-time
          description: When the entry was last edited upstream. Open Food Facts sends epoch seconds (`last_modified_t`); the server converts.
        source:
          $ref: '#/components/schemas/FoodSource'

    # ---------- sync envelope ----------
    SyncRequest:
      type: object
      required: [cursor, changes]
      properties:
        cursor:
          type: [string, 'null']
          description: Opaque cursor from the last successful sync; null on first sync.
        changes:
          $ref: '#/components/schemas/SyncChanges'

    SyncResponse:
      type: object
      required: [cursor, has_more, applied, conflicts, changes]
      properties:
        cursor:
          type: string
          description: Opaque; store it and send it with the next sync.
        has_more:
          type: boolean
          description: True when more server changes are waiting; sync again with `cursor`.
        applied:
          type: array
          description: Pushed records the server stored, with their new versions.
          items:
            $ref: '#/components/schemas/AppliedRecord'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/SyncConflict'
        changes:
          $ref: '#/components/schemas/SyncChanges'

    SyncTable:
      type: string
      enum:
        - profiles
        - consents
        - food_logs
        - water_logs
        - day_notes
        - workouts
        - workout_sets
        - lift_stats
        - weights
        - measurements
        - user_foods
        - recipes
        - kitchen_tests
        - exclusions
        - swaps
        - settings

    AppliedRecord:
      type: object
      required: [table, id, version]
      properties:
        table:
          $ref: '#/components/schemas/SyncTable'
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1

    SyncConflict:
      type: object
      required: [table, id, client_version, server_version, resolution, server_record]
      properties:
        table:
          $ref: '#/components/schemas/SyncTable'
        id:
          type: string
          format: uuid
        client_version:
          type: integer
          minimum: 0
          description: The version the device sent.
        server_version:
          type: integer
          minimum: 1
          description: The version stored on the server after resolution.
        resolution:
          type: string
          enum: [client_won, server_won]
          description: |
            `client_won`: the device's edit was newer and is now stored. `server_won`: the
            server's copy was newer and the device's edit was not applied. Either way the
            losing copy is kept in the server's conflict log, except for idempotent retries
            (see `POST /sync`), which are not logged. The log is bounded (newest 1,000
            entries, older than 90 days dropped; see `POST /sync`).
        server_record:
          $ref: '#/components/schemas/SyncRecord'
        replaced_record:
          $ref: '#/components/schemas/SyncRecord'
          description: |
            Only on `client_won`: the server's copy that the device's edit replaced, exactly
            as it was stored (`version` = `server_version` - 1, `deleted_at` set if it was a
            tombstone). It is the copy the conflict log keeps for this conflict
            (`ConflictLogEntry.record` with `loser: server`). Absent on `server_won`,
            idempotent retries included. Same record schema and bounds as `server_record`
            (`maxLength`, `maxItems`, `maxProperties`, `x-max-json-bytes`); pick the schema
            by `table`. Optional: servers built against contract 0.1.19 or earlier never
            send it (see `POST /sync`, Replaced record).

    SyncChanges:
      type: object
      description: Changed records grouped by table. Omit tables with no changes.
      additionalProperties: false
      properties:
        profiles:
          type: array
          items: { $ref: '#/components/schemas/Profile' }
        consents:
          type: array
          items: { $ref: '#/components/schemas/Consent' }
        food_logs:
          type: array
          items: { $ref: '#/components/schemas/FoodLog' }
        water_logs:
          type: array
          items: { $ref: '#/components/schemas/WaterLog' }
        day_notes:
          type: array
          items: { $ref: '#/components/schemas/DayNote' }
        workouts:
          type: array
          items: { $ref: '#/components/schemas/Workout' }
        workout_sets:
          type: array
          items: { $ref: '#/components/schemas/WorkoutSet' }
        lift_stats:
          type: array
          items: { $ref: '#/components/schemas/LiftStat' }
        weights:
          type: array
          items: { $ref: '#/components/schemas/Weight' }
        measurements:
          type: array
          items: { $ref: '#/components/schemas/Measurement' }
        user_foods:
          type: array
          items: { $ref: '#/components/schemas/UserFood' }
        recipes:
          type: array
          items: { $ref: '#/components/schemas/Recipe' }
        kitchen_tests:
          type: array
          items: { $ref: '#/components/schemas/KitchenTest' }
        exclusions:
          type: array
          items: { $ref: '#/components/schemas/Exclusion' }
        swaps:
          type: array
          items: { $ref: '#/components/schemas/Swap' }
        settings:
          type: array
          items: { $ref: '#/components/schemas/Settings' }

    SyncRecord:
      description: |
        Any synced record. Several record schemas can match the same object, so pick the
        schema by the conflict's `table` rather than by validating against each.
      anyOf:
        - $ref: '#/components/schemas/Profile'
        - $ref: '#/components/schemas/Consent'
        - $ref: '#/components/schemas/FoodLog'
        - $ref: '#/components/schemas/WaterLog'
        - $ref: '#/components/schemas/DayNote'
        - $ref: '#/components/schemas/Workout'
        - $ref: '#/components/schemas/WorkoutSet'
        - $ref: '#/components/schemas/LiftStat'
        - $ref: '#/components/schemas/Weight'
        - $ref: '#/components/schemas/Measurement'
        - $ref: '#/components/schemas/UserFood'
        - $ref: '#/components/schemas/Recipe'
        - $ref: '#/components/schemas/KitchenTest'
        - $ref: '#/components/schemas/Exclusion'
        - $ref: '#/components/schemas/Swap'
        - $ref: '#/components/schemas/Settings'

    SyncMeta:
      type: object
      description: Fields every synced record carries.
      required: [id, version, updated_at, deleted_at]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Made on the device. Random UUIDv4, or UUIDv5 for natural-key tables
            (encoding under `POST /sync`, Record ids).
        version:
          type: integer
          minimum: 0
          description: |
            On push: the server version the device last saw (0 if never synced).
            On pull: the stored server version.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the record was last edited on a device. Decides conflicts.
        deleted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: Set when deleted (tombstone); null otherwise.

    # ---------- account ----------
    MeExport:
      type: object
      description: Everything the server stores for one user (`GET /me/export`).
      required: [format_version, exported_at, user, tables, conflict_log]
      properties:
        format_version:
          type: integer
          const: 1
          description: |
            Version of this export layout. Adding a table or a field keeps it at 1; it
            changes only if existing content moves or changes meaning.
        exported_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the server built the export.
        user:
          $ref: '#/components/schemas/User'
        tables:
          $ref: '#/components/schemas/ExportTables'
        conflict_log:
          type: array
          description: |
            Losing copies the server kept when resolving `/sync` conflicts (see
            `SyncConflict.resolution`), oldest first. Empty when there were none. Bounded:
            the newest 1,000 entries, with entries older than 90 days dropped when a later
            conflict is logged (see `POST /sync`), so earlier conflicts may be absent.
          items:
            $ref: '#/components/schemas/ConflictLogEntry'

    ExportTables:
      type: object
      description: |
        Every synced table (one key per `SyncTable` value) with all of the user's stored
        rows, tombstones included. Same record schemas as `SyncChanges`, but every table
        is present, as an empty array when the user has no rows.
      additionalProperties: false
      required: [profiles, consents, food_logs, water_logs, day_notes, workouts, workout_sets, lift_stats, weights, measurements, user_foods, recipes, kitchen_tests, exclusions, swaps, settings]
      properties:
        profiles:
          type: array
          items: { $ref: '#/components/schemas/Profile' }
        consents:
          type: array
          items: { $ref: '#/components/schemas/Consent' }
        food_logs:
          type: array
          items: { $ref: '#/components/schemas/FoodLog' }
        water_logs:
          type: array
          items: { $ref: '#/components/schemas/WaterLog' }
        day_notes:
          type: array
          items: { $ref: '#/components/schemas/DayNote' }
        workouts:
          type: array
          items: { $ref: '#/components/schemas/Workout' }
        workout_sets:
          type: array
          items: { $ref: '#/components/schemas/WorkoutSet' }
        lift_stats:
          type: array
          items: { $ref: '#/components/schemas/LiftStat' }
        weights:
          type: array
          items: { $ref: '#/components/schemas/Weight' }
        measurements:
          type: array
          items: { $ref: '#/components/schemas/Measurement' }
        user_foods:
          type: array
          items: { $ref: '#/components/schemas/UserFood' }
        recipes:
          type: array
          items: { $ref: '#/components/schemas/Recipe' }
        kitchen_tests:
          type: array
          items: { $ref: '#/components/schemas/KitchenTest' }
        exclusions:
          type: array
          items: { $ref: '#/components/schemas/Exclusion' }
        swaps:
          type: array
          items: { $ref: '#/components/schemas/Swap' }
        settings:
          type: array
          items: { $ref: '#/components/schemas/Settings' }

    ConflictLogEntry:
      type: object
      required: [table, id, loser, winner_version, logged_at, record]
      properties:
        table:
          $ref: '#/components/schemas/SyncTable'
        id:
          type: string
          format: uuid
          description: Id of the record the losing copy belongs to.
        loser:
          type: string
          enum: [client, server]
          description: |
            Which side's copy lost: `client` when the conflict resolved `server_won`,
            `server` when it resolved `client_won`.
        winner_version:
          type: integer
          minimum: 1
          description: The record's version stored after resolution (`SyncConflict.server_version`).
        logged_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the server resolved the conflict.
        record:
          $ref: '#/components/schemas/SyncRecord'
          description: |
            The losing copy as it was pushed or stored; its `version` is the losing copy's
            (for the client, the version it sent). Pick its schema by `table`.

    # ---------- ai ----------
    AiQuota:
      type: object
      description: The user's shared daily AI quota after this call (see the `ai` tag).
      required: [limit, remaining, resets_at]
      properties:
        limit:
          type: integer
          minimum: 0
          description: Calls allowed per UTC day across all AI endpoints (default 10).
        remaining:
          type: integer
          minimum: 0
          description: Calls left today.
        resets_at:
          $ref: '#/components/schemas/Timestamp'
          description: Next 00:00:00Z, when `remaining` goes back to `limit`.

    AiStatus:
      type: object
      required: [features, quota]
      properties:
        features:
          type: object
          description: True when the feature is switched on. Unknown keys are ignored by the app.
          required: [describe_meal, ask_why, weekly_summary]
          properties:
            describe_meal:
              type: boolean
            ask_why:
              type: boolean
            weekly_summary:
              type: boolean
            suggest_tags:
              type: boolean
              description: Custom exercise tag suggestion. Optional, so a server that does not send it has the feature off.
            meal_photo:
              type: boolean
              description: Meal photo (`POST /ai/meal-photo`). Optional, so a server that does not send it has the feature off.
            import_recipe:
              type: boolean
              description: Recipe import (`POST /ai/import-recipe`). Optional, so a server that does not send it has the feature off.
            form_check:
              type: boolean
              description: Form check (`POST /ai/form-check`). Optional, so a server that does not send it has the feature off.
        quota:
          $ref: '#/components/schemas/AiQuota'

    DescribeMealRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '[^\t-\r \u0085\u00A0\u1680\u2000-\u200D\u2028\u2029\u202F\u205F\u2060\u3000\uFEFF]'
          description: |
            What the user ate, in their own words, with rough amounts if known. Must not be
            blank (see the wire conventions). Prototype: the Describe it textarea.

    DescribeMealResponse:
      type: object
      required: [items, quota]
      properties:
        items:
          type: array
          maxItems: 30
          description: One entry per food identified, in the order described; empty when none.
          items:
            $ref: '#/components/schemas/MealEstimateItem'
        quota:
          $ref: '#/components/schemas/AiQuota'

    MealEstimateItem:
      type: object
      description: 'One estimated item. Prototype: `FS.est[]` (`protein`, `carbs`, `fat`).'
      required: [name, qty, kcal, protein_g, carbs_g, fat_g]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        qty:
          type: string
          maxLength: 50
          description: The quantity estimated, in words (for example "2 medium"); may be empty.
        kcal:
          type: number
          minimum: 0
          maximum: 5000
        protein_g:
          type: number
          minimum: 0
          maximum: 1000
        carbs_g:
          type: number
          minimum: 0
          maximum: 1000
          description: Total carbohydrate including fibre.
        fat_g:
          type: number
          minimum: 0
          maximum: 1000

    AskWhyRequest:
      type: object
      additionalProperties: false
      required: [card_id, question]
      properties:
        card_id:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          maxLength: 40
          description: |
            Id of the card the user is reading, from `content/cards.json` (for example
            `protein`, `scale`). Prototype: `WHY.id`.
        question:
          type: string
          minLength: 1
          maxLength: 300
          pattern: '[^\t-\r \u0085\u00A0\u1680\u2000-\u200D\u2028\u2029\u202F\u205F\u2060\u3000\uFEFF]'
          description: 'The follow-up question. Must not be blank (see the wire conventions). Prototype: `#askQ`.'

    AskWhyResponse:
      type: object
      required: [answer, card_id, quota]
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 1200
          description: Two to four plain sentences, grounded only on the cards; never contains `{` or `}`.
        card_id:
          type: [string, 'null']
          description: The card the answer is based on, or null when the cards don't cover the question.
        quota:
          $ref: '#/components/schemas/AiQuota'

    SuggestTagsRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '[^\t-\r \u0085\u00A0\u1680\u2000-\u200D\u2028\u2029\u202F\u205F\u2060\u3000\uFEFF]'
          description: |
            The exercise name as the user typed it, trimmed by the app (the app's name limit,
            200 characters). Must not be blank (see the wire conventions). This is the one place a
            custom exercise's typed name leaves the device, and only when the user has turned
            AI on; Weekly summary still sends `custom exercise` instead.

    SuggestTagsResponse:
      type: object
      required: [pattern, equipment, difficulty, primary, secondary, joints, quota]
      properties:
        pattern:
          type: string
          maxLength: 50
        equipment:
          type: string
          enum: [barbell, dumbbell, machine, cable, bodyweight]
        difficulty:
          type: integer
          minimum: 1
          maximum: 3
        primary:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Muscle' }
        secondary:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Muscle' }
        joints:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
        quota:
          $ref: '#/components/schemas/AiQuota'

    WeeklySummaryRequest:
      type: object
      additionalProperties: false
      description: |
        The weekly check-in's facts. Prototype: `S.ciData` from `renderCheckin()`. In the
        app, build it from `weeklyCheckin()` in `packages/core` (`WeeklyCheckin`) and the
        settings targets; each field names its source.
      required:
        - sessions
        - planned_sessions
        - logged_days
        - avg_kcal
        - avg_protein_g
        - protein_days
        - weight_avg_kg
        - prev_weight_avg_kg
        - improved
        - stalled
        - burn_kcal
        - target_kcal
        - target_protein_g
        - goal
      properties:
        sessions:
          type: integer
          minimum: 0
          maximum: 7
          description: 'Days trained this week. Prototype and core: `sessions`.'
        planned_sessions:
          type: integer
          minimum: 1
          maximum: 7
          description: 'Sessions planned this week. Prototype and core: `plannedN`.'
        logged_days:
          type: integer
          minimum: 0
          maximum: 7
          description: 'Days with food logged, of 7. Prototype and core: `logged`.'
        avg_kcal:
          type: number
          minimum: 0
          maximum: 20000
          description: 'Average kcal over days with food logged (0 with none). Prototype and core: `avgK`.'
        avg_protein_g:
          type: number
          minimum: 0
          maximum: 1000
          description: 'Average protein over days with food logged (0 with none). Prototype and core: `avgP`.'
        protein_days:
          type: integer
          minimum: 0
          maximum: 7
          description: 'Days at 90% of the protein target or more. Prototype and core: `pDays`.'
        weight_avg_kg:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 400
          description: "This week's average weight, null if unknown. Prototype and core: `w1`."
        prev_weight_avg_kg:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 400
          description: "Last week's average weight, null if unknown. Prototype and core: `w0`."
        improved:
          type: array
          maxItems: 3
          description: |
            Lifts that beat their previous best this week, best first. Prototype and core:
            `improved` (`n`, `pct`); core's exercise name `n` becomes `exercise` after the
            app swaps custom exercise names for `custom exercise`.
          items:
            type: object
            additionalProperties: false
            required: [exercise, pct]
            properties:
              exercise:
                $ref: '#/components/schemas/SummaryExercise'
              pct:
                type: integer
                minimum: 1
                maximum: 1000
                description: Gain over the previous best, in percent.
        stalled:
          type: array
          maxItems: 3
          description: 'Stalled lifts. Prototype and core: `stalled`.'
          items:
            $ref: '#/components/schemas/SummaryExercise'
        burn_kcal:
          type: [integer, 'null']
          minimum: 0
          maximum: 20000
          description: |
            Daily calorie burn from real data, null when there is not enough data.
            Prototype: `burn` (`ab.ready ? ab.burn : null`); core: `burn.ready ? burn.burn : null`.
        target_kcal:
          type: integer
          minimum: 0
          maximum: 20000
          description: 'Daily calorie target. Prototype: `target` (`S.settings.kcal`).'
        target_protein_g:
          type: integer
          minimum: 0
          maximum: 1000
          description: 'Daily protein target. Prototype: `ptarget` (`S.settings.protein`).'
        goal:
          type: [string, 'null']
          enum: [lose, recomp, maintain, gain, null]
          description: "The profile's goal, null with no profile. Prototype: `goal`."

    SummaryExercise:
      type: string
      minLength: 1
      maxLength: 80
      description: |
        A catalogue exercise id (a key of `content/exercises.json` `tags`, for example
        `Goblet Squat`) or the fixed label `custom exercise` for any custom exercise. The
        app never sends a custom exercise's user-typed name in this call (only Suggest tags does); the server sends any value
        that is not a catalogue id to the provider as `custom exercise`.
      examples: [Goblet Squat, custom exercise]

    WeeklySummaryResponse:
      type: object
      required: [text, quota]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1200
          description: Three plain sentences; no headings, lists or emojis.
        quota:
          $ref: '#/components/schemas/AiQuota'

    AiImage:
      type: object
      additionalProperties: false
      description: |
        One photo sent to an AI image call, base64 in the JSON body (see the `ai` tag,
        Images, for why and for the type, size and metadata rules). Up to 1,200,000 decoded
        bytes and 4,096 px a side. The app sends the re-encoded, resized copy it shows the
        user, never the original file.
      required: [media_type, data]
      properties:
        media_type:
          type: string
          enum: [image/jpeg, image/png]
        data:
          type: string
          contentEncoding: base64
          minLength: 4
          maxLength: 1600000
          pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
          description: |
            The image bytes, standard base64 with padding (a multiple of 4 characters), no line
            breaks, no `data:` prefix.
            1,600,000 characters is 1,200,000 bytes.

    AiFrame:
      type: object
      additionalProperties: false
      description: |
        One still frame of a form check: the same shape as `AiImage` but at most 350,000
        decoded bytes and 640 px a side (so four frames fit under the 2 MB body limit and
        in memory; the server decodes one at a time). The prototype cuts frames at 640 px,
        JPEG quality 0.75.
      required: [media_type, data]
      properties:
        media_type:
          type: string
          enum: [image/jpeg, image/png]
        data:
          type: string
          contentEncoding: base64
          minLength: 4
          maxLength: 466668
          pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
          description: Standard base64 with padding, a multiple of 4 characters. 466,668 characters is 350,000 bytes.

    MealPhotoRequest:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          $ref: '#/components/schemas/AiImage'
        hint:
          type: string
          minLength: 1
          maxLength: 300
          pattern: '[^\t-\r \u0085\u00A0\u1680\u2000-\u200D\u2028\u2029\u202F\u205F\u2060\u3000\uFEFF]'
          description: |
            What the photo cannot show (hidden oil or ghee, a count). Optional; when sent it
            must not be blank (see the wire conventions), so the app leaves it out when empty.
            Prototype: `#phHint`.

    MealPhotoResponse:
      type: object
      required: [not_food, items, quota]
      properties:
        not_food:
          type: boolean
          description: 'True when the photo shows no food; `items` is then empty. Prototype: `notFood`.'
        items:
          type: array
          maxItems: 12
          description: One entry per distinct food or drink visible; empty when none.
          items:
            $ref: '#/components/schemas/MealPhotoItem'
        quota:
          $ref: '#/components/schemas/AiQuota'

    MealPhotoItem:
      description: |
        A `MealEstimateItem` (`qty` is the portion judged from the plate), how sure the model is, and
        the built-in food it matched, if any.
      allOf:
        - $ref: '#/components/schemas/MealEstimateItem'
        - type: object
          required: [confidence]
          properties:
            confidence:
              type: string
              enum: [high, medium, low]
              description: 'Prototype: `confidence`. The app marks `low` as unsure.'
            match:
              type: [string, 'null']
              maxLength: 200
              description: |
                The exact `name` of a built-in food in `content/foods.json` that this item is,
                or null when none fits (the server checks it and sends null otherwise). Optional,
                so a server that does not send it means null. Prototype: `match`.
            servings:
              type: number
              minimum: 0.25
              maximum: 6
              description: |
                How many of the matched food's serving size are shown; 1 when `match` is null.
                Optional, read as 1 when absent. Prototype: `servings`, clamped to 0.25 to 6.

    ImportRecipeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Send `text`, `image` or both; a body with neither is 400 `invalid_request`.
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 6000
          pattern: '[^\t-\r \u0085\u00A0\u1680\u2000-\u200D\u2028\u2029\u202F\u205F\u2060\u3000\uFEFF]'
          description: 'The recipe as pasted. Must not be blank (see the wire conventions). Prototype: `#impTxt`, cut at 6,000 characters.'
        image:
          $ref: '#/components/schemas/AiImage'

    ImportRecipeResponse:
      type: object
      description: |
        A draft for the recipe builder, not a saved `Recipe`: the fields the builder needs,
        in the same units, with no id, version or timestamps.
      required: [name, katoris, ingredients, steps, unmatched, quota]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The recipe's title; the server uses "Imported recipe" when the model gives none.
        katoris:
          type: number
          exclusiveMinimum: 0
          maximum: 1000
          description: Katoris (150 g cooked each) the whole recipe makes, as `Recipe.katoris`; the server uses 4 when the model gives none (as the prototype does).
        ingredients:
          type: array
          maxItems: 100
          description: Matched ingredients, in grams (`unit` is always `g`); empty when none matched.
          items:
            allOf:
              - $ref: '#/components/schemas/Ingredient'
              - type: object
                properties:
                  unit:
                    const: g
        steps:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 500
        unmatched:
          type: array
          maxItems: 100
          description: Ingredients as written that could not be matched, for the user to add by hand.
          items:
            type: string
            maxLength: 200
        quota:
          $ref: '#/components/schemas/AiQuota'

    FormCheckRequest:
      type: object
      additionalProperties: false
      required: [exercise, frames]
      properties:
        exercise:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            A key of `content/exercises.json` `cards` (for example `Goblet Squat`); anything
            else is 400 with `details[].field` = `exercise`. A custom exercise has no cues, so
            the app does not offer the check for it.
        frames:
          type: array
          minItems: 2
          maxItems: 4
          description: Still frames in the order they occur in the set. The video itself never leaves the phone.
          items:
            $ref: '#/components/schemas/AiFrame'

    FormCheckResponse:
      type: object
      required: [visible, checks, summary, quota]
      properties:
        visible:
          type: boolean
          description: False when the user's body was not clearly in frame; `checks` is then empty.
        checks:
          type: array
          maxItems: 10
          items:
            type: object
            required: [cue, status, note]
            properties:
              cue:
                type: string
                maxLength: 200
                description: One of the exercise card's `key_cues`, verbatim.
              status:
                type: string
                enum: [good, watch, unclear]
                description: '`unclear` when the angle or quality does not let the model tell.'
              note:
                type: string
                maxLength: 300
                description: A specific, kind remark; may be empty.
        summary:
          type: string
          maxLength: 600
          description: One short overall remark; may be empty. Never a diagnosis.
        quota:
          $ref: '#/components/schemas/AiQuota'

    # ---------- sync tables ----------
    Profile:
      description: |
        Setup answers and targets. One per user; id = UUIDv5(`profiles:me`).
        Prototype: `settings.profile` plus target fields in `settings`.
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [sex, age, height_cm, weight_kg, activity, where, days, exp, minutes, goal, pace, special, screen, created, cleared, targets]
          properties:
            sex:
              type: string
              enum: [male, female]
            age:
              type: integer
              minimum: 18
              maximum: 90
            height_cm:
              type: number
              exclusiveMinimum: 0
              description: 'Prototype: `height`.'
            weight_kg:
              type: number
              exclusiveMinimum: 0
              description: 'Weight at setup. Prototype: `weight`.'
            activity:
              type: string
              enum: [sitting, light, feet, physical]
            where:
              type: string
              enum: [gym, dumbbells, bodyweight]
            days:
              type: integer
              minimum: 0
              maximum: 7
              description: Training days per week; 0 means no plan.
            exp:
              type: [string, 'null']
              enum: [new, some, exp, null]
              description: Training experience; null when `days` is 0.
            minutes:
              type: [integer, 'null']
              enum: [30, 45, 60, 75, 90, null]
              description: Session length; null when `days` is 0.
            goal:
              type: string
              enum: [lose, recomp, maintain, gain]
            pace:
              type: string
              enum: [gentle, moderate]
            special:
              type: string
              enum: [none, pregnant, breastfeeding]
            screen:
              type: array
              description: Answers to the 6 health-check questions, in prototype order.
              minItems: 6
              maxItems: 6
              items:
                type: string
                enum: ['yes', 'no']
            created:
              $ref: '#/components/schemas/LocalDate'
              description: Day setup was first completed (drives the beginner ramp).
            cleared:
              oneOf:
                - $ref: '#/components/schemas/LocalDate'
                - type: 'null'
              description: Day the user tapped "My doctor has cleared me"; null if not.
            targets:
              $ref: '#/components/schemas/Targets'

    Targets:
      type: object
      description: 'Daily targets. Prototype: `settings.kcal`, `.protein`, `.carbs`, `.fat`.'
      required: [kcal, protein_g, carbs_g, fat_g]
      additionalProperties: false
      properties:
        kcal:
          type: integer
          minimum: 0
        protein_g:
          type: integer
          minimum: 0
        carbs_g:
          type: integer
          minimum: 0
        fat_g:
          type: integer
          minimum: 0

    Consent:
      description: 'A dated consent record (DPDP). Prototype: `settings.consent` (a date).'
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [kind, given_at, text_version]
          properties:
            kind:
              type: string
              enum: [data_storage]
              description: The first-run consent to storing data as described.
            given_at:
              $ref: '#/components/schemas/Timestamp'
            text_version:
              type: string
              maxLength: 50
              description: Version of the consent text the user agreed to.
              examples: ['2026-10-07']

    FoodLog:
      description: 'One logged food in a meal. Prototype: an item in `day.meals`.'
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [date, meal, name, qty, kcal, protein_g, carbs_g, fat_g, food_id]
          properties:
            date:
              $ref: '#/components/schemas/LocalDate'
            meal:
              type: string
              enum: [Breakfast, Lunch, Snacks, Dinner]
            name:
              type: string
              maxLength: 200
            qty:
              type: number
              exclusiveMinimum: 0
              description: Number of servings.
            kcal:
              type: number
              minimum: 0
              description: Per serving.
            protein_g:
              type: number
              minimum: 0
              description: 'Per serving. Prototype: `p`.'
            carbs_g:
              type: number
              minimum: 0
              description: 'Per serving, including fibre. Prototype: `c`.'
            fat_g:
              type: number
              minimum: 0
              description: 'Per serving. Prototype: `f`.'
            food_id:
              type: [string, 'null']
              format: uuid
              description: Shared food or user food this came from, if any.

    WaterLog:
      description: 'One drink of water. Prototype: an entry in `day.water`.'
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [date, ml]
          properties:
            date:
              $ref: '#/components/schemas/LocalDate'
            ml:
              type: integer
              exclusiveMinimum: 0
              maximum: 5000

    DayNote:
      description: |
        Per-day flags and counts. One per day; id = UUIDv5(`day_notes:<date>`).
        Water lives in `water_logs`.
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [date, complete, steps, sleep, fast]
          properties:
            date:
              $ref: '#/components/schemas/LocalDate'
            complete:
              type: [boolean, 'null']
              description: '"I''ve logged everything" tick; null when never set.'
            steps:
              type: [integer, 'null']
              minimum: 0
            steps_source:
              type: [string, 'null']
              enum: [manual, device, null]
              description: |
                Where `steps` came from: typed in (`manual`) or read from the phone's step
                sensor (`device`). Null when `steps` is null. Optional: records written
                before 0.1.7 omit it, and an absent value with a non-null `steps` means `manual`.
            sleep:
              type: [number, 'null']
              minimum: 0
              maximum: 24
              description: Hours slept.
            fast:
              type: boolean
              description: Fasting day (switches meal ideas to the fasting pool).

    Workout:
      description: |
        The training session(s) for one day. One per day; id = UUIDv5(`workouts:<date>`).
        Sets live in `workout_sets`. Prototype: `day.workout`.

        The prototype's `sessions` store (`sessions.entries[date] = { t, n }`, used for
        template rotation, the weekly streak and the habits meter) has no table: the app
        rebuilds it after every pull from `workouts` and `workout_sets`. For each workout
        not deleted, `n` = the number of its sets not deleted with `kind: work` and
        `done: true`, and `t` = `base`, else `template`, else "Session"; there is an entry
        for the workout's `date` only when `n` > 0.
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [date, template, base, where, cardio_min, mods, exercises, ci_choice]
          properties:
            date:
              $ref: '#/components/schemas/LocalDate'
            template:
              type: [string, 'null']
              maxLength: 200
              description: Display name, e.g. "Upper A (dumbbells only)" or "Push A + Pull A".
            base:
              type: [string, 'null']
              maxLength: 200
              description: Plan template the session was built from, e.g. "Upper A".
            where:
              type: [string, 'null']
              enum: [gym, dumbbells, bodyweight, null]
              description: Day override of the profile's `where`; null to use the profile.
            cardio_min:
              type: [integer, 'null']
              minimum: 0
              description: 'Prototype: `cardio`.'
            mods:
              type: object
              description: |
                Session modifiers. Shape owned by packages/core (`SessionMods`); stored as-is.
                The keys core writes:
                - `light` (boolean): no weight increases and one fewer set (check-in "light", lab hold or needs clearance).
                - `short` (boolean): short session, main exercises only.
                - `where` (`gym`, `dumbbells` or `bodyweight`): where the session happens.
                - `deload` (boolean): recovery week in range.
                - `reentry` (number): re-entry fraction (0.15 or 0.3) when a re-entry period is in range, else 0.
                Readers treat a missing key as false (or 0 for `reentry`) and keep unknown keys.
                At most 20 keys; an unknown key's value is a boolean, number, short string or null.
              maxProperties: 20
              propertyNames:
                maxLength: 50
              properties:
                light:
                  type: boolean
                short:
                  type: boolean
                where:
                  type: string
                  enum: [gym, dumbbells, bodyweight]
                deload:
                  type: boolean
                reentry:
                  type: number
                  minimum: 0
                  maximum: 1
              additionalProperties:
                type: [boolean, number, string, 'null']
                maxLength: 50
            exercises:
              type: array
              maxItems: 50
              description: Exercises in session order.
              items:
                $ref: '#/components/schemas/WorkoutExercise'
            ci_choice:
              type: [string, 'null']
              enum: [light, swap, orig, null]
              description: |
                How the weekly check-in said to build today's session: `light`, `swap` (next
                template) or `orig`; null when no choice was made. Prototype: `ciChoice`.

    WorkoutExercise:
      type: object
      description: |
        One exercise of a workout. Open on purpose: the app keeps keys it does not know,
        written by a newer client, when it rewrites the exercise (#527). At most 20 keys;
        an unlisted key's name is at most 50 characters and its value is a boolean,
        number, string of at most 200 characters or null, so its size is bounded by these
        limits. A field a later contract adds is listed here with its own shape.
      required: [name, part, bridge, form, found_kg, skip_ramp]
      maxProperties: 20
      propertyNames:
        maxLength: 50
      additionalProperties:
        type: [boolean, number, string, 'null']
        maxLength: 200
      properties:
        name:
          type: string
          maxLength: 200
          description: Exercise name; unique within a workout.
        part:
          type: integer
          enum: [1, 2]
          description: 2 for exercises added by a second session that day.
        bridge:
          type: boolean
          description: Ladder bridge exercise (2 lighter sets).
        form:
          type: [string, 'null']
          enum: ['yes', 'no', null]
          description: Did form stay solid on every set.
        found_kg:
          type: [number, 'null']
          description: 'Working weight found by the ramp. Prototype: `found`.'
        skip_ramp:
          type: boolean
          description: 'User skipped the find-your-weight ramp. Prototype: `skipRamp`.'
        feel:
          type: [string, 'null']
          pattern: '^(target|pain|[0-9]{1,2})$'
          description: >
            Where the user felt the last set: `target`, `pain`, or the index of the
            guide card's "felt it somewhere else" entry. Null or absent when not
            answered. Optional so older clients that omit it still validate; a client that
            does not know the field may drop it when it rewrites the exercise.
            Prototype: `ex.feel`.

    WorkoutSet:
      description: One working or ramp set within a workout.
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [workout_id, exercise, kind, set_index, weight_kg, reps, done, rate, t]
          properties:
            workout_id:
              type: string
              format: uuid
              description: 'Id of the workout this set belongs to; for natural-key workouts, the UUIDv5 of `workouts:<date>`.'
            exercise:
              type: string
              maxLength: 200
              description: Matches a `name` in the workout's `exercises`.
            kind:
              type: string
              enum: [work, ramp]
              description: '`ramp` sets are the find-your-weight ramp. Prototype: `ex.ramp`.'
            set_index:
              type: integer
              minimum: 0
              description: Position within the exercise's sets of this kind.
            weight_kg:
              type: [number, 'null']
              minimum: 0
              description: 'Load; assistance for assisted exercises; null if blank. Prototype: `w`.'
            reps:
              type: [integer, 'null']
              minimum: 0
              description: 'Reps, or seconds for holds; null if blank. Prototype: `r`.'
            done:
              type: boolean
            rate:
              type: [string, 'null']
              enum: [easy, right, hard, fail, null]
            t:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
              description: When the set was ticked done.

    LiftSet:
      type: object
      required: [weight_kg, reps, rate]
      additionalProperties: false
      properties:
        weight_kg:
          type: number
          minimum: 0
        reps:
          type: integer
          minimum: 0
        rate:
          type: [string, 'null']
          enum: [easy, right, hard, fail, null]

    LiftSession:
      type: object
      description: |
        An earlier session in a lift record. Prototype: `L.prev`. Used only inside
        `LiftStat.prev`, which closes it with `unevaluatedProperties: false` (it adds `prev`
        one level deep, so it cannot use `additionalProperties: false` here).
      required: [date, sets, form]
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        sets:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/LiftSet' }
        form:
          type: [string, 'null']
          enum: ['yes', 'no', null]

    LiftStat:
      description: |
        Per-exercise history used for weight suggestions and stalls.
        One per exercise; id = UUIDv5(`lift_stats:<exercise>`). Prototype: `lifts[name]`.
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [exercise, date, sets, form, sessions, first, prev, history, pb_toast_date]
          properties:
            exercise:
              type: string
              maxLength: 200
            date:
              $ref: '#/components/schemas/LocalDate'
              description: Day of the latest session.
            sets:
              type: array
              maxItems: 50
              items: { $ref: '#/components/schemas/LiftSet' }
            form:
              type: [string, 'null']
              enum: ['yes', 'no', null]
            sessions:
              type: integer
              minimum: 1
              description: 'Sessions done on this exercise. Prototype: `n`.'
            first:
              $ref: '#/components/schemas/LocalDate'
              description: Day of the first session.
            prev:
              description: The session before the latest.
              oneOf:
                - unevaluatedProperties: false
                  allOf:
                    - $ref: '#/components/schemas/LiftSession'
                    - type: object
                      properties:
                        prev:
                          description: |
                            The session before `prev`; used to evaluate 'below the rep range two
                            sessions running' against sessions before today (#101). One level only:
                            a nested `prev` that has its own `prev` key (even null) fails validation.
                            Older records may omit it.
                          oneOf:
                            - unevaluatedProperties: false
                              allOf:
                                - $ref: '#/components/schemas/LiftSession'
                                - not: { required: [prev] }
                            - type: 'null'
                - type: 'null'
            history:
              type: array
              maxItems: 8
              description: 'Last 8 session scores. Prototype: `hist` with `e`.'
              items:
                type: object
                required: [date, score]
                additionalProperties: false
                properties:
                  date:
                    $ref: '#/components/schemas/LocalDate'
                  score:
                    type: number
            pb_toast_date:
              oneOf:
                - $ref: '#/components/schemas/LocalDate'
                - type: 'null'
              description: |
                Day the personal-best toast was last shown for this lift, so it shows at most
                once a day; null if never shown. Prototype: `pbToast`.

    Weight:
      description: 'Body weight on a day. One per day; id = UUIDv5(`weights:<date>`). Prototype: `weights.entries`.'
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [date, weight_kg]
          properties:
            date:
              $ref: '#/components/schemas/LocalDate'
            weight_kg:
              type: number
              exclusiveMinimum: 20
              exclusiveMaximum: 400
              description: The prototype accepts a weigh-in only above 20 and below 400 kg.

    Measurement:
      description: |
        Tape measurements on a day, in cm; null when not measured.
        One per day; id = UUIDv5(`measurements:<date>`). Prototype: `measures.entries`.
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [date, waist_cm, neck_cm, chest_cm, arm_cm, thigh_cm, hips_cm]
          properties:
            date:
              $ref: '#/components/schemas/LocalDate'
            waist_cm: { $ref: '#/components/schemas/TapeCm' }
            neck_cm: { $ref: '#/components/schemas/TapeCm' }
            chest_cm: { $ref: '#/components/schemas/TapeCm' }
            arm_cm: { $ref: '#/components/schemas/TapeCm' }
            thigh_cm: { $ref: '#/components/schemas/TapeCm' }
            hips_cm: { $ref: '#/components/schemas/TapeCm' }

    TapeCm:
      type: [number, 'null']
      minimum: 10
      maximum: 250

    UserFood:
      description: 'A personal food. Prototype: an item in `settings.myFoods`.'
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [name, unit, kcal, protein_g, carbs_g, fat_g, fibre_g, added_sugar_g, fruit_veg_servings, origin]
          properties:
            name:
              type: string
              maxLength: 200
            barcode:
              type: [string, 'null']
              pattern: '^([0-9]{8}|[0-9]{12,13})$'
              description: |
                Optional. Set when the food was made from a barcode scan (Open Food Facts);
                the app then shows the Open Food Facts credit on it and finds it again
                without a network call. `origin` stays `custom`. Absent or null on every
                other food, and on rows from older clients. Same digits as
                `GET /foods/barcode/{code}`.
            unit:
              type: string
              maxLength: 100
              description: Serving label, e.g. "1 katori".
            kcal:
              type: number
              minimum: 0
            protein_g:
              type: number
              minimum: 0
            carbs_g:
              type: number
              minimum: 0
              description: Including fibre.
            fat_g:
              type: number
              minimum: 0
            fibre_g:
              type: [number, 'null']
              minimum: 0
              description: 'Prototype: `fib`.'
            added_sugar_g:
              type: [number, 'null']
              minimum: 0
              description: 'Prototype: `sug`.'
            fruit_veg_servings:
              type: [number, 'null']
              minimum: 0
              description: 'Prototype: `veg`.'
            origin:
              type: string
              enum: [custom, recipe, kitchen_test]
              description: 'Prototype: flags `recipe` / `kitchen`.'

    Ingredient:
      type: object
      required: [ingredient, amount, unit]
      additionalProperties: false
      properties:
        ingredient:
          type: string
          maxLength: 200
          description: 'Raw ingredient name from the shared raw table. Prototype: `ing`.'
          examples: ['Toor dal (dry)']
        amount:
          type: number
          exclusiveMinimum: 0
          description: 'Prototype: `amt`.'
        unit:
          type: string
          enum: [g, tsp, tbsp]

    Recipe:
      description: 'A home recipe built from raw ingredients. Prototype: an item in `settings.recipes`.'
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [name, ingredients, yield_mode, katoris, cooked_g, oil]
          properties:
            name:
              type: string
              maxLength: 200
            ingredients:
              type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/Ingredient' }
            yield_mode:
              type: string
              enum: [katori, grams]
              description: 'How the cooked yield is given. Prototype: `ymode`.'
            katoris:
              type: [number, 'null']
              exclusiveMinimum: 0
              description: Katoris (150 g each) the recipe made, when `yield_mode` is katori.
            cooked_g:
              type: [number, 'null']
              exclusiveMinimum: 0
              description: 'Cooked weight, when `yield_mode` is grams. Prototype: `grams`.'
            oil:
              type: string
              maxLength: 20
              description: Oil level chosen in the recipe builder (core writes `low`, `normal` or `rich`).
              examples: [normal]

    KitchenTest:
      description: |
        A weighed dish. Photos stay on the device; only `has_photo` syncs.
        Prototype: an item in `settings.kitchen`.
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [name, date, note, ingredients, pot_g, pot_full_g, cooked_g, serving_g, serving_name, has_photo]
          properties:
            name:
              type: string
              maxLength: 200
            date:
              $ref: '#/components/schemas/LocalDate'
            note:
              type: string
              maxLength: 2000
            ingredients:
              type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/Ingredient' }
            pot_g:
              type: [number, 'null']
              minimum: 0
              description: 'Empty pot weight. Prototype: `pot`.'
            pot_full_g:
              type: [number, 'null']
              minimum: 0
              description: 'Pot with cooked food. Prototype: `potFull`.'
            cooked_g:
              type: [number, 'null']
              minimum: 0
              description: 'Cooked weight entered directly. Prototype: `cooked`.'
            serving_g:
              type: [number, 'null']
              minimum: 0
              description: 'Weight of one serving. Prototype: `serving`.'
            serving_name:
              type: string
              enum: [katori, plate, piece, glass, bowl]
              description: 'Prototype: `sname`.'
            has_photo:
              type: boolean
              description: 'A photo exists on the device. Prototype: `hasPhoto`.'

    Exclusion:
      description: 'A rule leaving an exercise, family, pattern or joint out. Prototype: an item in `settings.excl`.'
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [name, scope, key, reason, created, until, to, done]
          properties:
            name:
              type: string
              maxLength: 200
              description: Exercise the user was looking at when making the rule.
            scope:
              type: string
              enum: [exercise, family, pattern, joint]
            key:
              type: string
              maxLength: 200
              description: Exercise name, family, pattern or joint, per `scope`.
            reason:
              type: [string, 'null']
              enum: [pain, equip, dislike, form, null]
            created:
              $ref: '#/components/schemas/LocalDate'
            until:
              oneOf:
                - $ref: '#/components/schemas/LocalDate'
                - type: 'null'
              description: Last day of a timed rule; null for permanent.
            to:
              type: object
              description: Replacement picked per exercise name; null value means skipped.
              maxProperties: 500
              propertyNames:
                maxLength: 200
              additionalProperties:
                type: [string, 'null']
                maxLength: 200
            done:
              type: boolean
              description: The user brought the exercise back; rule no longer active.

    Swap:
      description: |
        A lasting swap of one exercise for another (ladder step or side swap).
        One per source exercise; id = UUIDv5(`swaps:<from>`). Prototype: `settings.repl[from]`.
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [from, to, since, bridge_until]
          properties:
            from:
              type: string
              maxLength: 200
            to:
              type: string
              maxLength: 200
            since:
              $ref: '#/components/schemas/LocalDate'
            bridge_until:
              oneOf:
                - $ref: '#/components/schemas/LocalDate'
                - type: 'null'
              description: 'Last day the old exercise is kept as a bridge. Prototype: `bridgeUntil`.'

    ExerciseTags:
      type: object
      description: 'Tags for a custom exercise, same meaning as content tags (`p`, `f`, `eq`, `d`, `m`, `s`, `j`).'
      required: [pattern, family, equipment, difficulty, primary, secondary, joints]
      additionalProperties: false
      properties:
        pattern:
          type: string
          maxLength: 50
        family:
          type: string
          maxLength: 50
        equipment:
          type: string
          enum: [barbell, dumbbell, machine, cable, bodyweight, other]
          description: |
            The prototype's custom-exercise equipment values, plus `other`. Core maps
            anything but barbell, dumbbell, machine, cable and bodyweight to type `other`.
        difficulty:
          type: integer
          minimum: 1
          maximum: 3
        primary:
          type: array
          maxItems: 15
          items: { $ref: '#/components/schemas/Muscle' }
        secondary:
          type: array
          maxItems: 15
          items: { $ref: '#/components/schemas/Muscle' }
        joints:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50

    Reminder:
      type: object
      required: [kind, time, days, 'on']
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [workout, weigh_in, water, log_food]
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local wall-clock time on the phone, 24-hour `HH:MM`.
          examples: ['07:30']
        days:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          description: ISO weekdays the reminder fires on, 1 = Monday to 7 = Sunday.
          items:
            type: integer
            minimum: 1
            maximum: 7
        'on': # quoted: YAML 1.1 readers (SnakeYAML in the backend) read a bare `on` as the boolean true (#418)
          type: boolean
          description: Whether the reminder is scheduled.

    Muscle:
      type: string
      enum: [chest, front-delt, side-delt, rear-delt, triceps, lats, upper-back, biceps, forearms, quads, hams, glutes, calves, abs, lower-back]

    Settings:
      description: |
        Training and app preferences. One per user; id = UUIDv5(`settings:me`).
        Prototype: the remaining keys of `settings` (profile, targets, consent, myFoods,
        recipes, kitchen, excl and repl have their own tables). `labHold` is not synced in
        v0: lab reports are a v2 feature and whether the hold flag syncs is decided with them.
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [focus, rest_off, custom_tags, diet, water_sizes, exercise_overrides, flex, returning, ladder_stay, checkin_seen, adjustments, adaptive, learn, meal_plan, prep]
          properties:
            focus:
              type: array
              maxItems: 3
              description: Focus muscles.
              items: { $ref: '#/components/schemas/Muscle' }
            rest_off:
              type: boolean
              description: 'Rest timer turned off. Prototype: `restOff`.'
            custom_tags:
              type: object
              description: 'Tags for custom exercises, keyed by exercise name. Prototype: `customTags`.'
              maxProperties: 500
              propertyNames:
                maxLength: 200
              additionalProperties: { $ref: '#/components/schemas/ExerciseTags' }
            diet:
              type: string
              enum: [any, egg, veg]
              description: 'Meal-idea diet filter: everything, eggetarian or vegetarian.'
            water_sizes:
              type: object
              description: 'Prototype: `water`.'
              required: [glass_ml, bottle_ml]
              additionalProperties: false
              properties:
                glass_ml:
                  type: integer
                  exclusiveMinimum: 0
                bottle_ml:
                  type: integer
                  exclusiveMinimum: 0
            exercise_overrides:
              type: object
              description: 'Per-exercise type, step and rep range, keyed by exercise name. Prototype: `ex`.'
              maxProperties: 500
              propertyNames:
                maxLength: 200
              additionalProperties:
                type: object
                required: [type, step_kg, rep_low, rep_high]
                additionalProperties: false
                properties:
                  type:
                    type: string
                    enum: [barbell, dumbbell, machine, cable, assisted, bodyweight, other, time]
                    description: Exercise type; the keys of core's `DEFAULT_STEP` and content's `defaultStep`.
                  step_kg:
                    type: number
                    minimum: 0
                  rep_low:
                    type: integer
                    minimum: 1
                  rep_high:
                    type: integer
                    minimum: 1
            flex:
              type: array
              maxItems: 200
              description: |
                Calorie moves between days (last 7 days). One "bigger meal" plan adds several
                entries: the extra kcal on its day and an equal cut on each of the next days.
                All entries of one plan share an `id`, and undo removes every entry with that id.
              items:
                type: object
                required: [id, date, kcal_delta]
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: uuid
                    description: |
                      Id of the flex plan this entry belongs to: a random UUIDv4 made on the device
                      when the plan is made. Every entry of the plan has the same id, so it is not
                      unique within `flex`. Undo removes all entries with this id. Prototype: `id`.
                  date:
                    $ref: '#/components/schemas/LocalDate'
                  kcal_delta:
                    type: integer
                    description: 'Prototype: `d`.'
            returning:
              type: object
              description: Exercises coming back after an exclusion, keyed by name, with the last day of the light period.
              maxProperties: 500
              propertyNames:
                maxLength: 200
              additionalProperties:
                type: object
                required: [until]
                additionalProperties: false
                properties:
                  until:
                    $ref: '#/components/schemas/LocalDate'
            ladder_stay:
              type: object
              description: 'Ladder "stay" answers, keyed by exercise name, until a day. Prototype: `ladderStay`.'
              maxProperties: 500
              propertyNames:
                maxLength: 200
              additionalProperties:
                $ref: '#/components/schemas/LocalDate'
            checkin_seen:
              oneOf:
                - $ref: '#/components/schemas/LocalDate'
                - type: 'null'
              description: 'Monday of the last weekly check-in seen. Prototype: `checkinSeen`.'
            adjustments:
              type: object
              description: 'Plan adjustment state (declines, muted, dismissed, deload, reentry). Prototype: `adj`. Shape owned by packages/core; at most 64 KB as compact JSON (`x-max-json-bytes`).'
              maxProperties: 50
              x-max-json-bytes: 65536
              additionalProperties: true
            adaptive:
              type: object
              description: Real-burn estimate state. Shape owned by packages/core; at most 64 KB as compact JSON (`x-max-json-bytes`).
              maxProperties: 50
              x-max-json-bytes: 65536
              additionalProperties: true
            learn:
              type: object
              description: Science-card progress. Shape owned by packages/core; at most 64 KB as compact JSON (`x-max-json-bytes`).
              maxProperties: 50
              x-max-json-bytes: 65536
              additionalProperties: true
            meal_plan:
              type: [object, 'null']
              description: 'Saved meal plan. Prototype: `mealPlan`. Shape owned by packages/core; at most 64 KB as compact JSON (`x-max-json-bytes`).'
              maxProperties: 50
              x-max-json-bytes: 65536
              additionalProperties: true
            prep:
              type: array
              maxItems: 100
              description: Meal-prep batches still being eaten. Shape owned by packages/core; each batch at most 4 KB as compact JSON (`x-max-json-bytes`).
              items:
                type: object
                maxProperties: 50
                x-max-json-bytes: 4096
                additionalProperties: true
            reminders:
              type: array
              maxItems: 20
              description: |
                Local reminders, scheduled on the phone (no push service). All default off.
                The web app does not show or fire them but keeps the list as synced. Optional:
                records written before 0.1.7 omit it, and absent means no reminders.
              items:
                $ref: '#/components/schemas/Reminder'
