openapi: 3.1.0
info:
  title: Plate & Bar API
  version: 0.1.24
  summary: Contract between the Plate & Bar app and its backend (v0 draft, milestone M0).
  description: |
    The server stores, syncs and guards; every rule (targets, plan engine, progression,
    food maths) runs on the phone in `packages/core`.

    Scope: auth, sync, food search, content bundles (`/content/*`), health, account
    rights (`GET /me/export`, `DELETE /me`), the AI calls (`/ai/*`: text calls in v1, image calls
    in v1.1) and the barcode lookup (`GET /foods/barcode/{code}`, Open Food Facts, ADR 009).

    Wire conventions:
    - JSON field names are snake_case everywhere. Where a field comes from the prototype
      (`docs/prototype/plate-and-bar.html`) under a different name, its description says
      "Prototype: `name`".
    - Timestamps (`*_at`, `t`) are ISO 8601 date-times in UTC with a `Z` suffix.
    - Calendar days (`date`, `created`, `cleared`, `until`, ...) are `YYYY-MM-DD` in the
      user's local calendar, exactly as the prototype keys its days.
    - Units are metric and named in the field: grams (`_g`), kilograms (`_kg`),
      centimetres (`_cm`), millilitres (`_ml`), minutes (`_min`), kilocalories (`kcal`).
    - Carbohydrate is always total carbohydrate including fibre.
    - Every 4xx and 5xx response uses the shared `Error` schema.
    - "Blank" text is text made only of Unicode `White_Space` characters (U+0009 to U+000D,
      U+0020, U+0085, U+00A0, U+1680, U+2000 to U+200A, U+2028, U+2029, U+202F, U+205F,
      U+3000) and the zero-width characters U+200B to U+200D, U+2060 and U+FEFF. A field
      that "must not be blank" carries the `pattern` below, which matches any other
      character. Every class member is spelled out (no `\s` or `\S`), so ECMA-262 (with or
      without the `u` flag) and `java.util.regex` read it the same way:
      `[^\t-\r \u0085\u00A0\u1680\u2000-\u200D\u2028\u2029\u202F\u205F\u2060\u3000\uFEFF]`.
      `test-vectors/blank-text.json` has shared must-fail and must-pass texts.
    - Request bodies are at most 2 MB (2,097,152 bytes) on every endpoint, and at most
      16 KB (16,384 bytes) on the four text `POST /ai/*` endpoints (the three image endpoints
      keep the 2 MB limit, see the `ai` tag, Images). A larger body is refused without
      being read in full, with 400 `invalid_request` and one `details` entry whose `field`
      is empty and whose `issue` is `too_large`. The 2 MB check runs before anything
      else, sign-in included; the AI body check is the request-validation step of the
      `ai` tag's order of checks.
    - A JSON request body is exactly one JSON value. On every endpoint that takes one
      (`/auth/*`, `/sync`, `/ai/*`) the server refuses these with 400 `invalid_request`,
      as it does a body that is not JSON, and names no key or value in `details` (on
      `/sync` and `/ai/*` its one entry has an empty `field` and the issue `type`):
      content after the value other than whitespace (`{...} junk`, `{...}{...}`); an
      object that has the same key twice, at any depth, comparing keys after unescaping
      (`{"a":1,"\u0061":2}` repeats `a`); and arrays and objects nested more than 1,000
      deep. Bodies built with `JSON.stringify` never have the first two.
      `test-vectors/strict-json.json` has shared must-refuse and must-accept bodies.
    - Record schemas bound every string (`maxLength`) and array (`maxItems`), and the
      key count (`maxProperties`) of every object that declares `additionalProperties`,
      with generous headroom over real use. Every object nested in a record whose fields
      the contract lists is closed (`additionalProperties: false`, or
      `unevaluatedProperties: false` where it is put together with `allOf`): a key it
      does not list fails validation. Two kinds of nested object stay open.
      `WorkoutExercise` keeps keys written by newer clients: at most 20 keys, and an
      unlisted key's value is a boolean, number, string of at most 200 characters or
      null. The objects whose shape `packages/core` owns (`Settings.adjustments`,
      `adaptive`, `learn`, `meal_plan` and each `prep` item) are bounded by
      `maxProperties` and by `x-max-json-bytes`: the most UTF-8 bytes the object may take
      written as compact JSON: strings escaped as `JSON.stringify` writes them, and each
      number's text counted exactly as sent (`1e2` is 3 bytes, `1.0` is 3), which is
      `JSON.stringify`'s output for a body it built. The top level of a record
      is not closed: keys its schema does not list are accepted, ignored and not stored.
      The app keeps what it stores locally within these bounds, because a record that
      breaks one fails the `/sync` request with 400 `invalid_request` naming that record.
    - Each account stores at most a server-configured number of synced records. A push
      that would go over it is refused whole with 413 `account_full` (see `POST /sync`,
      Account record cap).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Base path on every environment (local, staging, production); hosts are set per deployment.
security:
  - bearerAuth: []
tags:
  - name: auth
    description: |
      Sign-in, token refresh and sign-out. Public. ADR 003 covers the tokens and ADR 006
      covers the web cookie.

      **Two ways to carry the refresh token.** Native apps use the body (unchanged): the
      refresh token arrives in `TokenPair.refresh_token`, the app keeps it in the
      platform's secure store and sends it back in `RefreshRequest.refresh_token`. The web
      app uses a cookie, because a browser has no secure store. It sends the header
      `X-Auth-Transport: cookie` (fetch option `credentials: 'include'`) on
      `POST /auth/google`, `POST /auth/email/verify`, `POST /auth/refresh` and
      `POST /auth/refresh/revoke`. Only the exact value `cookie` (case-sensitive) selects
      cookie mode. Any other value is ignored and treated like an absent header. Without
      cookie mode the server never reads or sets the cookie, even if the browser sends
      one, and everything works as in body mode.

      **Cookie mode.**
      - A response that issues tokens (200 from sign-in or refresh) sets
        `__Secure-pb_refresh=<token>; Path=/api/v1/auth/refresh; Max-Age=7776000; HttpOnly; Secure; SameSite=Strict`
        (no `Domain`, so only the API host gets it; `Max-Age` is the 90-day refresh
        lifetime, matching `refresh_token_expires_at`). In the body, `refresh_token` is
        the empty string; everything else is as in body mode.
      - `POST /auth/refresh` and `POST /auth/refresh/revoke` read the token from the
        cookie only. A body that carries `refresh_token` is refused with 400
        `invalid_request` whenever the field is present, whatever its value (including
        `""`). Rotation replaces the cookie.
      - The cookie is cleared (same name, `Path` and attributes, `Max-Age=0`) by every
        401 from `POST /auth/refresh` and every 204 from `POST /auth/refresh/revoke`.
        Other errors (400, 403, 429, 5xx) leave it unchanged.
      - The web app keeps the access token in memory only, never in `localStorage`,
        `sessionStorage`, IndexedDB or a script-readable cookie. After a reload it calls
        `POST /auth/refresh` to get a new one.

      **CSRF.** Cookie mode is accepted only when the request carries an `Origin` header
      exactly equal to one of the cookie-mode origins. That is a server-configured list
      of the web app's own origins only, separate from the CORS allow-list. Other pages
      that call the API from a browser (for example the website's account-deletion page)
      may be in the CORS allow-list but are never cookie-mode origins. They can be on
      the same site as the API, so `SameSite=Strict` alone would not keep the cookie
      from them. If `Origin` is missing or not a cookie-mode origin, the server answers
      403 `forbidden` and neither reads nor changes the cookie or the session. This
      applies to the sign-in endpoints too, which stops a login CSRF from planting
      someone else's session.

      Order of checks in cookie mode: body size (400 `too_large`), rate limit (429),
      `Origin` (403), then request validation (400) and the endpoint's own checks.

      The `Origin` check adds to two other defences:
      - `SameSite=Strict`: the browser never sends the cookie on a request started from
        another site.
      - The custom header: a cross-site form or simple request cannot carry it, and a
        script on another origin must pass a CORS preflight, which only allowed origins
        pass.

      **CORS.** For each cookie-mode origin (exact match, never `*`), responses on
      `/auth/*`, including preflights, carry `Access-Control-Allow-Origin: <origin>`,
      `Access-Control-Allow-Credentials: true` and `Vary: Origin`. Preflights allow the
      `X-Auth-Transport` and `Content-Type` request headers. Other CORS origins get no
      `Access-Control-Allow-Credentials`, so the browser does not hand them a
      credentialed response. A browser whose origin is not allowed fails the preflight
      and never sees the 403: `fetch` rejects with a network error. The web app
      therefore treats a network-level failure of a cookie-mode call that persists while
      other requests succeed as a possible configuration error, not as offline, and
      does not retry it in a loop. The web app sends
      credentials only to the four endpoints above. Other endpoints use the bearer header
      and need not allow credentials.

      **Deployment.** The web app and the API must be on the same site (`https` and the
      same registrable domain, for example `app.example.com` and `api.example.com`).
      Otherwise the browser treats the cookie as third-party and never sends it. A
      public-suffix host such as `*.github.io` or `*.pages.dev` is its own site, so the
      web app cannot be served from one. The
      `__Secure-` prefix and `Secure` need HTTPS. Local development needs HTTPS too, or a
      browser that treats `http://localhost` as a secure context.

      **Several tabs.** All tabs of a browser share the cookie, and each tab keeps its own
      access token in memory. The web app runs at most one refresh at a time across tabs
      (for example with the Web Locks API). Otherwise two refreshes could race on one
      cookie: if the older `Set-Cookie` arrives last, the browser keeps a replaced token,
      and the next refresh ends the session as reuse.
  - name: sync
    description: Offline-first sync of user-owned records.
  - name: foods
    description: |
      Shared food database search and the barcode lookup. `GET /foods/barcode/{code}` is
      public (no sign-in) and online-only. The server asks Open Food Facts for one barcode
      at a time and keeps the answer in a per-barcode cache; there is no list, search or
      bulk endpoint for that data (ADR 009). It never sends the caller's IP, name or
      account upstream. The API does not log the barcode. The barcode is a path segment,
      so this holds for the access log only once the reverse proxy redacts
      `/foods/barcode/<digits>` (an infra step of #944, done before the backend proxy
      ships).
  - name: account
    description: Account rights for the signed-in user (export and deletion).
  - name: system
    description: Health and status.
  - name: content
    description: |
      Versioned content bundles (`content/*.json`: exercises, cards, recipes, foods and
      the rest), so a content fix reaches installed apps without an app release. Public
      (no sign-in), cacheable, and limited only by the per-IP rate limit every endpoint has.

      **Source.** The server serves every `content/<name>.json` from its deployed build,
      byte for byte, as bundle `<name>`; there is no allow-list, because every file is
      already shipped inside the app. It is the same content the AI calls use (see the
      `ai` tag).

      **Identity.** `sha256` is the lowercase hex SHA-256 of the bundle's exact bytes (the
      uncompressed body of `GET /content/{bundle}`); it is the bundle's version. The
      `ETag` of `GET /content/{bundle}` is that hash in double quotes (strong). Bytes are
      hashed as served: no re-serialising, whitespace or key-order normalising.
      `test-vectors/content-hash.json` has shared vectors. `schema_version` is the bundle's
      own top-level `schema_version`: it changes only when the bundle's shape changes.

      **`updated_at` derivation.** For each bundle it is the committer date of
      `git log -1 --format=%cI -- content/<name>.json` on a full-history checkout of
      `main`, converted to UTC. Shallow clones give the wrong value, so they are not
      allowed. The backend receives it as a build argument, and the app build computes it
      the same way for its bundled copies. A build that cannot compute it, or that gets
      no value for a bundle, fails. It never falls back to the build time or any other
      default.

      **App use.** The app ships its own copy of every bundle and works fully offline and
      signed out with it. It refreshes on launch, and then at most once a day while it
      stays open:
      - It reads the manifest. It fetches a bundle only when the app knows the bundle,
        supports its `schema_version`, the `sha256` differs from the copy it holds and
        the `updated_at` is later.
      - It checks the fetched body's SHA-256 and size against the manifest and validates
        it, then swaps it in in one step. On any mismatch or failure it keeps the copy it
        has and tries again at the next refresh.
      - It ignores bundle names it does not know.

      **App upgrade.** On launch the app compares each stored server copy with the
      bundled copy of the running build. It keeps the stored copy only if that copy's
      `updated_at` is later and the build supports its `schema_version`. Otherwise it
      discards the stored copy and uses the bundled one.

      **Rollback.** Because the app never takes an earlier `updated_at`, rolling back the
      server image never rolls content back on devices. To roll content back, commit a
      new revert to `main`, which gets a later `updated_at`.
  - name: ai
    description: |
      AI calls: Describe a meal, Ask why, Weekly summary and Suggest tags (text, v1); Meal photo,
      Import recipe and Form check (images, v1.1, see Images below); and `GET /ai/status` for
      which of them are on.
      Every AI call goes through the backend, which holds the provider key; the app never
      calls a model directly. Each feature has a non-AI fallback, so the app works fully
      with AI off. Signed-in users only (sign-in is optional, so signed-out users get the
      fallbacks).

      **Content.** The backend bundles `content/exercises.json`, `content/cards.json`,
      `content/raw-ingredients.json` and `content/foods.json` at build time: the exercise
      catalogue that `SummaryExercise` ids are checked against (and whose `cards` hold the
      cues Form check judges), the cards Ask why is grounded on, the raw ingredient names
      Import recipe matches to, and the built-in foods Meal photo matches to. All are the
      versions in the deployed build.

      **Order of checks.** Access token (401), per-user and per-IP rate limit (429
      `rate_limited`), feature switch (503 `feature_disabled`), request validation (400,
      including a body over the endpoint's limit: issue `too_large`; and for the image
      calls the image checks under Images), daily quota (429
      `quota_exceeded`), then the provider call. A request rejected at any of these steps
      does not count against the quota.

      **Daily quota (`ai_usage`).** Each user has one daily allowance shared by all seven
      endpoints, by default 10 calls a day, and each call costs one unit, an image call too
      (the monthly budget cap below is what bounds vision spend). The limit is server configuration, so the
      app reads `quota.limit` and never hard-codes 10. The day is the UTC calendar day:
      the count resets at 00:00:00Z (05:30 in India), which `quota.resets_at` gives. The
      server reserves the unit before calling the provider, so concurrent calls cannot
      overrun the limit. The unit is kept when the call returns 200, and also when the
      provider returned a reply (which the provider bills) that the server then cannot
      use: a reply that does not parse or fails the output checks is 503 `unavailable`
      and still counts. The unit is released only when the provider call itself fails or
      times out before any billed reply; that 503 `unavailable` costs the user nothing.
      A cached answer to an identical request still counts. Every 200 carries the quota after the call. When nothing is left the
      server answers 429 `quota_exceeded` with `quota` (remaining 0) and `Retry-After` (the
      seconds until `resets_at`); the app shows the fallback and does not retry before
      then.

      `ai_usage` holds only the user id, UTC day, feature, call count and token counts for
      cost tracking; never the text sent or received. It is a quota counter, so it is not
      part of `GET /me/export` (like rate-limit counters), and `DELETE /me` deletes it with
      the account. Separately, the server keeps one anonymous total per UTC month (the
      month and its token count only: no user id, day or feature) to enforce the shared
      monthly AI budget cap. Every call's tokens are added to it, it cannot be linked to
      any account, and it stays when an account is deleted, so deleting an account does
      not give its spend back to the budget.

      **Rate limit.** On top of the daily quota, at most 5 AI requests per user per minute
      across the seven POST endpoints, plus the per-IP limit every endpoint has. Requests
      rejected for validation (400) or quota (429 `quota_exceeded`) still count toward the
      5 per minute. Beyond that, 429 `rate_limited` with `Retry-After` (prototype message:
      "Too many requests right now. Wait a minute and try again."). `GET /ai/status` is
      not part of this limit, only the per-IP one.

      **Kill switch.** One server flag per feature (`describe_meal`, `ask_why`,
      `weekly_summary`, `suggest_tags`, `meal_photo`, `import_recipe`, `form_check`) turns it off instantly, without a deploy; requests already with the
      provider finish. While a feature is off its endpoint answers 503 `feature_disabled`
      and nothing counts against the quota. Reaching the monthly AI budget cap turns every
      AI feature off the same way until the cap is raised or the month ends. All flags
      default to off until a provider and budget are chosen (#200, decision 7). The app
      reads `GET /ai/status` and shows only the AI entry points that are on.
      `feature_disabled` stays as the fallback for a switch flipped after that read: the
      app shows the non-AI fallback and refreshes the status. A provider failure or
      timeout is 503 `unavailable` instead: a one-off, so the app shows "Couldn't get an
      answer, try again" and the fallback.

      **Prompt injection and output checks.** User text (`text`, `question`, `name`) goes into the
      prompt as delimited data, never as instructions, and the instructions tell the model
      to treat it only as data. The model's reply is parsed as data and checked against the
      response schema (types, `maxLength`, `maximum`) before it is returned; nothing in it
      is executed or followed. Describe a meal drops items whose numbers are not finite or
      are out of range. Ask why turns a reply `card_id` that is not in
      `content/cards.json` into null, and rejects an `answer` containing `{` or `}`. A
      reply that cannot be parsed or fails these checks is 503 `unavailable`; the provider
      has billed it, so the reserved quota unit is kept (see Daily quota). Suggest tags
      repairs a reply the way the prototype's `suggestTags()` does instead of failing it:
      it drops muscles that are not in `Muscle`, keeps the first 3 of `primary` and of
      `secondary`, uses `machine` for an equipment that is not in the enum, 2 for a
      difficulty outside 1 to 3. It passes `pattern` and `joints` through as the model
      gave them, cut to the schema limits (a `pattern` over 50 characters is dropped to an
      empty string; `joints` keeps at most 20 items and drops any over 50 characters); the
      app keeps only the patterns and joints it knows and uses `h-press` otherwise. When no
      main muscle is left it answers 200 with `primary` empty (the quota unit is kept, the
      provider billed it) and the app shows the manual tag sheet. It is 503 `unavailable`
      only when the reply does not parse.

      **No logging.** Request and response bodies of `/ai/*` (meal text, images, questions,
      answers, check-in numbers, exercise ids, exercise names) are never logged, written to the database or
      sent to error reporting, and 400 `details[].issue` never echoes a submitted value.
      The identical-request cache, if used, is per user (never shared across users), in
      memory only, keyed by the user id and a hash of the request, and expires within 24
      hours. Server logs for these calls hold only the opaque user id, feature, time,
      status and duration, and are kept for a bounded retention period. The provider
      receives only the request content and the instructions, never the user id, email or
      any other account data, and is configured not to retain or train on it where the
      provider offers that.

      **Images (Meal photo, Import recipe, Form check).** Each image is sent in the JSON
      body as `{media_type, data}`: base64 text (standard alphabet, padded, no line breaks
      and no `data:` prefix), not multipart. One body format keeps the strict-JSON rules,
      the bounds and the generated client the same for every AI call, and the app already
      shrinks photos before sending (the prototype's `shrinkImage()`, 1,600 px, JPEG), so
      the 33% base64 overhead is small. The three image endpoints keep the 2 MB body
      limit instead of the 16 KB one. Limits per image:
      - types `image/jpeg` and `image/png` only (the app re-encodes anything else, such
        as HEIC, to JPEG);
      - at most 1,200,000 decoded bytes for a photo (`AiImage`), 350,000 for a form-check
        frame (`AiFrame`, so four frames fit in 2 MB); the base64 `maxLength` of each
        is that size rounded up to base64;
      - a photo is at most 4,096 px on either side and 16 megapixels, a form-check frame at
        most 640 px on either side (the prototype cuts frames at 640 px), read from the
        header before any pixel is decoded (the server refuses the rest without decoding
        it);
      - the server decodes one image at a time, so a form check never holds more than
        one decoded frame in memory;
      - metadata is never read: the decoder skips every ancillary chunk and segment (EXIF,
        XMP, IPTC, PNG `tEXt`, `zTXt`, `iTXt`, `iCCP`), taking only the orientation, and only from a JPEG's Exif (a PNG
        `eXIf` chunk is ignored; the app sends JPEG);
      - and, whether or not the decoder would have skipped it, a PNG `zTXt`, `iTXt`
        (compression flag 1) or `iCCP` chunk that inflates to more than 65,536 bytes is
        always refused as `unreadable_image`. The server checks this with a bounded
        inflate that stops at 65,537 bytes, before decoding, so a small file cannot expand
        into memory.

      Image checks run in the request-validation step (before the quota) and each
      failure is 400 `invalid_request` with `details[].field` naming the image
      (`image.data`, `frames[1].data`, ...) and one `issue`: `too_large`,
      `invalid_base64`, `unsupported_type` (not JPEG or PNG), `type_mismatch` (the bytes
      are not the declared `media_type`; the server reads the magic bytes, not the
      label), `unreadable_image` (does not decode) or `dimensions`. The first fault in
      that order of checks wins: `unsupported_type`, `invalid_base64`, `too_large`,
      `type_mismatch`, `dimensions`, `unreadable_image`. These values replace the schema
      keyword the validator would otherwise report: a `media_type` that fails the
      `enum` is `unsupported_type`; a `data` that fails `pattern` (not base64, or a
      length that is not a multiple of 4) or `minLength` is `invalid_base64`; a `data`
      over `maxLength` is `too_large`, never `maxLength`. The backend maps those schema
      failures to these issues, and `test-vectors/ai-images.json` has one case for each.
      An issue never echoes the image. A rejected image does not count against the
      quota.

      **Images are never stored or logged, and have no retention.** The decoded image,
      the re-encoded copy and the model's reply live in memory for the length of the
      request and are never written to disk or a temp file, the database, object
      storage, a cache, logs, metrics, traces or error reports; the identical-request
      cache is not used for any of the three image endpoints, a text-only Import recipe
      call included. Nothing about an image is kept beyond the
      `ai_usage` counts above, and `GET /me/export` and `DELETE /me` have nothing of it
      to export or delete.

      **EXIF and other metadata are stripped on the server.** The server decodes every
      image, applies its orientation (from a JPEG's Exif only; a PNG `eXIf` chunk is ignored,
      and the app sends JPEG), and re-encodes the pixels as a new JPEG (long side
      at most 1,600 px). The original bytes are never forwarded, so EXIF (GPS position,
      time, device), XMP, IPTC, embedded thumbnails and comments do not reach the
      provider; a file that cannot be decoded is refused, never forwarded as is. The app
      also re-encodes on the device, but the server does not rely on that.

      The provider receives only the re-encoded images, the user's text and the
      instructions (the Provider rule above); a provider that cannot be set to no
      retention and no training on the request is not used for these calls (ADR 008).
      The app sends images only after the user has turned AI features on, and keeps the
      photo only in memory while the sheet is open; it is never added to progress
      photos. Text inside an image (a note in the photo, a recipe page) is data, like any
      user text: it is never followed as an instruction. The output checks drop what does
      not fit the schema: Meal photo drops items with non-finite or out-of-range numbers
      and keeps 12 at most, reads an unknown `confidence` as `medium`, turns a `match` that is not
      a `content/foods.json` name into null and clamps `servings` to 0.25 to 6; Import recipe
      moves ingredients that are not in `content/raw-ingredients.json` or whose weight is
      unusable to `unmatched`; Form check drops checks whose `cue` is not one of the
      card's `key_cues` and reads an unknown `status` as `unclear`. A reply that does not
      parse is 503 `unavailable`, with the quota unit kept as for any billed reply.

paths:
  /auth/google:
    post:
      tags: [auth]
      operationId: signInWithGoogle
      summary: Sign in with a Google ID token
      description: |
        Verifies the Google ID token obtained on the device, creates the account on first
        sign-in, and returns a new token pair.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthTransport'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
            examples:
              default:
                value:
                  id_token: eyJhbGciOiJSUzI1NiIsImtpZCI6IjE2In0.eyJpc3MiOiJodHRwczovL2FjY291bnRzLmdvb2dsZS5jb20ifQ.c2lnbmF0dXJl
      responses:
        '200':
          $ref: '#/components/responses/TokenPair'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /auth/email/start:
    post:
      tags: [auth]
      operationId: startEmailSignIn
      summary: Send a one-time sign-in code by email
      description: |
        Sends a 6-digit one-time code to the address. Always answers 202 for a well-formed
        address, whether or not an account exists, so the endpoint cannot be used to find
        accounts. Rate-limited per address and per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailStartRequest'
            examples:
              default:
                value:
                  email: asha@example.com
      responses:
        '202':
          description: Code sent (or silently not sent if the address cannot receive mail).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailStartResponse'
              examples:
                default:
                  value:
                    code_expires_at: '2026-10-08T06:40:00Z'
                    resend_after_seconds: 60
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmailSignIn
      summary: Exchange an emailed code for tokens
      description: |
        Verifies the one-time code, creates the account on first sign-in, and returns a new
        token pair. A code is single-use; after 5 wrong attempts it is invalidated and the
        user must request a new one.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthTransport'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
            examples:
              default:
                value:
                  email: asha@example.com
                  code: '482913'
      responses:
        '200':
          $ref: '#/components/responses/TokenPair'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Code wrong, expired, already used, or attempts exhausted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    code: invalid_code
                    message: That code is wrong or has expired. Request a new one.
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Rotate the refresh token
      description: |
        Exchanges a refresh token for a new access token and a new refresh token. The old
        refresh token is invalidated; the new one is valid for 90 days from this refresh
        (see `TokenPair.refresh_token`). Presenting an already-rotated refresh token is treated
        as theft: the whole session (every token descended from the same sign-in) is
        revoked and the user must sign in again.

        **Lost response.** There is one exception, so that a response that never reached the
        device does not sign the user out. If the token was rotated less than 60 seconds ago
        and the token it was exchanged for has never been presented to this endpoint (using
        its access token does not count), the server treats the call as a retry: it rotates
        that unused token (marks it replaced, as if it had been presented), keeps the
        session, and answers 200 with a new pair (a replacement, not a copy of the first
        response; the server stores only hashes). A device that did not get
        the response of a refresh should retry with the token it still holds.

        The 60 seconds are counted from the first rotation of the token and are never
        extended by a retry. A second retry of the same old token inside the window replaces
        whichever successor is current (the one the previous retry issued), provided that
        successor has not been presented. The replaced token is dead, and presenting it
        counts as reuse: the whole session is revoked. So if someone else used the window,
        the device's next refresh ends the session. After 60 seconds, or once the newer token has been
        presented, reuse is theft as above.

        **Web (cookie mode).** With `X-Auth-Transport: cookie` the token comes from the
        `__Secure-pb_refresh` cookie and the body is `{}`; see the `auth` tag. The rules
        above are the same. The browser holds the token, so "retry with the token it still
        holds" means retrying with whatever cookie the browser has.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthTransport'
        - $ref: '#/components/parameters/RefreshCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              default:
                summary: Native app (body mode)
                value:
                  refresh_token: rt_9f2c1e6b7a8d4c3b9e0f1a2b3c4d5e6f
              cookie:
                summary: Web app (cookie mode, X-Auth-Transport cookie)
                value: {}
      responses:
        '200':
          $ref: '#/components/responses/TokenPair'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: |
            Refresh token unknown, expired, revoked or reused, or (cookie mode) no cookie.
            In cookie mode the response also clears the cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    code: unauthorized
                    message: Your session has ended. Sign in again.
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          description: |
            The refresh could not be completed right now (for example, a database lock
            conflict that persisted after one server-side retry). The presented token is
            unchanged and the session is kept; retry shortly with the same refresh token (the grace window still runs from the first rotation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    code: unavailable
                    message: Service temporarily unavailable.

  /auth/refresh/revoke:
    post:
      tags: [auth]
      operationId: revokeSession
      summary: Sign out (end the session and clear the refresh cookie)
      description: |
        Ends the session the presented refresh token belongs to. Every token descended
        from the same sign-in is revoked, so this browser or device is signed out. Other
        devices have their own sessions and stay signed in. Access tokens already issued
        stay valid until they expire (at most 15 minutes), so the app discards its own.

        Any refresh token the server knows revokes its session, whether current, already
        rotated or expired. An unknown token, or no cookie in cookie mode, revokes
        nothing. The answer is 204 in every one of these cases, so a retry is safe. In
        cookie mode the 204 also clears the cookie. When the server cannot complete the
        revoke right now it answers 503 `unavailable`: nothing is revoked and the cookie is
        not cleared, so retry shortly.

        **Web app.** It must call this to sign out, because script cannot delete an
        httpOnly cookie. Until the call succeeds, the cookie would sign the user back in
        on the next reload. If the call does not complete (for example offline, or a 503),
        the app keeps a "sign-out pending" flag, which holds no token and may sit in
        `localStorage`. While the flag is set the app does not call `POST /auth/refresh`,
        and it retries this call first. After `DELETE /me` it also calls this endpoint,
        only to clear the cookie (the session is already revoked).

        **Native apps** may call it in body mode on sign-out. They delete their stored
        tokens whatever the result.

        Rate-limited per IP like every endpoint. The token is never logged.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthTransport'
        - $ref: '#/components/parameters/RefreshCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              default:
                summary: Native app (body mode)
                value:
                  refresh_token: rt_1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
              cookie:
                summary: Web app (cookie mode, X-Auth-Transport cookie)
                value: {}
      responses:
        '204':
          description: Signed out (or there was nothing to revoke). In cookie mode the cookie is cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          description: |
            The revoke could not be completed right now (for example, a database lock
            conflict that persisted after one server-side retry). Nothing was revoked and,
            in cookie mode, the cookie is not cleared; retry shortly. The web app keeps its
            "sign-out pending" flag until a retry answers 204.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    code: unavailable
                    message: Service temporarily unavailable.

  /sync:
    post:
      tags: [sync]
      operationId: sync
      summary: Push local changes and pull server changes
      description: |
        One round trip of offline-first sync.

        **Push.** `changes` carries every record the device created, edited or deleted since
        its last successful sync. Each record carries `version`: the server version the
        device last saw for that record (0 for a record the server has never seen). The
        server applies a record only when that version matches the stored one, then stores
        it as `version + 1`. Every pushed record appears in exactly one of `applied` or
        `conflicts` in the 200 response. A refused request (any 4xx) applies nothing.

        **Conflicts.** On a version mismatch the edit with the later `updated_at` wins for
        the whole record (ties go to the server). The losing copy is kept in the server's
        conflict log. `conflicts[].resolution` says which side won and `server_record` is
        the record as now stored; the device replaces its local copy with it.

        **Replaced record.** A `client_won` conflict also carries `replaced_record`: the
        server's copy that the device's edit replaced, exactly as it was stored, at version
        `server_version` - 1. It is the same copy the conflict log keeps, so the device can
        combine it with its own edit without the log. The server never merges records:
        `server_record` is still the device's edit as stored. A device that merges stores
        the result locally and pushes it as an ordinary edit at version `server_version`,
        version-checked like any other push. Which tables can be merged, and when a merge is
        safe, is the app's rule; a device that does not merge ignores the field. On
        `server_won` (idempotent retries included) the field is absent, because the losing
        copy is the device's own push. So if the answer to a `client_won` push is lost, the
        device's retry resolves as an idempotent `server_won` without `replaced_record`, and
        the other device's copy is then only in the server's conflict log. Servers built
        against contract 0.1.19 or earlier never send it, so a `client_won` conflict without
        it leaves the replaced copy only in the conflict log, and the device keeps
        `server_record` as before. A response carries at most one `replaced_record` per
        pushed record; they do not count toward the 500-record page limit on pulled
        `changes`.

        **Conflict log retention.** The log is bounded per user: the server keeps each
        user's newest 1,000 entries and drops entries older than 90 days. Pruning runs when
        a later conflict is logged for that user, so until then an entry can be older than
        90 days. The log is a safety net for recovering a lost edit, not a full history.

        **Retries are idempotent.** A device that loses the response to a successful sync
        re-sends the same records with the same, now stale, `version`. A retry is any
        pushed record whose content, apart from `version` and `updated_at`, is identical to
        the stored record (`updated_at` is excluded because the server may have clamped it
        on the first attempt). The backend resolves each retry as a conflict with
        `resolution: server_won`, `client_version` = the version the device sent and a
        `server_record` equal to the stored record. Nothing is written and
        nothing is lost, so the backend does not add these to the conflict log. The app
        must not surface them as real conflicts: when every field of `server_record` except
        `version` and `updated_at` equals the copy it pushed, it silently adopts
        `server_record.version` and `server_record.updated_at`.
        Any other `server_won` or `client_won` result is a real conflict.

        **Deletes** are soft: set `deleted_at`. Tombstones travel like any other change so
        the delete reaches every device.

        **Pull.** `changes` in the response holds records changed on the server since the
        request `cursor` (all of the user's records when `cursor` is null; tombstones may be
        omitted then). Records the device just pushed are not echoed back; their new
        versions are in `applied`. If `has_more` is true, call again with the returned
        cursor and no changes until it is false.

        **Record ids** are UUIDs made on the device. Records that are unique per natural
        key use a deterministic UUIDv5 so two offline devices produce the same id:
        UUIDv5 (RFC 9562, formerly RFC 4122: SHA-1, version 5) with namespace = the
        user's id (`User.id`, parsed as a UUID) and name = the UTF-8 bytes of
        `<table>:<key>` (never case-folded). The resulting id is written in lowercase
        canonical form. The key per table:

        | Table | Key | Example name |
        | --- | --- | --- |
        | `profiles` | the literal `me` | `profiles:me` |
        | `settings` | the literal `me` | `settings:me` |
        | `day_notes`, `workouts`, `weights`, `measurements` | `date` as `YYYY-MM-DD` | `day_notes:2026-10-08` |
        | `lift_stats` | the record's `exercise` field, as sent | `lift_stats:Barbell Bench Press` |
        | `swaps` | the record's `from` field (the source exercise), as sent | `swaps:Barbell Bench Press` |

        Exercise names are used unnormalised: no trimming, case folding or Unicode
        normalisation. All other tables use random UUIDv4 ids. Test vectors (user id,
        table, key, expected id) are in `packages/api/test-vectors/sync-ids.json`.
        Devices send lowercase ids; the server lowercases any id it receives and echoes it
        lowercased in `applied` and `conflicts`. The server recomputes the id of every
        pushed natural-key record; if one does not match, the whole request fails with 400
        `invalid_request` and nothing is applied. The error's `details` entry carries the
        record's path in `field` (`changes.<table>[<i>].id`) and the issue
        `natural_key_id`, never the id value.

        **New records.** A record unknown to the server is stored as version 1 and listed
        in `applied`, whatever `version` the device sent.

        **Derived data is not synced.** Stores the prototype keeps that can be rebuilt from
        synced records have no table. The app rebuilds them locally after every pull; see
        `Workout` for the prototype's `sessions` store.

        Limits: at most 500 records in total per request and per response page, and a
        request body of at most 2 MB (400 `invalid_request`, issue `too_large`; see the
        wire conventions). A `too_large` rejection names no record, so the client keeps
        each request under 2 MB, sending fewer records per request when needed.
        `updated_at` values more than 5 minutes in the future are clamped to server time.

        **Account record cap.** Each account stores at most `limit` records across all
        synced tables. Every stored record counts once, tombstones included (they stay
        stored so a delete reaches every device). The conflict log does not count; it is
        bounded on its own (see Conflict log retention). `limit` is server configuration,
        the same for every account and set far above what years of real logging reach. The
        app reads it from the error body and never hard-codes it.
        - A pushed record is new when the server does not store a record with that id in
          that table for this account, whatever `version` the device sent. The same id
          in another table or another account does not count. Natural-key ids are checked
          (400 `natural_key_id`) before the cap, so a natural-key record whose key is
          already stored always carries the stored id and is never new. Edits, deletes and
          idempotent retries of stored records never add a record.
        - The server refuses a request only when it has at least one new record and the
          stored count plus the new records would exceed `limit`. A push without new
          records and a pull-only request (`changes: {}`) are never refused for the cap,
          even when `stored` is already over `limit` (for example after the limit was
          lowered). A refused request gets 413 `account_full` and a `record_cap` body.
          Nothing is applied, nothing is pulled, the cursor does not move and nothing is
          added to the conflict log. There is no partial apply.
        - Checks run in this order: body size (400 `too_large`), access token (401),
          rate limit (429), request validation including natural-key ids (400), then the
          cap (413). A 413 `account_full` therefore means the request was otherwise valid.
        - The count and the apply happen in one transaction, serialised per account, so
          concurrent pushes from two devices cannot overrun the cap.

        **App on 413 `account_full`.** The app keeps every pending change on the device
        and never drops one, except the never-sent random-id tombstones described below. It tells the user that the account is full and that new
        entries stay on this device and are not backed up. Until the limit changes it keeps
        syncing without the records that would be new: it pushes only pending records with
        `version` greater than 0 (edits and deletes of records already synced), and pulls
        as usual. It may also push up to `max(0, limit - stored)` of the held records in
        one request. It retries the rest on the next app launch and at most once a day
        while the app stays open, because the limit can be raised without an app release.

        Two kinds of held record may not be new to the server, and the app must not hold
        them forever:
        - A record whose first push succeeded but whose response was lost still has
          `version` 0 on the device, though the server stores it.
        - A version-0 tombstone (a record created and deleted offline) is on the server
          only if an earlier push carried it, again with a lost response. Otherwise it
          never left this device.

        So the retry sends held records in small batches (for example 20). A batch of
        records the server already stores comes back as idempotent retries
        (`server_won`) and leaves the queue. Only batches with really new records are
        refused again.

        A version-0 tombstone that was never included in any request is dropped only in a
        table with random UUIDv4 ids (`consents`, `food_logs`, `water_logs`, `workout_sets`,
        `user_foods`, `recipes`, `kitchen_tests`, `exclusions`): its id cannot be on the
        server or another device, and it holds no data, so the app drops it instead of
        pushing it. A never-sent tombstone in a natural-key table (`profiles`, `settings`,
        `day_notes`, `workouts`, `weights`, `measurements`, `lift_stats`, `swaps`) is held
        and retried like any held record, because another device can already have stored
        a record with the same UUIDv5 id. When the server stores that id the push is not
        new, so it is never refused for the cap; it comes back in `conflicts`, settled by
        `updated_at` like any conflict, and the app adopts `server_record`.

        A 413 is `account_full` only when its body is an `Error` with that code. A 413
        with any other body, including an empty or non-JSON one from a proxy that refuses
        a large body, is the body size refusal, handled like `too_large`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
            examples:
              firstSync:
                summary: First sync from a new device, nothing to push
                value:
                  cursor: null
                  changes: {}
              pushMealAndSet:
                summary: Push a logged meal, a ticked set, its lift stats and a deleted water entry
                description: Natural-key ids (here `workouts:2026-10-08` and `lift_stats:Barbell Bench Press`) are the real UUIDv5 values for the example user `a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d`; see `test-vectors/sync-ids.json`.
                value:
                  cursor: c_000000000000a3f1
                  changes:
                    food_logs:
                      - id: 6f1c2a9e-3b7d-4c51-9a0e-2d4b8f7e1c33
