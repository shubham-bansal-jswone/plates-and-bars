              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRecipeResponse'
              examples:
                default:
                  value:
                    name: Dal tadka
                    katoris: 6
                    ingredients:
                      - ingredient: Toor dal (dry)
                        amount: 200
                        unit: g
                      - ingredient: Ghee
                        amount: 10
                        unit: g
                    steps:
                      - Pressure cook the dal with turmeric for 15 min.
                      - Temper with ghee and jeera and pour over the dal.
                    unmatched: [salt, jeera]
                    quota:
                      limit: 10
                      remaining: 7
                      resets_at: '2026-10-10T00:00:00Z'
