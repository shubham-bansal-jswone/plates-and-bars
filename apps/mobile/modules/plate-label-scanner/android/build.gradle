plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.plateandbar.labelscan'
version = '0.1.0'

android {
  namespace "app.plateandbar.labelscan"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  // A NewApi error (a call above minSdk 24) must fail the build, as in the pose module (#1008): the Expo plugin turns abortOnError off.
  lint {
    abortOnError true
  }
}

// Tesseract4Android is built by us and vendored, not resolved from JitPack (JitPack could not rebuild the 4.9.0 tag after upstream moved it,
// and nothing pinned the artifact). The AAR is in libs-maven/ (see the README there) and is the only thing this repository may serve:
// it is the only repository that may serve the group app.plateandbar.vendor (exclusiveContent), so
// the unfiltered jitpack.io entry in the Expo template cannot answer for it. The group is ours: upstream's cz.adaptech is one JitPack serves.
//   source:  https://github.com/adaptech-cz/Tesseract4Android at d7de990ef78f70d553e327b98b3992d11863f134
//            ("Fix CMake build", 2025-06-11, the last commit before the 4.9.0 release was published; the tag now points at 15c5347)
//   build:   infra/scripts/build-tesseract4android.sh (upstream's AGP 8.10.1 and Gradle 8.11.1, NDK 27.1.12297006, CMake 3.22.1, standard release)
//   sha256:  e6226ad06b34aaf4ab4f642d2b8e40fa86172e84bd4e5fc9066d2217472bc78a  tesseract4android-4.9.0.aar
// The hash is checked by VendoredAarTest.kt (Gradle unit test) and by __tests__/label-ocr-assets.test.ts (jest), so a changed file fails CI.
// Repositories are per project, and the app (:app) resolves this module's dependencies in its own configuration, so the repository is added to
// every project of the build, not only to this one.
def vendoredMaven = uri("$projectDir/libs-maven")
rootProject.allprojects {
  repositories {
    exclusiveContent {
      forRepository {
        maven { url = vendoredMaven }
      }
      filter {
        includeGroup 'app.plateandbar.vendor'
      }
    }
  }
}

// Open-source only (ADR 010): Tesseract4Android 4.9.0 as built above (Apache-2.0; Tesseract 5.5.1, Leptonica 1.85.0, libjpeg 9f, libpng 1.6.48) and
// AndroidX ExifInterface (Apache-2.0, already in the app). No ML Kit, no Play services. The versions are the ones scripts/licences.mjs
// has a checked row for; a change needs the rows and scripts/android-classpath.txt updated.
dependencies {
  implementation 'app.plateandbar.vendor:tesseract4android:4.9.0'
  implementation 'androidx.exifinterface:exifinterface:1.4.1'
  testImplementation 'junit:junit:4.13.2'
}
