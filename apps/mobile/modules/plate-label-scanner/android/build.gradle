plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.plateandbar.labelscan'
version = '0.1.0'

android {
  namespace "app.plateandbar.labelscan"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  // A NewApi error (a call above minSdk 24) must fail the build, as in the pose module (#1008): the Expo plugin turns abortOnError off.
  lint {
    abortOnError true
  }
}

// Tesseract4Android is not on Maven Central or Google Maven: it is published only by JitPack, which builds it from the tag of
// https://github.com/adaptech-cz/Tesseract4Android. The repository is limited to that one group, so nothing else can resolve from it.
// The AAR was checked on 2026-10-19: sha256 bce5d6413a1a5ae3d7240033fbbc851ba3217d0a08d9769400e17a077f42cb2a (tesseract4android-4.9.0.aar).
repositories {
  maven {
    url 'https://jitpack.io'
    content {
      includeGroup 'com.github.adaptech-cz.Tesseract4Android'
    }
  }
}

// Open-source only (ADR 010): Tesseract4Android 4.9.0 (Apache-2.0; Tesseract 5.5.1, Leptonica 1.85.0, libjpeg 9f, libpng 1.6.48) and
// AndroidX ExifInterface (Apache-2.0, already in the app). No ML Kit, no Play services. The versions are the ones scripts/licences.mjs
// has a checked row for; a change needs the rows and scripts/android-classpath.txt updated.
dependencies {
  implementation 'com.github.adaptech-cz.Tesseract4Android:tesseract4android:4.9.0'
  implementation 'androidx.exifinterface:exifinterface:1.4.1'
  testImplementation 'junit:junit:4.13.2'
}
