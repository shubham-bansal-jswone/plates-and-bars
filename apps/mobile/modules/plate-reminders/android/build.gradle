plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.plateandbar'
version = '1.0.0'

android {
  namespace "app.plateandbar.reminders"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  // A NewApi error (a call above minSdk) must fail the build: it crashes older phones at the moment a reminder fires.
  lint {
    abortOnError true
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
