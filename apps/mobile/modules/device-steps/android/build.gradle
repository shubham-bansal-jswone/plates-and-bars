plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.plateandbar'
version = '0.1.0'

android {
  namespace "app.plateandbar.devicesteps"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  // The Expo module Gradle plugin turns abortOnError off; a lint error must fail the build (#1023).
  lint {
    abortOnError true
  }
}
