name: Site deploy

# Static Astro build from apps/site. Disabled until the owner sets the
# repository variable SITE_DEPLOY_TARGET (Settings > Secrets and variables >
# Actions > Variables) to one of:
#   github-pages  deploy with GitHub Pages (needs Settings > Pages > Source: GitHub Actions
#                 and a custom domain, because the site is built for the domain root)
#   caddy         rsync dist/ over SSH to a VM served by Caddy (see infra/caddy/Caddyfile.site)
# Unset or any other value: every job is skipped. See infra/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  build:
    name: build site
    if: vars.SITE_DEPLOY_TARGET == 'github-pages' || vars.SITE_DEPLOY_TARGET == 'caddy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - if: vars.SITE_DEPLOY_TARGET == 'github-pages'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist
      - if: vars.SITE_DEPLOY_TARGET == 'caddy'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: apps/site/dist
          if-no-files-found: error

  deploy-pages:
    name: deploy (GitHub Pages)
    needs: build
    if: vars.SITE_DEPLOY_TARGET == 'github-pages'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-caddy:
    name: deploy (Caddy VM)
    needs: build
    if: vars.SITE_DEPLOY_TARGET == 'caddy'
    runs-on: ubuntu-latest
    environment: site
    env:
      # Secrets: SITE_SSH_KEY (private key), SITE_SSH_KNOWN_HOSTS (output of ssh-keyscan -t ed25519 host)
      # Variables: SITE_SSH_HOST, SITE_SSH_USER, SITE_WEB_ROOT (for example /srv/site)
      SSH_HOST: ${{ vars.SITE_SSH_HOST }}
      SSH_USER: ${{ vars.SITE_SSH_USER }}
      WEB_ROOT: ${{ vars.SITE_WEB_ROOT }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist
      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.SITE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SITE_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Sync
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            dist/ "$SSH_USER@$SSH_HOST:$WEB_ROOT/"
