name: Staging config

# Validates infra/staging without deploying anything. Path-filtered on purpose: it is not a required check.
on:
  pull_request:
    paths:
      - 'infra/staging/**'
      - 'infra/caddy/**'
      - '.github/workflows/staging-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: staging compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/staging
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config with .env.example
        run: docker compose --env-file .env.example config --quiet
      - name: required secrets must have no default
        run: |
          for v in MYSQL_ROOT_PASSWORD DB_PASSWORD JWT_SIGNING_KEY SMTP_HOST SMTP_FROM API_HOST API_TAG; do
            sed "/^$v=/d" .env.example > one-missing.env
            if env -i PATH="$PATH" docker compose --env-file one-missing.env config --quiet 2> err.txt; then
              echo "::error::compose config passed without $v: it must be required (\${$v:?...})"; exit 1
            fi
            grep -q "required variable $v" err.txt
          done
      - name: shellcheck
        run: shellcheck backup.sh test-backup.sh logcap.sh test-logcap.sh deploy.sh test-deploy.sh release.sh test-release.sh
      - name: backup.sh against a stub docker
        run: ./test-backup.sh
      - name: logcap.sh on a fake containers tree (14-day cap)
        run: ./test-logcap.sh
      - name: deploy.sh against stubs (rollback on a failed health check)
        run: ./test-deploy.sh
      - name: release.sh against stubs (backup first, no deploy after a failed backup)
        run: ./test-release.sh
      - name: every image is pinned to a version
        run: |
          if docker compose --env-file .env.example config --images | grep -E ':latest$|^[^:]+$' | grep -v '^plateandbar-api:'; then
            echo "::error::unpinned image"; exit 1
          fi
          grep -Eq '^rclone_image="rclone/rclone:[0-9]+\.[0-9]+\.[0-9]+"$' backup.sh
          grep -Eq 'busybox:[0-9]+\.[0-9]+\.[0-9]+ sh -s' backup.sh
      - name: every service uses the local log driver with a size bound
        run: |
          test "$(docker compose --env-file .env.example config | grep -c -E '^      driver: local$')" = 3
          docker compose --env-file .env.example config | grep -q 'max-size: 10m'
          docker compose --env-file .env.example config | grep -q 'max-file: "5"'
