name: CI

# One workflow so required checks always report: path filtering is done in the
# `changes` job, and jobs that do not apply are skipped (a skipped job counts
# as passing for branch protection). A path-filtered `on:` would leave
# required checks pending forever.
on:
  pull_request:
  push:
    branches: [main, design-overhaul]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      run_api: ${{ steps.d.outputs.run_api }}
      run_core: ${{ steps.d.outputs.run_core }}
      run_mobile: ${{ steps.d.outputs.run_mobile }}
      run_backend: ${{ steps.d.outputs.run_backend }}
      run_tools: ${{ steps.d.outputs.run_tools }}
      run_play_listing: ${{ steps.d.outputs.run_play_listing }}
      run_site: ${{ steps.d.outputs.run_site }}
      run_content_meta: ${{ steps.d.outputs.run_content_meta }}
      run_e2e: ${{ steps.d.outputs.run_e2e }}
      run_e2e_sync: ${{ steps.d.outputs.run_e2e_sync }}
      run_opencode_agents: ${{ steps.d.outputs.run_opencode_agents }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: d
        env:
          # HEAD is the merge commit on PRs; HEAD^1 is the current base tip
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: infra/scripts/detect-changes.sh "$BASE"
      - name: detect-changes.sh sample diffs
        run: infra/scripts/test-detect-changes.sh
      # `expo prebuild` writes apps/mobile/android/, apps/mobile/ios/ and a package.json whose
      # scripts are in the run: form. None of it belongs in the history (#980); the native folders
      # are ignored by apps/mobile/.gitignore and android-release.yml builds them in CI.
      - name: No expo prebuild output committed
        run: infra/scripts/check-prebuild-output.sh
      - name: check-prebuild-output.sh sample trees
        run: infra/scripts/test-check-prebuild-output.sh

  api:
    name: api (lint, types, stale client)
    needs: changes
    if: needs.changes.outputs.run_api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/api/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: No untracked files in generated client
        run: |
          if [ -n "$(git status --porcelain -- client)" ]; then
            echo "::error::packages/api/client is stale. Run 'npm run generate' in packages/api and commit the result."
            exit 1
          fi

  npm-audit:
    name: npm audit (api)
    needs: changes
    if: needs.changes.outputs.run_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --audit-level=high --omit=dev
        working-directory: packages/api

  core:
    name: core (lint, types, tests)
    needs: changes
    if: needs.changes.outputs.run_core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/core/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  mobile:
    name: mobile (lint, types, tests)
    needs: changes
    if: needs.changes.outputs.run_mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Metro resolution (for example of packages/core) is not covered by Jest
      - run: npx expo export --platform web

  # apps/mobile/src/content/bundled.json records each content file's sha256, schema_version and updated_at.
  # Shallow checkout everywhere, so the script compares hashes and schema versions exactly and only sanity-checks each
  # date (UTC format, not later than HEAD; #412): a PR cannot know its own squash-merge date, and comparing exact dates
  # on main would turn main red after every content merge. A stale
  # (older) updated_at is harmless apart from one redundant download on some devices; see infra/README.md.
  # Regenerate with `node scripts/content-meta.mjs` on a full-history checkout of main before each mobile release.
  # .opencode/agents is generated from .claude/agents (#1352): regenerate and fail on any drift
  opencode-agents:
    name: opencode-agents (in sync with .claude/agents)
    needs: changes
    if: needs.changes.outputs.run_opencode_agents == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .opencode/generate-agents.mjs
      - name: Generated agents match the committed ones
        run: git diff --exit-code .opencode/agents

  content-meta:
    name: content-meta (bundled.json)
    needs: changes
    if: needs.changes.outputs.run_content_meta == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/content-meta.mjs --check
        working-directory: apps/mobile

  tools:
    name: tools (lint, tests, validate)
    needs: changes
    if: needs.changes.outputs.run_tools == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node validate/cli.mjs
      # ADR 002/005: no IFCT or INDB in content, app content, seed data or backend resources (fast, reads a few small folders)
      - run: npm run check:sources

  # docs/PLAY-STORE-LISTING.md must stay within Google's character limits, carry no placeholder or AI vendor name, and
  # repeat the setup disclaimer in apps/mobile/src/setup/copy.ts word for word (#832, #851). The script uses only
  # node:fs and node:url, so there is no install step.
  play-listing:
    name: play listing (check)
    needs: changes
    if: needs.changes.outputs.run_play_listing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node docs/check-play-listing.mjs

  backend:
    name: backend (gradle build)
    needs: changes
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest # Docker is preinstalled, so Testcontainers works
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic # MIT-only path; the default 'enhanced' loads proprietary gradle-actions-caching
      - run: ./gradlew build --no-daemon

  site:
    name: site (build, check, a11y)
    needs: changes
    if: needs.changes.outputs.run_site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Astro 7.4 needs Node >=22.23.4; the runner image can ship an older cached 22.x
          check-latest: true
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
      # Open-source Chromium (BSD-3-Clause) via @puppeteer/browsers (Apache-2.0), not proprietary Google Chrome
      - name: Install Chromium
        run: |
          # lockfile-pinned @puppeteer/browsers from apps/site (npm ci already ran); no network fetch of the tool
          out="$(npx --no-install @puppeteer/browsers install chromium@latest --path "$RUNNER_TEMP/browsers")"
          echo "$out"
          echo "CHROME_PATH=${out##* }" >> "$GITHUB_ENV"
      - name: Chromium is available
        run: '"$CHROME_PATH" --version'
      # Ubuntu 24.04 runners block unprivileged user namespaces via AppArmor, which Chromium's
      # sandbox needs. Relax that on this throwaway runner so the sandbox stays enabled
      # (we do not pass --no-sandbox).
      - name: Allow Chromium sandbox (unprivileged user namespaces)
        working-directory: .
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run a11y
      # The landing page's "Open the web app" button and the deletion page's "Delete on the web" section only
      # render when PUBLIC_WEB_APP_URL is set (#859), so check them too. a11y rebuilds dist/ with this env.
      - name: a11y with PUBLIC_WEB_APP_URL set
        env:
          PUBLIC_WEB_APP_URL: https://app.example.test
        run: npm run a11y

  e2e:
    name: e2e (web, Playwright)
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            tests/e2e/package-lock.json
      - name: Build the web app
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1 # Expo CLI sends telemetry otherwise
        run: |
          npm ci
          npx expo export --platform web
      - name: Install test dependencies
        working-directory: tests/e2e
        run: npm ci
      # Playwright (Apache-2.0) drives open-source Chromium (BSD-3-Clause) installed with @puppeteer/browsers
      # (Apache-2.0), as in the site job. Playwright's own browser download (Microsoft CDN builds) is not used.
      - name: Install Chromium
        working-directory: tests/e2e
        run: |
          out="$(npx --no-install @puppeteer/browsers install chromium@latest --path "$RUNNER_TEMP/browsers")"
          echo "$out"
          echo "CHROME_PATH=${out##* }" >> "$GITHUB_ENV"
      - name: Chromium is available
        run: '"$CHROME_PATH" --version'
      # Same sandbox note as the site job: keep the Chromium sandbox on and relax the runner's AppArmor rule.
      - name: Allow Chromium sandbox (unprivileged user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Port handling (taken port fails fast, E2E_REUSE=1 reuses)
        working-directory: tests/e2e
        run: npm run test:port
      - name: Playwright tests
        working-directory: tests/e2e
        run: npx playwright test
      # Live pose tracking (#947) is off in the build above. Its own build has the flag on; the spec runs it with a fake camera.
      - name: Build the web app with live pose tracking on
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_POSE_TRACKING: 1
        run: npx expo export --platform web --output-dir ../../tests/e2e/.pose-dist
      - name: Pose tracking tests
        working-directory: tests/e2e
        run: npm run test:pose
      # Barcode scanning (#944) is off in the builds above. Its own build has the flag on; Linux Chromium has no BarcodeDetector, so the zxing-wasm fallback runs.
      - name: Build the web app with barcode scanning on
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_BARCODE_SCAN: 1
        run: npx expo export --platform web --output-dir ../../tests/e2e/.barcode-dist
      - name: Barcode tests
        working-directory: tests/e2e
        run: |
          echo "::notice::Linux Chromium has no built-in BarcodeDetector: the zxing-wasm fallback is exercised and the native-detector test skips."
          npm run test:barcode
      # Label scanning (#1067) is off in the builds above. Its own build has the flag on; the spec reads a committed synthetic label with the self-hosted tesseract.js.
      - name: Build the web app with label scanning on
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_LABEL_SCAN: 1
        run: npx expo export --platform web --output-dir ../../tests/e2e/.label-dist
      - name: Label scan tests
        working-directory: tests/e2e
        run: npm run test:label
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-traces
          path: |
            tests/e2e/test-results/
            tests/e2e/.barcode-dist/
            tests/e2e/.label-dist/
          retention-days: 7

  e2e-sync:
    name: e2e (sync, Playwright + backend stack)
    needs: changes
    if: needs.changes.outputs.run_e2e_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # content-updated-at.sh reads each bundle's commit date
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            tests/e2e/package-lock.json
      - name: Start the backend stack (MySQL, API, Mailpit)
        working-directory: tests/e2e/stack
        run: |
          export CONTENT_UPDATED_AT="$(../../../backend/scripts/content-updated-at.sh)"
          docker compose build api
          docker compose up -d --wait
      - name: Build the web app with the API URL
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_API_URL: http://127.0.0.1:18080/api/v1
        run: |
          npm ci
          npx expo export --platform web --output-dir ../../tests/e2e/.sync-dist
      - name: Install test dependencies
        working-directory: tests/e2e
        run: npm ci
      - name: Install Chromium
        working-directory: tests/e2e
        run: |
          out="$(npx --no-install @puppeteer/browsers install chromium@latest --path "$RUNNER_TEMP/browsers")"
          echo "$out"
          echo "CHROME_PATH=${out##* }" >> "$GITHUB_ENV"
      - name: Allow Chromium sandbox (unprivileged user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Sync tests
        working-directory: tests/e2e
        run: npm run test:sync
      - name: Stack logs
        if: failure()
        working-directory: tests/e2e/stack
        run: docker compose logs --no-color api | tail -200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-sync-traces
          path: tests/e2e/test-results/
          retention-days: 7
