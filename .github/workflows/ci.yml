name: CI

# One workflow so required checks always report: path filtering is done in the
# `changes` job, and jobs that do not apply are skipped (a skipped job counts
# as passing for branch protection). A path-filtered `on:` would leave
# required checks pending forever.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      run_api: ${{ steps.d.outputs.run_api }}
      run_core: ${{ steps.d.outputs.run_core }}
      run_mobile: ${{ steps.d.outputs.run_mobile }}
      run_backend: ${{ steps.d.outputs.run_backend }}
      run_tools: ${{ steps.d.outputs.run_tools }}
      run_site: ${{ steps.d.outputs.run_site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: d
        env:
          # HEAD is the merge commit on PRs; HEAD^1 is the current base tip
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: infra/scripts/detect-changes.sh "$BASE"

  api:
    name: api (lint, types, stale client)
    needs: changes
    if: needs.changes.outputs.run_api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/api/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: No untracked files in generated client
        run: |
          if [ -n "$(git status --porcelain -- client)" ]; then
            echo "::error::packages/api/client is stale. Run 'npm run generate' in packages/api and commit the result."
            exit 1
          fi

  npm-audit:
    name: npm audit (api)
    needs: changes
    if: needs.changes.outputs.run_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --audit-level=high --omit=dev
        working-directory: packages/api

  core:
    name: core (lint, types, tests)
    needs: changes
    if: needs.changes.outputs.run_core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/core/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  mobile:
    name: mobile (lint, types, tests)
    needs: changes
    if: needs.changes.outputs.run_mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Metro resolution (for example of packages/core) is not covered by Jest
      - run: npx expo export --platform web

  tools:
    name: tools (lint, tests, validate)
    needs: changes
    if: needs.changes.outputs.run_tools == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node validate/cli.mjs

  backend:
    name: backend (gradle build)
    needs: changes
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest # Docker is preinstalled, so Testcontainers works
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic # MIT-only path; the default 'enhanced' loads proprietary gradle-actions-caching
      - run: ./gradlew build --no-daemon

  site:
    name: site (build, check, a11y)
    needs: changes
    if: needs.changes.outputs.run_site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    env:
      # The ubuntu-latest runner image ships Google Chrome; a11y.mjs reads CHROME_PATH
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Chrome is available
        run: '"$CHROME_PATH" --version'
      - run: npm run a11y
