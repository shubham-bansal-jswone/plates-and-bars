name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz; update together with the version
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned checksum)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/$tgz" "$base/$tgz"
          echo "$GITLEAKS_SHA256  /tmp/$tgz" | sha256sum -c -
          tar -xzf "/tmp/$tgz" -C /usr/local/bin gitleaks
      # gitleaks defaults to `git log --all`, so one branch's finding would fail every PR.
      # PR: checkout is the tested merge commit; HEAD^1 is the base tip, so HEAD^1..HEAD is
      # only the PR's own commits. Push to main and schedule: HEAD is main, full history.
      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --log-opts="HEAD^1..HEAD"
      - name: Scan main history
        if: github.event_name != 'pull_request'
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --log-opts="HEAD"

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # braces <= 3.0.3 (high) has no patched release and 3.0.3 is the latest. It reaches
          # apps/mobile through micromatch 4 in Metro (expo -> @expo/metro -> metro-file-map) and
          # Jest: build and test tooling, not in the app bundle. Remove when braces ships a fix
          # or micromatch drops it (tracked in #79).
          # node-forge <= 1.4.0 (high, GHSA-86w9-cpqp-85rv) has no patched release; 1.4.0 is the
          # latest. It reaches apps/mobile only through @expo/cli (@expo/code-signing-certificates for
          # the CLI, and @expo/cli directly), build tooling not in the app bundle. Re-check if
          # expo-updates or expo-dev-client is added. Same exit rule, #79.
          allow-ghsas: GHSA-vfj7-8cjw-p6xm, GHSA-86w9-cpqp-85rv
