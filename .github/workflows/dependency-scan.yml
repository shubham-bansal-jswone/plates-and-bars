name: dependency-scan

# Weekly scan for high and critical advisories in everything we ship or build with (#930): npm audit per package
# (packages/api, packages/core, apps/mobile, apps/site, tools) and OSV-Scanner on the backend's Gradle runtime
# classpath. Findings open or update one tracking issue (closed again when clean); the run fails on a tool error or a
# waiver problem (infra/dependency-scan/waivers.tsv: an entry that matches nothing, or past its re-check date).
# The repo is public and the advisories are public, so the issue lists only package, version, advisory id, severity and
# fixed version (owner decision on #935); no exploit detail.
# Pull requests only run the offline tests of the scan scripts and lint. Nothing here uses `${{ }}` inside run:.
on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC, after the 03:17 gitleaks sweep
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/dependency-scan.yml"
      - "infra/dependency-scan/**"
      - ".github/workflows/security.yml" # its allow-ghsas must match waivers.tsv (checked by the test job)

permissions:
  contents: read

jobs:
  test:
    name: scan scripts (tests, shellcheck, actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: infra/dependency-scan/test-dependency-scan.sh
      - run: shellcheck infra/dependency-scan/*.sh
      - name: actionlint (pinned checksum)
        env:
          ACTIONLINT_VERSION: 1.7.7
          # sha256 of actionlint_1.7.7_linux_amd64.tar.gz; update together with the version
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "/tmp/$tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tgz"
          echo "$ACTIONLINT_SHA256  /tmp/$tgz" | sha256sum -c -
          tar -xzf "/tmp/$tgz" -C /tmp actionlint
          /tmp/actionlint .github/workflows/dependency-scan.yml

  scan:
    name: scan and report
    # main only: a manual run on another branch would read that branch's waivers and could edit or close the tracking issue
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dependency-scan # one writer of the tracking issue at a time
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write # only to open, update and close the tracking issue
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # nothing here pushes, and gradle runs build logic in this job
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install OSV-Scanner (Apache-2.0, pinned checksum)
        env:
          OSV_VERSION: 2.7.0
          # sha256 of osv-scanner_linux_amd64; update together with the version
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -sSfL -o /tmp/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "$OSV_SHA256  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
      - name: Scan
        id: scan
        shell: bash # -eo pipefail, so a failing scan.sh is not hidden by tee
        env:
          OSV_SCANNER: /tmp/osv-scanner
          OUT: ${{ runner.temp }}/dependency-scan
        run: |
          infra/dependency-scan/scan.sh | tee -a "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          PROBLEMS: ${{ steps.scan.outputs.problems }}
          OUT: ${{ steps.scan.outputs.out }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ "$FINDINGS" =~ ^[0-9]+$ && "$PROBLEMS" =~ ^[0-9]+$ ]] || { echo "::error::scan produced no counts"; exit 1; }
          title="Dependency scan: open high or critical advisories"
          existing="$(gh issue list --state open --label infra --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ "$FINDINGS" -gt 0 ] || [ "$PROBLEMS" -gt 0 ]; then
            { cat "$OUT/report.md"; echo "Run: $RUN_URL"; echo; echo "This issue is updated by the weekly scan and closed when it comes back clean."; } > "$OUT/body.md"
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file "$OUT/body.md"
            else
              gh issue create --title "$title" --label infra --label security --body-file "$OUT/body.md"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Clean in $RUN_URL"
          fi
      - name: Fail on waiver problems
        env:
          PROBLEMS: ${{ steps.scan.outputs.problems }}
        run: |
          [[ "$PROBLEMS" =~ ^[0-9]+$ ]] || { echo "::error::scan produced no counts"; exit 1; }
          if [ "$PROBLEMS" -gt 0 ]; then
            echo "::error::$PROBLEMS waiver problem(s); see the run summary and infra/dependency-scan/waivers.tsv"
            exit 1
          fi
