name: Web app deploy

# Builds the Expo web export (apps/mobile) and publishes it to the Caddy VM that also runs the API (#683, Caddyfile.web;
# the web app must be on the same site as the API for the refresh cookie, #644). Disabled until the owner sets the
# repository variable WEB_DEPLOY_ENABLED to 'true' (Settings > Secrets and variables > Actions > Variables).
# Unset or any other value: the deploy job is skipped. Push to main deploys to the `staging` environment, a v* tag to
# `production` (protect it with required reviewers) only for vMAJOR.MINOR.PATCH tags whose commit is on main (the
# same rule as production-deploy.yml); manual runs from main use `staging`.
# Each environment holds:
#   variables  EXPO_PUBLIC_API_URL (https://<API_HOST>/api/v1, baked into the bundle; define it in each environment and
#              never as a repository variable, so one environment can never inherit another's API), WEB_SSH_HOST, WEB_SSH_USER,
#              WEB_ROOT (the VM directory mounted at /srv/web, for example /opt/plateandbar/infra/staging/web)
#   secrets    WEB_SSH_KEY (private key of a user that can write only WEB_ROOT), WEB_SSH_KNOWN_HOSTS (ssh-keyscan -t ed25519 host)
# See infra/README.md (Web app deploy) and infra/RUNBOOK.md section 7.
on:
  push:
    branches: [main]
    tags: ['v*']
    # No path filter on push: GitHub does not reliably combine `tags` with `paths`, and the export also bundles
    # packages/core, packages/api and content/, so a rebuild per merge is the simple, correct rule.
  pull_request:
    paths:
      - 'infra/caddy/**'
      - 'apps/mobile/public/_headers'
      - 'infra/scripts/check-api-url.sh'
      - 'infra/scripts/test-check-api-url.sh'
      - 'infra/scripts/check-web-root.sh'
      - 'infra/scripts/test-check-web-root.sh'
      - 'infra/scripts/test-web-caddy.sh'
      - 'infra/scripts/check-caddy-headers.sh'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR validation must never cancel a queued deploy
  # one group per environment: a staging run never replaces a pending production run, and a production run waiting for
  # approval does not hold up staging
  group: ${{ github.event_name == 'pull_request' && format('web-validate-{0}', github.ref) || format('web-deploy-{0}', startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate web Caddyfile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck infra/scripts/check-api-url.sh infra/scripts/test-check-api-url.sh infra/scripts/check-web-root.sh infra/scripts/test-check-web-root.sh infra/scripts/test-web-caddy.sh
      - name: API URL and web root checks (test)
        run: |
          infra/scripts/test-check-api-url.sh
          infra/scripts/test-check-web-root.sh
      - name: Caddyfile.web serves the isolation headers, caching and SPA fallback (official Caddy image, Apache-2.0)
        run: infra/scripts/test-web-caddy.sh

  deploy:
    name: deploy (web, Caddy VM)
    if: >-
      vars.WEB_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      SSH_HOST: ${{ vars.WEB_SSH_HOST }}
      SSH_USER: ${{ vars.WEB_SSH_USER }}
      WEB_ROOT: ${{ vars.WEB_ROOT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tag check needs origin/main
      - name: Check the tag and the settings before building
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::release tags must be vMAJOR.MINOR.PATCH, got '$REF_NAME'"
              exit 1
            fi
            # a release comes from main, never from a side branch
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "::error::$REF_NAME ($SHA) is not on main: tag a commit that was merged to main"
              exit 1
            fi
          fi
          infra/scripts/check-api-url.sh "$EXPO_PUBLIC_API_URL"
          : "${SSH_HOST:?WEB_SSH_HOST is not set}" "${SSH_USER:?WEB_SSH_USER is not set}" "${WEB_ROOT:?WEB_ROOT is not set}"
          # the values end up in ssh and rsync arguments and in a remote path: plain characters only
          printf '%s' "$SSH_USER" | grep -Eq '^[A-Za-z_][A-Za-z0-9_-]*$' || { echo "::error::WEB_SSH_USER must be a plain user name"; exit 1; }
          printf '%s' "$SSH_HOST" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.-]*$' || { echo "::error::WEB_SSH_HOST must be a plain host name or IPv4 address"; exit 1; }
          # rsync --delete: a plain absolute path under /srv, /var/www or /opt, no '.' or '..' segment
          infra/scripts/check-web-root.sh "$WEB_ROOT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Build the web export
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1 # Expo CLI sends telemetry otherwise
        run: |
          npm ci
          npx expo export --platform web
          test -s dist/index.html
      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.WEB_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WEB_SSH_KNOWN_HOSTS }}
        run: |
          : "${SSH_KEY:?WEB_SSH_KEY is not set}" "${KNOWN_HOSTS:?WEB_SSH_KNOWN_HOSTS is not set}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Sync
        working-directory: apps/mobile
        run: |
          ssh_cmd="ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes"
          # _headers is for Cloudflare Pages; Caddy ignores it. First everything but index.html (new hashed files are in
          # place before any page refers to them), then everything again, deleting only after the transfer (so index.html is replaced before any old file goes).
          rsync -az --exclude index.html --exclude _headers -e "$ssh_cmd" -- dist/ "$SSH_USER@$SSH_HOST:$WEB_ROOT/"
          rsync -az --delete-after --exclude _headers -e "$ssh_cmd" -- dist/ "$SSH_USER@$SSH_HOST:$WEB_ROOT/"
