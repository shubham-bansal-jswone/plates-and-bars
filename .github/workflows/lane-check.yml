name: Lane check

on:
  pull_request:

permissions:
  contents: read

jobs:
  lane-check:
    name: lane-check (warns only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # HEAD is the merge commit; HEAD^1 is the current base tip
      - run: infra/scripts/lane-check.sh HEAD^1
