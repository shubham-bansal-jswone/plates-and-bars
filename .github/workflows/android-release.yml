name: Android release build

# Builds an APK and an AAB with `expo prebuild` + Gradle. No EAS, no accounts.
# Without the keystore secrets the artefacts are debug-signed: installable for
# testing, NOT uploadable to Google Play. With them they are release-signed.
#
# Optional repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (base64 -w0 upload.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
#
# Repository variable (Settings > Secrets and variables > Actions > Variables):
#   ANDROID_API_URL            https://<API_HOST>/api/v1, baked into the build as EXPO_PUBLIC_API_URL. REQUIRED on v* tags (the job fails
#                              without it); optional, with a warning, on manual and PR runs. Not a secret.
# Optional variables of the `android-release` environment (all inert when unset; they reach only the Gradle step, which
# bundles the JS, never npm ci or expo prebuild):
#   EXPO_PUBLIC_SENTRY_DSN     error-tracking DSN baked into the build; empty = the app sends nothing. Set it only after the
#                              privacy page and the Play data-safety answers name crash reports (#748, #827).
#   EXPO_PUBLIC_SITE_URL       https origin of the website; the app hides its privacy, terms and deletion links without it (#825).
#                              REQUIRED on v* tags (the job fails without it: Play needs the privacy link).
#   EXPO_PUBLIC_BARCODE_SCAN   set to 1 to show the barcode scanner (#944); unset = off.
#   EXPO_PUBLIC_POSE_TRACKING  set to 1 to show "Track this set" pose tracking (Android camera); unset = off.
#   EXPO_PUBLIC_LABEL_SCAN     set to 1 to switch on label scanning (on-device OCR, #1067); unset = off.
#   EXPO_PUBLIC_EXERCISE_MOTION  set to 1 to play exercise motion loops where a clip exists (#1069); unset = off.
#   EXPO_PUBLIC_LAB_REPORTS    set to 1 to show Lab reports on the Progress tab and apply the lab hold (#1070); unset = off.
#   EXPO_PUBLIC_HOME_WIDGET    set to 1 to build the Android home-screen widget (#1181); unset = off. Unlike the others it is also passed
#                              to expo prebuild (the plugin reads it there). Set it only after the owner device check in #1181.
# PR runs and design-overhaul pushes (not manual runs) never get the DSN or the six flags (no environment, and the workflow blanks them).
# EXPO_PUBLIC_SENTRY_ENVIRONMENT is set here, not by you: `production` on a v* tag, `staging` otherwise.
# Nothing here uploads to Google Play: take the .aab from a v* tag run and upload it by hand. Staged rollout (10 % -> 50 % -> 100 %), halting
# a rollout and content-only fixes: infra/RUNBOOK.md section 8 and tests/e2e/RELEASE_CHECKLIST.md.
# android.versionCode comes from the tag (v1.2.3 -> 1002003) or, on non-tag runs, the run number; see
# infra/scripts/android-release-config.sh.
#
# Pull requests and design-overhaul pushes build a faster variant (assembleRelease for arm64-v8a only, no bundleRelease; the ABI is passed as
# -PreactNativeArchitectures so nothing is committed or edited). Pushes to main (same paths as the PR trigger), tags and
# manual runs build all four ABIs with assembleRelease bundleRelease, so a break in another ABI or in the AAB shows on main.
# Every run compiles the NDK code through ccache. Only pushes to main or design-overhaul and manual runs on them save the cache; pull requests
# only restore it (a PR-scoped cache is invisible to other PRs and would only evict the npm and Gradle caches).
# The ccache cap is 2G: a 4-ABI build with precompiled headers overflowed 400M (run 39226041548: 98.5 % of 1376 calls cacheable,
# cache full at 0.4 GB, 555 cleanups, 24.7 % hits), so ccache evicted its own objects mid-build. Each main run saves a new
# entry (run-id key); the `ccache-prune` job then deletes every older `ccache-*` entry, keeping only the newest (the next run
# restores the newest, so a second entry protects nothing). The repo cache is already over its 10 GB quota (about 10.7 GB in
# 46 entries on 2026-10-19, about 4.4 GB of it npm), so GitHub's least-recently-used eviction is already running; a 2G entry
# stays alive as long as android runs keep restoring it.
# The native-libs guard compares .so file names with the ABI directory stripped, so it holds for one ABI or four.
#
# Secrets are withheld on pull_request runs and design-overhaul pushes (always debug-signed; a manual run on design-overhaul is like main) and are only
# exposed to the decode and signing steps and the Gradle step, never to npm ci
# or expo prebuild. Main, tag and manual builds run in the protected GitHub
# environment `android-release`. See infra/README.md.
on:
  push:
    tags: ['v*']
    # design-overhaul is the default branch: a PR restores only its own, its base's and the default branch's caches, so its pushes
    # must save the ccache. They run the PR fast path (no environment, no secrets or variables, arm64-v8a only) just for that.
    branches: [main, design-overhaul]
    paths:
      - '.github/workflows/android-release.yml'
      - 'infra/scripts/android-signing.sh'
      - 'infra/scripts/android-release-config.sh'
      - 'infra/scripts/test-android-release-config.sh'
      - 'infra/scripts/check-api-url.sh'
      - 'infra/scripts/test-release-env.sh'
      - 'infra/scripts/test-android-ccache.sh'
      - 'infra/scripts/check-site-url.sh'
      - 'infra/scripts/test-check-site-url.sh'
      # the Android licence list (#835): a dependency change can change the release classpath
      - 'apps/mobile/package-lock.json'
      - 'apps/mobile/scripts/android-classpath.init.gradle'
      - 'apps/mobile/scripts/android-classpath.txt'
      - 'apps/mobile/scripts/licences.mjs'
      - 'apps/mobile/scripts/android-native-libs.txt'
      - 'apps/mobile/scripts/licence-texts/**'
      # our own Kotlin module (#943): built here, and its JVM unit tests run below
      - 'apps/mobile/modules/**'
      # the native project is generated from app.json and the local config plugins (#980): a change
      # to either can change the release classpath, the licence list or the native libraries, and
      # the guards below must run on it
      - 'apps/mobile/app.json'
      - 'apps/mobile/plugins/**'
  pull_request:
    paths:
      - '.github/workflows/android-release.yml'
      - 'infra/scripts/android-signing.sh'
      - 'infra/scripts/android-release-config.sh'
      - 'infra/scripts/test-android-release-config.sh'
      - 'infra/scripts/check-api-url.sh'
      - 'infra/scripts/test-release-env.sh'
      - 'infra/scripts/test-android-ccache.sh'
      - 'infra/scripts/check-site-url.sh'
      - 'infra/scripts/test-check-site-url.sh'
      # the Android licence list (#835): a dependency change can change the release classpath
      - 'apps/mobile/package-lock.json'
      - 'apps/mobile/scripts/android-classpath.init.gradle'
      - 'apps/mobile/scripts/android-classpath.txt'
      - 'apps/mobile/scripts/licences.mjs'
      - 'apps/mobile/scripts/android-native-libs.txt'
      - 'apps/mobile/scripts/licence-texts/**'
      # our own Kotlin modules (#943 reminders, #947 pose): built here, and their JVM unit tests run below
      - 'apps/mobile/modules/**'
      # the native project is generated from app.json and the local config plugins (#980): a change
      # to either can change the release classpath, the licence list or the native libraries, and
      # the guards below must run on it
      - 'apps/mobile/app.json'
      - 'apps/mobile/plugins/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: android (assembleRelease, bundleRelease)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    # PR runs and design-overhaul pushes (not manual runs) use no environment (and get no secrets); others use the protected one
    environment: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && 'android-release' || '' }}
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.ANDROID_API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic # MIT-only path; the default 'enhanced' loads proprietary gradle-actions-caching
      - run: npm ci
      - name: Release config script tests
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          shellcheck infra/scripts/android-release-config.sh infra/scripts/test-android-release-config.sh infra/scripts/check-api-url.sh infra/scripts/test-check-api-url.sh infra/scripts/check-site-url.sh infra/scripts/test-check-site-url.sh infra/scripts/test-release-env.sh infra/scripts/test-android-ccache.sh
          infra/scripts/test-check-api-url.sh
          infra/scripts/test-android-release-config.sh
          infra/scripts/test-check-site-url.sh
          infra/scripts/test-release-env.sh
          infra/scripts/test-android-ccache.sh
      - name: Set versionCode and check the API URL (CI checkout only, not committed)
        run: ../../infra/scripts/android-release-config.sh app.json
      - name: Release builds need the site URL (the privacy link Play requires)
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          SITE_URL_CHECK: ${{ vars.EXPO_PUBLIC_SITE_URL }}
        run: ../../infra/scripts/check-site-url.sh "$IS_RELEASE" "$SITE_URL_CHECK"
      - name: Generate the native project
        env:
          # the plugin adds the widget to the manifest only when this is exactly "1" at prebuild (#1295); same value as the Gradle step
          EXPO_PUBLIC_HOME_WIDGET: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && vars.EXPO_PUBLIC_HOME_WIDGET || '' }}
        run: npx expo prebuild --platform android --no-install
      # ccache for the CMake/NDK build. CMake reads CMAKE_<LANG>_COMPILER_LAUNCHER from the environment (set on the build step).
      # Key: OS + NDK version (from React Native's pinned version); no lockfile hash, since ccache is content-addressed and a
      # stale entry only wastes space. The run id suffix on saves lets every main run store its objects.
      - name: ccache key (NDK version)
        id: ccache-key
        run: |
          ndk=$(sed -n 's/^ndkVersion *= *"\([0-9.]*\)".*/\1/p' node_modules/react-native/gradle/libs.versions.toml)
          [ -n "$ndk" ] || { echo "::error::cannot read the NDK version from react-native's libs.versions.toml"; exit 1; }
          echo "prefix=ccache-${RUNNER_OS}-ndk${ndk}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache-key.outputs.prefix }}-${{ github.run_id }}
          restore-keys: ${{ steps.ccache-key.outputs.prefix }}-
      - name: Install ccache
        run: command -v ccache >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ccache; }
      # The size cap lives in the cache dir's ccache.conf (so every step that prints stats or trims sees 2G, not the 5 GiB
      # default), and the counters are zeroed because the restored dir carries the cumulative counters of earlier runs.
      # Sloppiness is ccache's documented setting for precompiled headers (manual 4.9, "Precompiled headers"); it is stored in the
      # same ccache.conf. Clang also needs -fno-pch-timestamp and -include-pch; Reanimated, worklets and expo-modules-core already
      # set them in their CMake, so PCH compiles are expected to hit from the second main run after this lands (the first run
      # saves them; pull requests never save).
      - name: Set the ccache size cap and sloppiness, and zero its counters
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          ccache -M 2G -z
          # time_macros applies to every compile: a future dependency using __DATE__ or __TIME__ keeps the value from its first
          # cached build.
          ccache --set-config sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
      - name: Local modules unit tests and lint (NewApi against minSdk)
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon -q :plate-reminders:testDebugUnitTest :plate-reminders:lintDebug :plate-pose:testDebugUnitTest :plate-pose:lintDebug :plate-barcode-scanner:lintDebug :plate-label-scanner:testDebugUnitTest :plate-label-scanner:lintDebug :device-steps:lintDebug
      # About lists the Android libraries from the committed apps/mobile/scripts/android-classpath.txt (#835). Resolve the
      # real releaseRuntimeClasspath with a plain-Gradle init script (no plugin) and fail if an artifact has no licence row
      # in scripts/licences.mjs or the list differs from the committed one. No secrets reach this step.
      - name: Android licence list matches the resolved release classpath
        id: classpath
        working-directory: apps/mobile/android
        run: |
          ./gradlew --no-daemon --no-configuration-cache -q -I ../scripts/android-classpath.init.gradle :app:writeReleaseClasspath -PclasspathOut="$RUNNER_TEMP/android-classpath.txt"
          node ../scripts/licences.mjs --classpath "$RUNNER_TEMP/android-classpath.txt"
      - name: Upload the resolved classpath (copy it over scripts/android-classpath.txt)
        if: failure() && steps.classpath.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: android-classpath
          path: ${{ runner.temp }}/android-classpath.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Decode keystore (only when supplied)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks")
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Configure signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ../../infra/scripts/android-signing.sh android/app/build.gradle
      - name: Build APK and AAB
        working-directory: apps/mobile/android
        env:
          # read by Metro when Gradle bundles the JS; only this step, never npm ci
          # a PR run or design-overhaul push has no environment, so a repository-level variable must never reach its debug-signed artifacts
          EXPO_PUBLIC_SENTRY_DSN: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && vars.EXPO_PUBLIC_SENTRY_DSN || '' }}
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
          EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}
          # feature flags: the app enables each only on exactly "1"; unset or any other value = off. Blank on PR runs and design-overhaul pushes.
          EXPO_PUBLIC_BARCODE_SCAN: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && vars.EXPO_PUBLIC_BARCODE_SCAN || '' }}
          EXPO_PUBLIC_POSE_TRACKING: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && vars.EXPO_PUBLIC_POSE_TRACKING || '' }}
          EXPO_PUBLIC_LABEL_SCAN: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && vars.EXPO_PUBLIC_LABEL_SCAN || '' }}
          EXPO_PUBLIC_EXERCISE_MOTION: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && vars.EXPO_PUBLIC_EXERCISE_MOTION || '' }}
          EXPO_PUBLIC_LAB_REPORTS: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && vars.EXPO_PUBLIC_LAB_REPORTS || '' }}
          EXPO_PUBLIC_HOME_WIDGET: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && vars.EXPO_PUBLIC_HOME_WIDGET || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/design-overhaul') && secrets.ANDROID_KEY_PASSWORD || '' }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          CCACHE_COMPILERCHECK: content # the NDK is unpacked afresh on a runner, so its mtime would always miss
          CCACHE_MAXSIZE: 2G
        # Pull requests and design-overhaul pushes: arm64-v8a APK only (the bulk of the 30 minutes is compiling the NDK code four times and the AAB).
        # Push to main, push of a tag and manual runs: everything, as before.
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] || { [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/design-overhaul ]; }; then
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          else
            ./gradlew assembleRelease bundleRelease --no-daemon
          fi
      - name: ccache statistics
        if: always()
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: ccache -s -v
      # Saves only on main and design-overhaul (the default branch); pull requests restore the newest entry and never save or delete (see ccache-prune below).
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/design-overhaul') && steps.ccache-key.outputs.prefix != ''
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache-key.outputs.prefix }}-${{ github.run_id }}
      # About also lists the third-party native code inside the .so files (#904). Take the .so names of the APK just built and
      # fail if they differ from scripts/android-native-libs.txt or one has no notice entry in scripts/licences.mjs (NATIVE_SO).
      - name: Android native libraries match the committed list
        id: nativelibs
        run: |
          unzip -Z1 android/app/build/outputs/apk/release/*.apk 'lib/*.so' | sed 's#.*/##' | sort -u > "$RUNNER_TEMP/android-native-libs.txt"
          node scripts/licences.mjs --native-libs "$RUNNER_TEMP/android-native-libs.txt"
      - name: Upload the built .so names (copy them over scripts/android-native-libs.txt)
        if: failure() && steps.nativelibs.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: android-native-libs
          path: ${{ runner.temp }}/android-native-libs.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Signing mode
        run: |
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            echo "Signed with the supplied keystore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Debug-signed (no keystore secrets). Not uploadable to Google Play." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Delete decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  # Keeps the 10 GB cache quota from filling with one ~2 GB ccache entry per main run: after a green main or design-overhaul build (which saved
  # its entry) delete every `ccache-*` entry of that branch except the newest one. Never runs on pull requests. The only job with
  # `actions: write`; it needs no checkout and no secrets.
  ccache-prune:
    name: prune old ccache entries
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/design-overhaul') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete every ccache entry but the newest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash # bash -eo pipefail: a failing `gh cache list` fails the step instead of passing silently
        run: |
          gh cache list --ref "$GITHUB_REF" --key ccache- --sort created_at --order desc --limit 100 --json id,key --jq '.[1:][] | "\(.id) \(.key)"' |
            while read -r id key; do
              echo "deleting $key"
              gh cache delete "$id" || echo "::warning::could not delete cache $key (already gone?)"
            done
