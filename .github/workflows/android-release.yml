name: Android release build

# Builds an APK and an AAB with `expo prebuild` + Gradle. No EAS, no accounts.
# Without the keystore secrets the artefacts are debug-signed: installable for
# testing, NOT uploadable to Google Play. With them they are release-signed.
#
# Optional repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (base64 -w0 upload.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
#
# Repository variable (Settings > Secrets and variables > Actions > Variables):
#   ANDROID_API_URL            https://<API_HOST>/api/v1, baked into the build as EXPO_PUBLIC_API_URL. REQUIRED on v* tags (the job fails
#                              without it); optional, with a warning, on manual and PR runs. Not a secret.
# Optional variables of the `android-release` environment (all inert when unset; they reach only the Gradle step, which
# bundles the JS, never npm ci or expo prebuild):
#   EXPO_PUBLIC_SENTRY_DSN     error-tracking DSN baked into the build; empty = the app sends nothing. Set it only after the
#                              privacy page and the Play data-safety answers name crash reports (#748, #827).
#   EXPO_PUBLIC_SITE_URL       https origin of the website; the app hides its privacy, terms and deletion links without it (#825).
#                              REQUIRED on v* tags (the job fails without it: Play needs the privacy link).
# PR runs never get the DSN (no environment, and the workflow blanks it).
# EXPO_PUBLIC_SENTRY_ENVIRONMENT is set here, not by you: `production` on a v* tag, `staging` otherwise.
# android.versionCode comes from the tag (v1.2.3 -> 1002003) or, on non-tag runs, the run number; see
# infra/scripts/android-release-config.sh.
#
# Secrets are withheld on pull_request runs (always debug-signed) and are only
# exposed to the decode and signing steps and the Gradle step, never to npm ci
# or expo prebuild. Tag and manual builds run in the protected GitHub
# environment `android-release`. See infra/README.md.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/android-release.yml'
      - 'infra/scripts/android-signing.sh'
      - 'infra/scripts/android-release-config.sh'
      - 'infra/scripts/test-android-release-config.sh'
      - 'infra/scripts/check-api-url.sh'
      - 'infra/scripts/test-release-env.sh'
      - 'infra/scripts/check-site-url.sh'
      - 'infra/scripts/test-check-site-url.sh'
      # the Android licence list (#835): a dependency change can change the release classpath
      - 'apps/mobile/package-lock.json'
      - 'apps/mobile/scripts/android-classpath.init.gradle'
      - 'apps/mobile/scripts/android-classpath.txt'
      - 'apps/mobile/scripts/licences.mjs'
      - 'apps/mobile/scripts/android-native-libs.txt'
      - 'apps/mobile/scripts/licence-texts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: android (assembleRelease, bundleRelease)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    # PR runs use no environment (and get no secrets); others use the protected one
    environment: ${{ github.event_name != 'pull_request' && 'android-release' || '' }}
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.ANDROID_API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic # MIT-only path; the default 'enhanced' loads proprietary gradle-actions-caching
      - run: npm ci
      - name: Release config script tests
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          shellcheck infra/scripts/android-release-config.sh infra/scripts/test-android-release-config.sh infra/scripts/check-api-url.sh infra/scripts/test-check-api-url.sh infra/scripts/check-site-url.sh infra/scripts/test-check-site-url.sh infra/scripts/test-release-env.sh
          infra/scripts/test-check-api-url.sh
          infra/scripts/test-android-release-config.sh
          infra/scripts/test-check-site-url.sh
          infra/scripts/test-release-env.sh
      - name: Set versionCode and check the API URL (CI checkout only, not committed)
        run: ../../infra/scripts/android-release-config.sh app.json
      - name: Release builds need the site URL (the privacy link Play requires)
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          SITE_URL_CHECK: ${{ vars.EXPO_PUBLIC_SITE_URL }}
        run: ../../infra/scripts/check-site-url.sh "$IS_RELEASE" "$SITE_URL_CHECK"
      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
      # About lists the Android libraries from the committed apps/mobile/scripts/android-classpath.txt (#835). Resolve the
      # real releaseRuntimeClasspath with a plain-Gradle init script (no plugin) and fail if an artifact has no licence row
      # in scripts/licences.mjs or the list differs from the committed one. No secrets reach this step.
      - name: Android licence list matches the resolved release classpath
        id: classpath
        working-directory: apps/mobile/android
        run: |
          ./gradlew --no-daemon --no-configuration-cache -q -I ../scripts/android-classpath.init.gradle :app:writeReleaseClasspath -PclasspathOut="$RUNNER_TEMP/android-classpath.txt"
          node ../scripts/licences.mjs --classpath "$RUNNER_TEMP/android-classpath.txt"
      - name: Upload the resolved classpath (copy it over scripts/android-classpath.txt)
        if: failure() && steps.classpath.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: android-classpath
          path: ${{ runner.temp }}/android-classpath.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Decode keystore (only when supplied)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks")
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Configure signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ../../infra/scripts/android-signing.sh android/app/build.gradle
      - name: Build APK and AAB
        working-directory: apps/mobile/android
        env:
          # read by Metro when Gradle bundles the JS; only this step, never npm ci
          # a PR run has no environment, so a repository-level variable must never reach its debug-signed artifacts
          EXPO_PUBLIC_SENTRY_DSN: ${{ github.event_name != 'pull_request' && vars.EXPO_PUBLIC_SENTRY_DSN || '' }}
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
          EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      # About also lists the third-party native code inside the .so files (#904). Take the .so names of the APK just built and
      # fail if they differ from scripts/android-native-libs.txt or one has no notice entry in scripts/licences.mjs (NATIVE_SO).
      - name: Android native libraries match the committed list
        id: nativelibs
        run: |
          unzip -Z1 android/app/build/outputs/apk/release/*.apk 'lib/*.so' | sed 's#.*/##' | sort -u > "$RUNNER_TEMP/android-native-libs.txt"
          node scripts/licences.mjs --native-libs "$RUNNER_TEMP/android-native-libs.txt"
      - name: Upload the built .so names (copy them over scripts/android-native-libs.txt)
        if: failure() && steps.nativelibs.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: android-native-libs
          path: ${{ runner.temp }}/android-native-libs.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Signing mode
        run: |
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            echo "Signed with the supplied keystore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Debug-signed (no keystore secrets). Not uploadable to Google Play." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Delete decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
