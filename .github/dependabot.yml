version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Licence rule (#51): setup-gradle must stay on its MIT path
      # (cache-provider: basic). A major bump can change defaults or licensing,
      # so a human reviews it and edits this file.
      - dependency-name: "gradle/actions/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /packages/api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # CI runs Node 22; @types/node must not jump past it (#82)
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: npm
    directory: /packages/core
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # CI runs Node 22; @types/node must not jump past it (#82)
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
    ignore:
      # CI runs Node 22; @types/node must not jump past it (#82)
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: npm
    directory: /apps/site
    schedule:
      interval: weekly
    ignore:
      # CI runs Node 22; @types/node must not jump past it (#82)
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Boot 4 migration is a separate piece of work (#82)
      - dependency-name: "org.springframework.boot"
        update-types: ["version-update:semver-major"]
