version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Licence rule (#51): setup-gradle must stay on its MIT path
      # (cache-provider: basic). A major bump can change defaults or licensing,
      # so a human reviews it and edits this file.
      - dependency-name: "gradle/actions/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /packages/api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # CI runs Node 22; @types/node must not jump past it (#82)
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: npm
    directory: /packages/core
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # CI runs Node 22; @types/node must not jump past it (#82)
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
    ignore:
      # CI runs Node 22; @types/node must not jump past it (#82)
      - dependency-name: "@types/node"
        versions: [">=23"]
      # The Expo SDK pins exact React and native module versions, so bumping one
      # alone can pass Jest yet break at runtime. These move only with the SDK
      # upgrade (#58), which is also the path their security advisories arrive on.
      # ("expo*" covers "expo" and "expo-*"; "react-native*" covers
      # "react-native" and "react-native-*". @expo-google-fonts/* is deliberately
      # left out: it versions independently of the SDK.)
      - dependency-name: "expo*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "react-native*"
      - dependency-name: "@types/react"
      - dependency-name: "@types/jest"
      # eslint-plugin-react does not support ESLint 10, so a human reviews the
      # major bump (#113)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /apps/site
    schedule:
      interval: weekly
    ignore:
      # CI runs Node 22; @types/node must not jump past it (#82)
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    ignore:
      # CI runs Node 22; @types/node must not jump past it (#82)
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Boot 4 migration is a separate piece of work (#82)
      - dependency-name: "org.springframework.boot"
        update-types: ["version-update:semver-major"]
      # json-schema-validator 3.x is built on Jackson 3; the backend is on Jackson 2
      # until the Spring Boot 4 migration (#81). Migration itself is tracked in #416.
      - dependency-name: "com.networknt:json-schema-validator"
        versions: [">=3"]
